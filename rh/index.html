<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Pessoas — Ambimet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* Paleta do Guia rev. 10, seção 1.2 — os onze tokens com estes nomes, mais
   --cinza-txt (o cinza de letra, 4,62:1) e os pares fundo tingido + letra
   escura dos estados (paleta.css, identidade rev. 1). Nenhum # fora deste
   bloco. Aqua e laranja NUNCA são letra sobre branco (2,5:1). */
:root{
  /* marca */
  --azul:      #0b0047;  /* marinho Ambimet: cabeçalho, títulos, fundo do topo */
  --azul-esc:  #060030;  /* degradê do cabeçalho e estado pressionado  */
  --royal:     #2264dc;  /* ação primária: botão que salva, link       */
  --cobalto:   #5a8cff;  /* realce e foco SOBRE fundo escuro           */
  --aqua:      #01b4d4;  /* acento da marca: barra, detalhe, ícone     */
  /* estado */
  --verde:     #1a9c66;  /* concluído, dentro do prazo, aprovado       */
  --verm:      #d9403a;  /* erro, atraso, exclusão                     */
  --lar:       #e8912d;  /* atenção, vence em breve, pendente          */
  /* superfície */
  --texto:     #25303c;  /* corpo de texto                             */
  --cinza:     #f4f6f9;  /* FUNDO da página e de cartão                */
  --borda:     #dde3ea;  /* linha de tabela, contorno de cartão        */
  --cinza-txt: #6b7684;  /* texto de apoio                             */
  /* pares de estado (paleta.css: .est-ok/.est-aten/.est-erro/.est-info) */
  --branco:      #ffffff;
  --verde-fundo: #e2f5ec; --verde-txt: #0f6b45;
  --lar-fundo:   #fdf1de; --lar-txt:   #8a5a00;
  --verm-fundo:  #fbe9e7; --verm-txt:  #a5352a;
  --azul-fundo:  #e9edfb; --azul-txt:  #1a54c0;
  --fonte-tela: 'Segoe UI', system-ui, Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fonte-tela);color:var(--texto);background:var(--cinza);font-size:14px}
a{color:var(--royal)}
h1,h2,h3{color:var(--azul);margin:.2em 0}
h2{font-size:20px}h3{font-size:16px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px}
.btn{background:var(--royal);color:var(--branco)}
.btn:hover{background:var(--azul)}
.btn:disabled,.btn-sec:disabled,.btn-perigo:disabled{opacity:.45;cursor:not-allowed}
.btn-sec{background:var(--branco);color:var(--royal);border:1px solid var(--borda)}
.btn-sec:hover{background:var(--azul-fundo)}
.btn-mini{padding:5px 10px;font-size:12.5px}
.btn-perigo{background:var(--branco);color:var(--verm-txt);border:1px solid var(--verm-fundo)}
.btn-perigo:hover{background:var(--verm-fundo)}
input,select,textarea{font-family:inherit;padding:9px 11px;border:1px solid var(--borda);border-radius:8px;width:100%;font-size:14px;background:var(--branco);color:var(--texto)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto;transform:scale(1.15);margin-right:6px}
label{font-size:13px;font-weight:600;color:var(--cinza-txt);display:block;margin:10px 0 4px}
.hide{display:none!important}
.card{background:var(--branco);border:1px solid var(--borda);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.mut{color:var(--cinza-txt);font-size:12.5px}
.msg{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
.msg-ok{background:var(--verde-fundo);color:var(--verde-txt)}
.msg-erro{background:var(--verm-fundo);color:var(--verm-txt)}
.msg-aviso{background:var(--lar-fundo);color:var(--lar-txt)}
.msg-info{background:var(--azul-fundo);color:var(--azul-txt)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--verde-fundo);color:var(--verde-txt)}
.b-aten{background:var(--lar-fundo);color:var(--lar-txt)}
.b-erro{background:var(--verm-fundo);color:var(--verm-txt)}
.b-info{background:var(--azul-fundo);color:var(--azul-txt)}
.link{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--royal);cursor:pointer}
.rodape{text-align:center;color:var(--cinza-txt);font-size:11.5px;margin:14px 0}
/* tabelas largas rolam dentro do próprio contêiner (prompt §10) */
.tabela{overflow-x:auto;border:1px solid var(--borda);border-radius:10px}
table{width:100%;border-collapse:collapse;background:var(--branco);font-size:13.5px}
th{background:var(--azul);color:var(--branco);text-align:left;padding:9px 11px;font-weight:600;font-size:12.5px;white-space:nowrap}
td{padding:8px 11px;border-bottom:1px solid var(--borda);vertical-align:middle}
tr:hover td{background:var(--cinza)}
.vazio{padding:22px;text-align:center;color:var(--cinza-txt)}
.linha-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.linha-acoes > div{flex:1;min-width:160px}
/* topo */
#top{background:linear-gradient(90deg,var(--azul),var(--azul-esc));color:var(--branco);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
#top .marca{display:flex;align-items:center;gap:12px}
#top .marca img{height:26px;width:auto;display:block}
#top .marca .risco{width:1px;height:22px;background:var(--cobalto);opacity:.5}
#top .logo{font-weight:800;font-size:18px;letter-spacing:.3px}
#top .logo span{color:var(--aqua)}
#top .btn-topo{background:transparent;border:1px solid var(--cobalto);color:var(--branco);text-decoration:none;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:7px;white-space:nowrap}
#top .btn-topo:hover{background:var(--azul-esc)}
#top .u{font-size:13px;opacity:.9}
#top .versao{font-size:11px;opacity:.75;margin-left:10px}
nav{background:var(--branco);border-bottom:1px solid var(--borda);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;color:var(--cinza-txt);border-radius:0;border-bottom:3px solid transparent;padding:14px 14px;white-space:nowrap}
nav button.on{color:var(--azul);border-bottom-color:var(--aqua)}
main{max-width:none;width:100%;margin:20px auto;padding:0 24px}
@media(max-width:600px){main{padding:0 12px}#top{padding:10px 12px}nav{padding:0 8px}}
.sub{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sub button{background:var(--branco);color:var(--cinza-txt);border:1px solid var(--borda)}
.sub button.on{background:var(--azul);color:var(--branco);border-color:var(--azul)}
/* login */
#login{max-width:400px;margin:8vh auto;padding:0 20px}
.marca-login{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.marca-login img{width:190px;max-width:70%;height:auto}
.marca-login b{font-size:17px;color:var(--azul);font-weight:700}
/* véu de carregando (Guia §5.1) — o logo fica PARADO, só a barra anda */
#veu{position:fixed;inset:0;background:rgba(244,246,249,.82);display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:14px}
#veu.on{display:flex}
#veu img{width:150px;height:auto}
#veu .barra{width:150px;height:4px;background:var(--borda);border-radius:2px;overflow:hidden}
#veu .barra i{display:block;width:40%;height:100%;background:var(--aqua);animation:veu 1s infinite linear}
@keyframes veu{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
/* dashboard */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filtros > div{min-width:150px}
.faixa-t{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--cinza-txt);margin:6px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--branco);border:1px solid var(--borda);border-left:4px solid var(--aqua);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:var(--royal)}
.kpi.sem{cursor:default;border-left-color:var(--borda)}
.kpi .t{font-size:12.5px;color:var(--cinza-txt);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;color:var(--azul);margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--cinza-txt)}
.kpi.pn{border-left:1px solid var(--borda);padding:12px 13px 10px;flex:1;min-width:170px;margin:0}
.kpi.pn:hover{border-color:var(--royal)}.kpi.pn.sem:hover{border-color:var(--borda)}
.pn-cab{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pn-cab .filtros{margin-bottom:0}
.pn-cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pn .topo{display:flex;align-items:center;gap:9px}
.pn .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:var(--azul-fundo)}
.pn .v{font-size:22px;font-weight:700;line-height:1.05;margin:0;color:var(--azul)}
.pn .v .nd{font-size:13px;font-weight:600;color:var(--cinza-txt)}
.pn .t{font-size:11.5px;font-weight:400;color:var(--cinza-txt);margin-top:1px}
.pn .var{font-size:10.5px;margin-top:6px}
.pn .var.boa{color:var(--verde-txt)}.pn .var.ruim{color:var(--verm-txt)}.pn .var.neutra{color:var(--cinza-txt)}
.pn .ctx{font-size:10.5px;color:var(--cinza-txt);margin-top:6px}
.t-verde .ic{background:var(--verde-fundo)}.t-verde .v{color:var(--verde-txt)}
.t-verm .ic{background:var(--verm-fundo)}.t-verm .v{color:var(--verm-txt)}
.t-lar .ic{background:var(--lar-fundo)}.t-lar .v{color:var(--lar-txt)}
.t-royal .v{color:var(--royal)}.t-aqua .v{color:var(--azul-txt)}.t-cobalto .v{color:var(--cobalto)}
.t-neutro .ic{background:var(--cinza)}.t-neutro .v{color:var(--cinza-txt)}
.info{cursor:help;color:var(--cobalto);font-size:11px}
.pn-linha{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pn-linha > .card{flex:1;min-width:280px;margin:0}
.pn-h3{margin:0 0 8px;font-size:14px;color:var(--azul)}
.pn-rosca{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pn-rosca .caixa{width:160px;height:160px;flex:none;position:relative}
.pn-rosca .leg{flex:1;min-width:150px}
.pn-leg{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 0;cursor:default}
.pn-leg[role=button]{cursor:pointer}.pn-leg[role=button]:hover .nome{text-decoration:underline}
.pn-leg.zero{opacity:.55}
.pn-leg .bola{width:9px;height:9px;border-radius:50%;flex:none}
.pn-leg .nome{flex:1}.pn-leg .qtd{color:var(--cinza-txt);min-width:28px;text-align:right}
.pn-barra{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
.pn-barra .nome{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-barra .trilho{flex:1;height:8px;background:var(--cinza);border-radius:5px;overflow:hidden}
.pn-barra .trilho span{display:block;height:8px;background:var(--royal);border-radius:5px}
.cfg-item{display:grid;grid-template-columns:1fr minmax(120px,auto) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--borda)}
.cfg-item:first-of-type{border-top:0}
@media(max-width:640px){.cfg-item{grid-template-columns:1fr}}
.cfg-txt .mut{font-size:12.5px}
.cfg-chave{font-size:11px;color:var(--cinza-txt);margin-top:2px}.cfg-chave code{font-size:11px}
.cfg-num{font-size:20px;font-weight:700;color:var(--azul)}
.cfg-longo{font-size:12px;color:var(--cinza-txt);max-width:340px;white-space:pre-wrap}
.cfg-chips{display:flex;flex-wrap:wrap;gap:4px;max-width:360px}
.pend{display:flex;flex-direction:column;gap:6px}
.pend-g{border:1px solid var(--borda);border-radius:10px;background:var(--branco)}
.pend-g summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600}
.pend-g ul{margin:0;padding:0 14px 10px 34px}
.pend-g li{padding:3px 0}
.graficos{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:900px){.graficos{grid-template-columns:1fr}}
.graf{position:relative;height:260px}
.agenda li{padding:4px 0}
/* modal próprio: nada de prompt()/confirm() do navegador */
.modal-fundo{position:fixed;inset:0;background:rgba(11,0,71,.35);display:flex;align-items:center;justify-content:center;z-index:150;padding:16px}
.modal-caixa{background:var(--branco);border-radius:12px;padding:20px 22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal-caixa.larga{max-width:860px}
.modal-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
/* funil (kanban): colunas rolam na horizontal dentro do próprio contêiner */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.col{min-width:220px;flex:1;background:var(--cinza);border:1px solid var(--borda);border-radius:10px;padding:8px}
.col-t{font-weight:700;color:var(--azul);font-size:13px;margin:2px 4px 8px}
.cartao{background:var(--branco);border:1px solid var(--borda);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.cartao[draggable=true]{cursor:grab}
.cartao input[type=checkbox]{float:right}
/* impressão do feedback (F-151): só a área de impressão vai para o papel */
#print-area{display:none}
@media print{
  body{background:var(--branco)}
  #app,#login,#veu,#modal,#painel-teste{display:none!important}
  #print-area{display:block!important;font:11px Arial,sans-serif;color:var(--texto)}
  .pf-cab,.pf{width:100%;border-collapse:collapse;margin-bottom:8px}
  .pf-cab td,.pf td{border:1px solid var(--texto);padding:5px 7px;vertical-align:top;background:var(--branco)!important;color:var(--texto)}
  .pf tr{page-break-inside:avoid}
  .pf-hash{font-size:9px;color:var(--cinza-txt);word-break:break-all}
  @page{size:A4;margin:14mm}
}
</style></head><body>

<script>
/* ============================================================
   TIPO DO LINK — lido na PRIMEIRA linha (Guia §8.1): o cliente do
   Supabase consome o "#access_token=...&type=..." e o apaga.
   ============================================================ */
const LINK_TIPO = (() => {
  try { return new URLSearchParams((location.hash||'').replace(/^#/,'')).get('type') || ''; }
  catch(e){ return ''; }
})();

// ===================== VERSÃO (Guia §6) =====================
const VERSAO = 'v23 · 29/09/2026';

/* ============================================================
   AVISO DE CARREGANDO (Guia §5.1, Modelo E) — um bloco por sistema, no
   TOPO do script, antes de qualquer if. Intercepta a fetch para o
   Supabase: 250 ms antes de mostrar, 350 ms de carência antes de fechar,
   300 ms de permanência mínima.
   ============================================================ */
(function(){
  var n = 0, tMostrar = null, tEsconder = null, desde = 0;
  var PERMANENCIA = 300;
  function veu(){ return document.getElementById('veu'); }
  function mostrar(){ var v = veu(); if(!v) return; if(!v.classList.contains('on')){ v.classList.add('on'); desde = Date.now(); } }
  function esconder(){
    var v = veu(); if(!v) return;
    var falta = PERMANENCIA - (Date.now() - desde);
    if(v.classList.contains('on') && falta > 0){ tEsconder = setTimeout(esconder, falta); return; }
    v.classList.remove('on');
  }
  function comecou(){
    clearTimeout(tEsconder); tEsconder = null; // chegou trabalho: cancela o fechamento
    if(++n === 1){ clearTimeout(tMostrar); tMostrar = setTimeout(mostrar, 250); }
  }
  function acabou(){
    if(--n <= 0){
      n = 0; clearTimeout(tMostrar);
      clearTimeout(tEsconder); tEsconder = setTimeout(esconder, 350);
    }
  }
  var orig = window.fetch;
  if(typeof orig !== 'function') return;
  window.fetch = function(){
    var url = '';
    try { var a = arguments[0]; url = String((a && a.url) || a || ''); } catch(e){}
    if(url.indexOf('supabase.co') < 0) return orig.apply(this, arguments);
    comecou();
    // as duas mãos: erro de rede TAMBÉM baixa o contador, senão o véu
    // fica na tela para sempre depois de uma queda de conexão.
    return orig.apply(this, arguments).then(
      function(r){ acabou(); return r; },

async function podeAcessar(){
  try{
    const { data:{ user } } = await db.auth.getUser();
    if(!user) return false;
    const { data, error } = await db.from('permissoes').select('modulo').eq('email', user.email.toLowerCase());
    if(error) return false;
    MODS = (data || []).map(p => p.modulo).filter(m => PERFIS.includes(m));
    // rh_salarios libera VALORES, não pessoas: sozinho não dá escopo nenhum
    // (fn_rh_escopo devolve nulo). Precisa vir junto de rh, rh_view ou rh_admin.
    return MODS.some(m => m !== 'rh_salarios');
  }catch(e){ MODS = []; return false; }
}

async function gravarSenha(prefixo, caixaMsg){
  const a = $(prefixo + '-1').value || '', b = $(prefixo + '-2').value || '';
  if(a.length < SENHA_MINIMA){ msg(caixaMsg, `A senha precisa ter pelo menos ${SENHA_MINIMA} caracteres.`, 'erro'); return false; }
  if(a !== b){ msg(caixaMsg, 'As duas senhas não são iguais.', 'erro'); return false; }

  return true;
}

async function salvarSenha(){
  if(!(await gravarSenha('ds', 'ds-msg'))) return;
  history.replaceState(null, '', location.pathname + location.search);  // o token não fica no histórico
  location.reload();
}
function modalSenha(){
  modal(`<h3>Alterar senha</h3>${formSenha('ms')}<div id="ms-msg"></div>
    <div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button>
    <button class="btn" id="ms-ok">Salvar</button></div>`);
  $('ms-ok').onclick = async () => { if(await gravarSenha('ms', 'ms-msg')){ fecharModal(); } };
}

async function iniciar(){
  const ok = await podeAcessar();
  if(!ok){
    $('login').classList.remove('hide');
    $('login').innerHTML = `<div class="card"><h2>Sem acesso</h2><p>Sua conta não tem permissão no módulo de Gestão de Pessoas. Fale com o responsável pelo RH.</p>
      ${MODS.includes('rh_salarios') ? '<p class="mut">O perfil de salários só vale junto de um perfil de RH (rh, rh_view ou rh_admin).</p>' : ''}
      <button class="btn-sec" onclick="sair()">Trocar de conta</button></div>`;
    return;
  }
  const { data:{ user } } = await db.auth.getUser();
  USER = user;
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('u-email').textContent = user.email;
  $('u-versao').textContent = VERSAO;
  $('app-rodape').textContent = VERSAO;
  montarNav();
  await carregarIA();
  irPara('painel');
}

function abas(){
  const a = [['painel', 'Painel'], ['mural', 'Mural']];
  if(EMPRESA()) a.push(['colaboradores', 'Colaboradores']);
  else if(tem('rh_gestor')) a.push(['colaboradores', 'Minha equipe']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['feedbacks', 'Feedbacks']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['recrutamento', 'Recrutamento']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['admissoes', 'Admissões']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['desempenho', 'Desempenho']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['desenvolvimento', 'Desenvolvimento']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['okr', 'OKR']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['clima', 'Clima']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['tecnica', 'Competência técnica']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['desligamentos', 'Desligamentos']);
  if(tem('rh', 'rh_view', 'rh_admin', 'rh_gestor')) a.push(['indicadores', 'Indicadores']);
  if(EMPRESA()) a.push(['estrutura', 'Estrutura']);
  if(tem('rh_colab')) a.push(['meu', 'Meu RH']);
  if(ADMIN()) a.push(['config', 'Configurações'], ['auditoria', 'Auditoria']);
  return a;
}
let ABA = 'painel';
function montarNav(){
  $('nav').innerHTML = abas().map(([id, t]) => `<button data-a="${id}" onclick="irPara('${id}')">${esc(t)}</button>`).join('');
}
function irPara(id, arg){
  // 'feedback' (um feedback aberto) não é aba: qualquer perfil chega nele pela
  // lista ou pela pendência — quem pode ler cada um decide a RLS
  if(id !== 'feedback' && !abas().some(a => a[0] === id)) id = 'painel';
  ABA = id;
  const aba = id === 'feedback' ? (abas().some(a => a[0] === 'feedbacks') ? 'feedbacks' : 'meu') : id;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.a === aba));
  ({ painel:vPainel, colaboradores:vColaboradores, estrutura:vEstrutura, meu:vMeu, feedbacks:vFeedbacks, recrutamento:vRecrutamento, admissoes:vAdmissoes, desempenho:vDesempenho, desenvolvimento:vDesenvolvimento, okr:vOkr, clima:vClima, tecnica:vTecnica, desligamentos:vDesligamentos, mural:vMural, indicadores:vIndicadores,
     feedback:abrirFeedback, config:vConfig, auditoria:vAuditoria })[id](arg);
}

let AREAS = null, SETORES = null;
async function carregarAreas(forcar){
  if(AREAS && !forcar) return AREAS;
  const { data } = await db.from('rh_areas').select('*').order('ordem').order('nome');
  AREAS = data || []; return AREAS;
}
async function carregarSetores(){
  if(SETORES) return SETORES;
  const { data } = await db.rpc('fn_rh_setores');
  SETORES = data || []; return SETORES;
}

/* =====================================================================
   PAINEL — prompt §7.1 item 1. Tudo vem de UMA chamada a fn_rh_dashboard;
   nenhum número é somado aqui. Esta fase acende: pendências, quadro,
   gráficos de quadro e agenda. Cada fase seguinte acende os seus blocos.
   ===================================================================== */
let F_PAINEL = { preset:'30', inicio:'', fim:'', area:'', setor:'' };
let DASH = null, GRAFS = [];
function periodoDoPreset(p){
  const h = hoje(), d = new Date(h + 'T12:00:00');
  if(p === 'mes')  return [h.slice(0,8) + '01', h];
  if(p === 'tri'){ const m = Math.floor(d.getMonth() / 3) * 3; return [iso(new Date(d.getFullYear(), m, 1, 12)), h]; }
  if(p === '12m')  return [somaDias(h, -364), h];
  if(p === 'pers') return [F_PAINEL.inicio || somaDias(h, -29), F_PAINEL.fim || h];
  return [somaDias(h, -29), h];
}
async function vPainel(){
  const [ini, fim] = periodoDoPreset(F_PAINEL.preset);
  F_PAINEL.inicio = ini; F_PAINEL.fim = fim;
  const { data, error } = await db.rpc('fn_rh_dashboard', { p_inicio: ini, p_fim: fim,
    p_area: F_PAINEL.area === '' ? null : Number(F_PAINEL.area), p_setor: F_PAINEL.setor === '' ? null : Number(F_PAINEL.setor) });
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  DASH = data;
  const esc0 = data.meta.escopo;
  if(esc0 === 'proprio'){
    el(htmlPendencias(data) + htmlMeu(data.meu) + (data.feedback ? htmlFeedbackBloco(data) : '')
       + `<div class="mut" style="margin-top:6px">Atualizado em ${esc(fmtDataHora(data.meta.atualizado_em))}.</div>`);
    return;
  }
  let h = await htmlCabecalhoPainel(data);
  h += htmlPendencias(data);
  if(data.quadro) h += htmlQuadro(data) + htmlGraficos(data);
  if(data.pessoas) h += htmlPerfilQuadro(data);
  if(data.recrutamento) h += htmlRecrutamentoBloco(data);
  if(data.admissoes) h += htmlAdmissoesBloco(data);
  if(data.desempenho) h += htmlDesempenhoBloco(data);
  if(data.desenvolvimento) h += htmlDesenvolvimentoBloco(data);
  if(data.okr) h += htmlOkrBloco(data);
  if(data.clima) h += htmlClimaBloco(data);
  if(data.tecnica) h += htmlTecnicaBloco(data);
  h += htmlFase6Bloco(data);
  if(data.feedback) h += htmlFeedbackBloco(data);
  if(data.feedback_mapa) h += htmlMapaFeedback(data.feedback_mapa);
  if((data.entrevistas_semana || []).length) h += htmlEntrevistasBloco(data.entrevistas_semana);
  h += htmlAgenda(data);
  h += `<div class="mut" style="margin-top:6px">Atualizado em ${esc(fmtDataHora(data.meta.atualizado_em))}.
        Período ${fmtData(data.meta.inicio)} a ${fmtData(data.meta.fim)}, comparado a ${fmtData(data.meta.anterior_inicio)} a ${fmtData(data.meta.anterior_fim)}.
        Passe o mouse no ⓘ de cada número para ver como ele é calculado; clique no cartão para ver as pessoas que o formam.</div>`;
  el(h);
  desenharGraficos(data);
}

/* ---- peças do painel no desenho do EPI: cartão com ícone, variação e minigráfico ---- */
// minigráfico em SVG (sem Chart.js: vários gráficos de 26px pesam e vazam memória)
function _spark(vals, tokenCor){
  if(!vals || vals.length < 2 || vals.every(x => x === vals[0])) return '';
  const W = 104, H = 26, max = Math.max(...vals), min = Math.min(...vals), amp = (max - min) || 1;
  const pts = vals.map((x, i) => [(i / (vals.length - 1)) * W, H - 3 - ((x - min) / amp) * (H - 6)]);
  const linha = pts.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join(' ');
  const id = 'sp' + Math.random().toString(36).slice(2, 8);
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;margin-top:7px" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(${tokenCor});stop-opacity:.28"/>
      <stop offset="1" style="stop-color:var(${tokenCor});stop-opacity:0"/></linearGradient></defs>
    <polygon points="0,${H} ${linha} ${W},${H}" fill="url(#${id})"/>
    <polyline points="${linha}" style="fill:none;stroke:var(${tokenCor});stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round"/></svg>`;
}
// variação contra o período anterior. subirEhRuim: desligamento e turnover subindo é notícia ruim
function _variacao(atual, anterior, subirEhRuim, casas, suf){
  if(atual === null || atual === undefined || anterior === null || anterior === undefined) return null;
  const delta = Number(atual) - Number(anterior);
  if(Math.abs(delta) < 0.0001) return { txt: '— igual ao período anterior', cls: 'neutra' };
  // subirEhRuim === null: movimento que não é bom nem ruim por si (ex.: admitir mais ou menos)
  const cls = subirEhRuim === null ? 'neutra' : (subirEhRuim ? delta < 0 : delta > 0) ? 'boa' : 'ruim';
  const sufAnt = suf === ' p.p.' ? '%' : (suf || '');
  return { txt: `${delta > 0 ? '▲' : '▼'} ${fmtNum(Math.abs(delta), casas || 0)}${suf || ''} vs. anterior (${fmtNum(anterior, casas || 0)}${sufAnt})`, cls };
}
function pnCard({ ic, lab, val, tom, variacao, spark, ctx, clique, formula }){
  return `<div class="kpi pn t-${tom || 'azul'}${clique ? '' : ' sem'}" ${clique ? `onclick="${clique}" role="button" tabindex="0"` : ''}>
    <div class="topo"><div class="ic" aria-hidden="true">${ic}</div>
      <div style="min-width:0"><div class="v">${val === null || val === undefined ? '<span class="nd">sem dados no período</span>' : val}</div>
        <div class="t">${esc(lab)}${formula ? ` <span class="info" title="Como calculamos: ${esc(formula)}">ⓘ</span>` : ''}</div></div></div>
    ${variacao ? `<div class="var ${variacao.cls}">${esc(variacao.txt)}</div>` : ''}
    ${spark || (ctx ? `<div class="ctx">${esc(ctx)}</div>` : '')}</div>`;
}
// legenda em HTML (com % e contagem), como no EPI — o Chart.js desenha só a rosca
function pnLegenda(itens, total, cores, clique){
  return itens.map((x, i) => `<div class="pn-leg ${x.n ? '' : 'zero'}" ${clique ? `onclick="${clique(x)}" role="button" tabindex="0"` : ''}>

function podeAbrirPend(x){
  if(x.admissao_testemunha) return true;
  if(x.feedback_id || x.candidatura_id || x.admissao_id || x.avaliacao_id || x.participante_id || x.pdi_id || x.one_on_one_id || x.pesquisa_id || x.autorizacao_id || x.questionario_id || x.desligamento_id || x.comunicado_id) return true;
  if(x.okr_id) return abas().some(a => a[0] === 'okr') || x.codigo === 'okr_checkin';
  if(x.posicao_id) return abas().some(a => a[0] === 'okr');
  if(x.ciclo_id) return abas().some(a => a[0] === 'desempenho');
  if(['apt_pendente', 'doc_vencendo'].includes(x.codigo) && x.id) return true;

      ['Retenção de quem entrou em 12 meses (%)', p.retencao_novos_pct, p.formulas.retencao_novos_pct], ['Em experiência', p.em_experiencia, p.formulas.em_experiencia],
      ['Pessoas por gestor', p.liderados_por_gestor, p.formulas.liderados_por_gestor], ['Gestores', p.gestores, ''], ['Sem gestor', p.sem_gestor, '']];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ind.map(([a, b, c]) => ({ Indicador: a, Valor: b, 'Como calculamos': c }))), 'Perfil');
    const dist = [].concat(p.tempo_de_casa.map(x => ({ Recorte: 'Tempo de casa', Faixa: x.faixa, Pessoas: x.n })), p.faixa_etaria.map(x => ({ Recorte: 'Faixa etária', Faixa: x.faixa, Pessoas: x.n })),
      p.por_contrato.map(x => ({ Recorte: 'Contrato', Faixa: x.tipo, Pessoas: x.n })), p.por_setor.map(x => ({ Recorte: 'Setor', Faixa: x.setor, Pessoas: x.n })),
      p.por_funcao.map(x => ({ Recorte: 'Função', Faixa: x.funcao, Pessoas: x.n })));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dist), 'Distribuições');
  }
  const ra = DASH.recrutamento_analise;
  if(ra) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([
      { Indicador: 'Conversão em contratação (%)', Valor: ra.conversao_pct, 'Como calculamos': ra.formulas.conversao_pct },
      { Indicador: 'Dias para preencher a vaga', Valor: ra.tempo_para_preencher_dias, 'Como calculamos': ra.formulas.tempo_para_preencher_dias },
      { Indicador: 'Dias da candidatura ao aceite', Valor: ra.tempo_para_contratar_dias, 'Como calculamos': ra.formulas.tempo_para_contratar_dias }]
    .concat(ra.funil.map(x => ({ Indicador: 'Funil: ' + x.etapa, Valor: x.n, 'Como calculamos': 'candidaturas ativas nesta etapa, vagas abertas' })))
    .concat(ra.por_origem.map(x => ({ Indicador: 'Origem: ' + x.origem, Valor: x.n, 'Como calculamos': x.contratados + ' contratado(s)' })))), 'Recrutamento');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((DASH.pendencias || []).map(p => ({ Tipo: TITULO_PEND[p.codigo] || p.codigo, Nome: p.nome, Detalhe: p.titulo, Prazo: p.prazo || '' }))), 'Pendências');
  XLSX.writeFile(wb, `RH - painel ${DASH.meta.inicio} a ${DASH.meta.fim}.xlsx`);
}

/* =====================================================================
   COLABORADORES — lidos do DP por fn_rh_pessoas, já no escopo de quem vê.
   O rh só acrescenta o GESTOR (com período). Cadastro, função, setor e
   contrato se corrigem no DP.
   ===================================================================== */
let PESSOAS = [], F_COL = { busca:'', area:'' }, APT = {};
async function vColaboradores(){
  const [{ data, error }, , { data: apt }] = await Promise.all([db.rpc('fn_rh_pessoas'), carregarAreas(), db.rpc('fn_rh_aptidao_quadro')]);
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  PESSOAS = data || [];
  APT = Object.fromEntries((apt || []).map(x => [x.colaborador_id, x]));
  el(`<div class="card"><div class="linha-acoes">
      <div><label for="fc-busca">Buscar por nome ou função</label><input id="fc-busca" value="${esc(F_COL.busca)}" oninput="F_COL.busca=this.value;pintarColab()"></div>
      <div><label for="fc-area">Área</label><select id="fc-area" onchange="F_COL.area=this.value;pintarColab()">
        <option value="">Todas</option>${AREAS.map(a => `<option value="${a.id}" ${String(F_COL.area) === String(a.id) ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}
        <option value="0" ${F_COL.area === '0' ? 'selected' : ''}>Sem área definida</option></select></div></div>
      <p class="mut" style="margin-bottom:0">Os dados de cadastro vêm do DP e se corrigem lá. Aqui se define o <b>gestor</b> de cada pessoa.</p></div>
    <div id="col-lista"></div>`);
  pintarColab();
}
const semAcento = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function pintarColab(){
  const b = semAcento(F_COL.busca);
  const lista = PESSOAS.filter(p => (!b || semAcento(p.nome + ' ' + (p.funcao || '')).includes(b))
    && (F_COL.area === '' || String(p.area_id || 0) === String(F_COL.area)));
  $('col-lista').innerHTML = !PESSOAS.length
    ? `<div class="card"><div class="vazio">${tem('rh_gestor') && !EMPRESA() ? 'Ninguém está na sua equipe ainda. Quem define a equipe é o RH, na ficha de cada pessoa.' : 'Nenhuma pessoa ativa no cadastro do DP.'}</div></div>`
    : `<div class="mut" style="margin:0 0 8px">${lista.length} de ${PESSOAS.length} pessoa(s)</div><div class="tabela"><table>
      <tr><th>Nome</th><th>Função</th><th>Área</th><th>Setor</th><th>Gestor</th><th>Admissão</th><th>Contrato</th><th>Requisitos do cargo</th><th></th></tr>
      ${lista.map(p => `<tr><td>${esc(p.nome)}</td><td>${esc(p.funcao || '—')}</td>
        <td>${p.area ? esc(p.area) : '<span class="badge b-aten">sem área</span>'}</td><td>${esc(p.setor || '—')}</td>
        <td>${p.gestor_nome ? esc(p.gestor_nome) : '<span class="badge b-info">sem gestor</span>'}</td>
        <td>${fmtData(p.data_admissao)}</td><td>${esc(CONTRATOS[p.tipo_contrato] || p.tipo_contrato || '—')}</td>
        <td>${badgeApt(APT[p.id])}</td>
        <td style="white-space:nowrap"><button class="btn-sec btn-mini" onclick="abrirFichaColab('${p.id}')">Ficha</button>${EDITA() ? ` <button class="btn-sec btn-mini" onclick="modalGestor('${p.id}')">Gestor</button>` : ''}</td></tr>`).join('')}
      </table></div>`;
}
async function modalGestor(idPessoa){
  const p = PESSOAS.find(x => x.id === idPessoa); if(!p) return;
  const { data: hist } = await db.from('rh_lotacoes').select('*').eq('colaborador_id', idPessoa).order('inicio', { ascending:false });
  const nome = id => (PESSOAS.find(x => x.id === id) || {}).nome || 'pessoa fora do quadro ativo';
  const opcoes = PESSOAS.filter(x => x.id !== idPessoa);
  modal(`<h3>Gestor de ${esc(p.nome)}</h3>
    <label for="mg-gestor">Novo gestor</label><select id="mg-gestor"><option value="">— escolha —</option>
      ${opcoes.map(x => `<option value="${x.id}" ${x.id === p.gestor_id ? 'selected' : ''}>${esc(x.nome)}${x.funcao ? ' · ' + esc(x.funcao) : ''}</option>`).join('')}</select>
    <label for="mg-inicio">A partir de</label><input id="mg-inicio" type="date" value="${hoje()}">
    <label for="mg-obs">Observação (opcional)</label><input id="mg-obs">
    <div id="mg-msg"></div>
    <div class="modal-acoes">${p.gestor_id ? `<button class="btn-perigo" id="mg-encerrar">Deixar sem gestor</button>` : ''}
      <button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="mg-ok">Salvar</button></div>
    <h3 style="margin-top:18px">Histórico</h3>
    ${(hist || []).length ? `<div class="tabela"><table><tr><th>Gestor</th><th>De</th><th>Até</th><th>Obs.</th></tr>
      ${hist.map(h => `<tr><td>${esc(nome(h.gestor_id))}</td><td>${fmtData(h.inicio)}</td><td>${h.fim ? fmtData(h.fim) : 'vigente'}</td><td>${esc(h.observacao || '')}</td></tr>`).join('')}</table></div>`
      : '<div class="mut">Ainda sem histórico.</div>'}`, { larga:true });
  $('mg-ok').onclick = async () => {
    if(!v('mg-gestor') || !v('mg-inicio')) return msg('mg-msg', 'Escolha o gestor e a data.', 'erro');
    const { error } = await db.rpc('fn_rh_definir_gestor', { p_colaborador: idPessoa, p_gestor: v('mg-gestor'), p_inicio: v('mg-inicio'), p_obs: v('mg-obs') || null });
    if(error) return msg('mg-msg', erroDe(error), 'erro');
    fecharModal(); vColaboradores();
  };
  if($('mg-encerrar')) $('mg-encerrar').onclick = async () => {
    if(!(await confirmar('Deixar sem gestor', `O período atual de ${p.nome} termina hoje. A pessoa volta para a lista de pendências.`, 'Encerrar'))) return;
    const { error } = await db.rpc('fn_rh_encerrar_gestor', { p_colaborador: idPessoa, p_fim: hoje() });
    if(error) return modal(`<div class="msg msg-erro">${esc(erroDe(error))}</div>`);
    vColaboradores();
  };
}

/* =====================================================================
   ESTRUTURA — áreas, cargos (função do DP + o que o rh sabe dela),
   competências com âncoras, requisitos por cargo. Configuração, não código
   (prompt §5.11): nenhuma área tem regra própria no JavaScript.
   ===================================================================== */
let SUB_EST = 'cargos';
function vEstrutura(sub){
  if(sub) SUB_EST = sub;
  const subs = [['cargos','Cargos e áreas'], ['areas','Áreas'], ['competencias','Competências'], ['beneficios','Benefícios']].concat(tem('rh_salarios') ? [['faixas','Faixas salariais']] : []);
  if(SUB_EST === 'faixas' && !tem('rh_salarios')) SUB_EST = 'cargos';
  el(`<div class="sub">${subs.map(([id, t]) => `<button class="${SUB_EST === id ? 'on' : ''}" onclick="vEstrutura('${id}')">${t}</button>`).join('')}</div>
      <div id="est"></div>`);
  ({ cargos:estCargos, areas:estAreas, competencias:estCompetencias, faixas:estFaixas, beneficios:estBeneficios })[SUB_EST]();
}
const est = h => { $('est').innerHTML = h; };
const soLeitura = () => !EDITA() ? `<div class="msg msg-info">Você tem acesso de consulta: pode ver, não alterar.</div>` : '';

// ---- cargos ----
let FUNCOES = [];
async function estCargos(){
  const [{ data, error }] = await Promise.all([db.rpc('fn_rh_funcoes'), carregarAreas(true)]);
  if(error) return est(`<div class="msg msg-erro">${esc(erroDe(error))}</div>`);
  FUNCOES = data || [];
  const ativas = AREAS.filter(a => a.ativo);
  est(`${soLeitura()}<div class="card"><p class="mut" style="margin-top:0">As funções vêm do DP. Aqui o RH diz a <b>área</b> de cada uma e descreve o cargo:
      competências esperadas e requisitos (NR, EPI, exame, CNH, conselho, autorização 17025).</p>
    <div class="tabela"><table><tr><th>Função (DP)</th><th>Pessoas ativas</th><th>Área</th><th></th></tr>
    ${FUNCOES.map(f => `<tr><td>${esc(f.funcao)}${f.ativa_dp ? '' : ' <span class="badge b-aten">inativa no DP</span>'}</td><td>${f.pessoas}</td>
      <td>${EDITA() ? `<select aria-label="Área de ${esc(f.funcao)}" onchange="definirArea(${f.funcao_id}, this.value)"><option value="">— sem área —</option>
          ${ativas.map(a => `<option value="${a.id}" ${a.id === f.area_id ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}</select>`
        : (f.area ? esc(f.area) : '<span class="badge b-aten">sem área</span>')}</td>
      <td><button class="btn-sec btn-mini" onclick="abrirCargo(${f.funcao_id})">Descrição e requisitos</button></td></tr>`).join('')
      || '<tr><td colspan="4" class="vazio">O DP ainda não tem funções cadastradas.</td></tr>'}</table></div></div>`);
}
async function garantirCargo(funcaoId){
  const f = FUNCOES.find(x => x.funcao_id === funcaoId);
  if(f && f.cargo_id) return f.cargo_id;
  const { data, error } = await db.from('rh_cargos').insert({ funcao_id: funcaoId }).select('id').single();
  if(error) throw error;
  if(f) f.cargo_id = data.id;
  return data.id;
}
async function definirArea(funcaoId, areaId){
  try{
    const id = await garantirCargo(funcaoId);
    const { error } = await db.from('rh_cargos').update({ area_id: areaId === '' ? null : Number(areaId) }).eq('id', id);
    if(error) throw error;
  }catch(e){ modal(`<h3>Não foi possível salvar</h3><div class="msg msg-erro">${esc(erroDe(e))}</div><div class="modal-acoes"><button class="btn" onclick="fecharModal()">Ok</button></div>`); estCargos(); }
}
const REQ_TIPOS = { nr:'NR (treinamento)', epi:'Kit de EPI', exame:'Exame (PCMSO)', cnh:'CNH', conselho:'Registro em conselho', autorizacao_17025:'Autorização ISO 17025', outro:'Outro' };
async function abrirCargo(funcaoId){
  const f = FUNCOES.find(x => x.funcao_id === funcaoId); if(!f) return;
  let cargo = null, comps = [], reqs = [];
  if(f.cargo_id){
    const [c, cc, r] = await Promise.all([
      db.from('rh_cargos').select('*').eq('id', f.cargo_id).single(),
      db.from('rh_cargo_competencias').select('*').eq('cargo_id', f.cargo_id),
      db.from('rh_cargo_requisitos').select('*').eq('cargo_id', f.cargo_id).order('tipo')]);
    cargo = c.data; comps = cc.data || []; reqs = r.data || [];
  }
  const { data: todas } = await db.from('rh_competencias').select('id, nome, tipo').eq('ativo', true).order('nome');
  const { data: ativTec } = await db.from('rh_atividades_tecnicas').select('id, codigo, nome').eq('ativo', true).order('codigo');
  const ro = !EDITA() ? 'disabled' : '';
  const campo = (id, rot, val, area) => `<label for="${id}">${rot}</label>${area
    ? `<textarea id="${id}" ${ro}>${esc(val || '')}</textarea>` : `<input id="${id}" value="${esc(val || '')}" ${ro}>`}`;
  const nomeComp = c => ((todas || []).find(t => t.id === c.competencia_id) || {}).nome || '(competência inativa)';
  modal(`<h3>${esc(f.funcao)}</h3><div class="mut">Área: ${esc(f.area || 'não definida')} · ${f.pessoas} pessoa(s) ativa(s)</div>
    ${soLeitura()}
    <div class="g2">${campo('cg-nivel', 'Nível', cargo && cargo.nivel)}${campo('cg-formacao', 'Formação exigida', cargo && cargo.formacao)}</div>
    ${campo('cg-missao', 'Missão do cargo', cargo && cargo.missao, true)}
    ${campo('cg-desc', 'Descrição', cargo && cargo.descricao, true)}
    ${campo('cg-resp', 'Responsabilidades', cargo && cargo.responsabilidades, true)}
    ${campo('cg-exp', 'Experiência exigida', cargo && cargo.experiencia)}
    <div id="cg-msg"></div>
    ${EDITA() ? `<div class="modal-acoes"><button class="btn" id="cg-salvar">Salvar descrição</button></div>` : ''}
    <h3 style="margin-top:16px">Competências esperadas</h3>
    ${comps.length ? `<div class="tabela"><table><tr><th>Competência</th><th>Nível alvo</th><th>Peso</th>${EDITA() ? '<th></th>' : ''}</tr>
      ${comps.map(c => `<tr><td>${esc(nomeComp(c))}</td><td>${c.nivel_alvo}</td><td>${fmtNum(c.peso, 1)}</td>
        ${EDITA() ? `<td><button class="btn-perigo btn-mini" onclick="tirarComp(${c.id}, ${funcaoId})">Tirar</button></td>` : ''}</tr>`).join('')}</table></div>`
      : '<div class="mut">Nenhuma competência definida para este cargo.</div>'}
    ${EDITA() ? `<div class="linha-acoes" style="margin-top:8px">
      <div><label for="cc-comp">Competência</label><select id="cc-comp"><option value="">— escolha —</option>
        ${(todas || []).filter(t => !comps.some(c => c.competencia_id === t.id)).map(t => `<option value="${t.id}">${esc(t.nome)} (${t.tipo === 'tecnica' ? 'técnica' : 'organizacional'})</option>`).join('')}</select></div>
      <div style="max-width:110px"><label for="cc-nivel">Nível alvo</label><select id="cc-nivel">${[1,2,3,4,5].map(n => `<option ${n === 3 ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div style="max-width:100px"><label for="cc-peso">Peso</label><input id="cc-peso" type="number" min="0.1" step="0.1" value="1"></div>
      <div style="flex:0"><button class="btn-sec" id="cc-add">Incluir</button></div></div>` : ''}
    <h3 style="margin-top:16px">Requisitos do cargo</h3>
    ${reqs.length ? `<div class="tabela"><table><tr><th>Tipo</th><th>Descrição</th><th>Validade</th><th>Obrigatório</th>${EDITA() ? '<th></th>' : ''}</tr>
      ${reqs.map(r => `<tr><td>${esc(REQ_TIPOS[r.tipo] || r.tipo)}</td><td>${esc(r.descricao)}${r.tipo === 'autorizacao_17025' ? `<div class="mut">${r.atividade_id ? 'atividade ' + esc(((ativTec || []).find(a => a.id === r.atividade_id) || {}).codigo || '?') : '<span class="badge b-aten">ligue a uma atividade técnica</span>'}</div>` : ''}</td><td>${r.validade_meses ? r.validade_meses + ' meses' : '—'}</td>
        <td>${r.obrigatorio ? 'sim' : 'não'}</td>${EDITA() ? `<td><button class="btn-perigo btn-mini" onclick="tirarReq(${r.id}, ${funcaoId})">Tirar</button></td>` : ''}</tr>`).join('')}</table></div>`
      : '<div class="mut">Nenhum requisito. Cargo sem requisito é normal (boa parte do administrativo).</div>'}
    ${EDITA() ? `<div class="linha-acoes" style="margin-top:8px">
      <div><label for="rq-tipo">Tipo</label><select id="rq-tipo">${Object.entries(REQ_TIPOS).map(([k, t]) => `<option value="${k}">${esc(t)}</option>`).join('')}</select></div>
      <div><label for="rq-desc">Descrição</label><input id="rq-desc" placeholder="ex.: NR-35, CNH B, CREA"></div>
      <div style="max-width:130px"><label for="rq-val">Validade (meses)</label><input id="rq-val" type="number" min="1"></div>
      <div><label for="rq-ativ">Atividade técnica (só para 17025)</label><select id="rq-ativ"><option value="">—</option>${(ativTec || []).map(a => `<option value="${a.id}">${esc(a.codigo)} — ${esc(a.nome)}</option>`).join('')}</select></div>
      <div style="flex:0"><button class="btn-sec" id="rq-add">Incluir</button></div></div>` : ''}
    <div id="cg-msg2"></div>
    <div class="modal-acoes"><button class="btn-sec" onclick="fecharModal();estCargos()">Fechar</button></div>`, { larga:true, fixo:true });
  if(!EDITA()) return;
  $('cg-salvar').onclick = async () => {
    try{
      const id = await garantirCargo(funcaoId);
      const { error } = await db.from('rh_cargos').update({ nivel: v('cg-nivel') || null, formacao: v('cg-formacao') || null,
        missao: v('cg-missao') || null, descricao: v('cg-desc') || null, responsabilidades: v('cg-resp') || null, experiencia: v('cg-exp') || null }).eq('id', id);
      if(error) throw error;
      msg('cg-msg', 'Descrição salva.', 'ok');
    }catch(e){ msg('cg-msg', erroDe(e), 'erro'); }
  };
  $('cc-add').onclick = async () => {
    if(!v('cc-comp')) return msg('cg-msg2', 'Escolha a competência.', 'erro');
    try{
      const id = await garantirCargo(funcaoId);
      const { error } = await db.from('rh_cargo_competencias').insert({ cargo_id: id, competencia_id: Number(v('cc-comp')),
        nivel_alvo: Number(v('cc-nivel')), peso: Number(v('cc-peso') || 1) });
      if(error) throw error;
      abrirCargo(funcaoId);
    }catch(e){ msg('cg-msg2', erroDe(e), 'erro'); }
  };
  $('rq-add').onclick = async () => {
    if(!v('rq-desc')) return msg('cg-msg2', 'Descreva o requisito (ex.: NR-35).', 'erro');
    try{
      const id = await garantirCargo(funcaoId);
      if(v('rq-tipo') === 'autorizacao_17025' && !v('rq-ativ')) return msg('cg-msg2', 'Autorização 17025: escolha a atividade técnica (Competência técnica → Atividades).', 'erro');
      const { error } = await db.from('rh_cargo_requisitos').insert({ cargo_id: id, tipo: v('rq-tipo'), descricao: v('rq-desc'),
        validade_meses: v('rq-val') ? Number(v('rq-val')) : null, atividade_id: v('rq-tipo') === 'autorizacao_17025' ? Number(v('rq-ativ')) : null });
      if(error) throw error;
      abrirCargo(funcaoId);
    }catch(e){ msg('cg-msg2', /duplicate|unique/i.test(erroDe(e)) ? 'Esse requisito já está no cargo.' : erroDe(e), 'erro'); }
  };
}
async function tirarComp(id, funcaoId){
  const { error } = await db.from('rh_cargo_competencias').delete().eq('id', id).select('id');
  if(error) return msg('cg-msg2', erroDe(error), 'erro');
  abrirCargo(funcaoId);
}
async function tirarReq(id, funcaoId){
  const { data, error } = await db.from('rh_cargo_requisitos').delete().eq('id', id).select('id');
  if(error) return msg('cg-msg2', erroDe(error), 'erro');
  if(!data || !data.length) return msg('cg-msg2', 'Só o responsável pelo RH (rh_admin) exclui requisito.', 'aviso');
  abrirCargo(funcaoId);
}

// ---- áreas ----
async function estAreas(){
  await carregarAreas(true);
  est(`${soLeitura()}<div class="card"><p class="mut" style="margin-top:0">A área agrupa funções para filtros, indicadores e anonimato das pesquisas.
      Ela não muda regra nenhuma do sistema: o que muda por área é configuração (competências, requisitos, provas).</p>
    <div class="tabela"><table><tr><th>Área</th><th>Descrição</th><th>Ordem</th><th>Situação</th>${EDITA() ? '<th></th>' : ''}</tr>
    ${AREAS.map(a => `<tr><td>${esc(a.nome)}</td><td>${esc(a.descricao || '')}</td><td>${a.ordem}</td>
      <td>${a.ativo ? '<span class="badge b-ok">ativa</span>' : '<span class="badge b-aten">inativa</span>'}</td>
      ${EDITA() ? `<td><button class="btn-sec btn-mini" onclick="editarArea(${a.id})">Editar</button></td>` : ''}</tr>`).join('')
      || '<tr><td colspan="5" class="vazio">Nenhuma área. Crie a primeira abaixo.</td></tr>'}</table></div>
    ${EDITA() ? `<div style="margin-top:12px"><button class="btn" onclick="editarArea(null)">Nova área</button></div>` : ''}</div>`);
}
function editarArea(id){
  const a = AREAS.find(x => x.id === id) || { nome:'', descricao:'', ordem:100, ativo:true };
  modal(`<h3>${id ? 'Editar área' : 'Nova área'}</h3>
    <label for="ar-nome">Nome</label><input id="ar-nome" value="${esc(a.nome)}">
    <label for="ar-desc">Descrição</label><input id="ar-desc" value="${esc(a.descricao || '')}">

      <div><label for="ar-ativo">Situação</label><select id="ar-ativo"><option value="1" ${a.ativo ? 'selected' : ''}>ativa</option><option value="0" ${!a.ativo ? 'selected' : ''}>inativa</option></select></div></div>
    <div id="ar-msg"></div>
    <div class="modal-acoes">${id && ADMIN() ? `<button class="btn-perigo" id="ar-del">Excluir</button>` : ''}
      <button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="ar-ok">Salvar</button></div>`);
  $('ar-ok').onclick = async () => {
    if(!v('ar-nome')) return msg('ar-msg', 'Informe o nome.', 'erro');
    const reg = { nome: v('ar-nome'), descricao: v('ar-desc') || null, ordem: Number(v('ar-ordem') || 100), ativo: v('ar-ativo') === '1' };
    const { error } = id ? await db.from('rh_areas').update(reg).eq('id', id) : await db.from('rh_areas').insert(reg);
    if(error) return msg('ar-msg', /duplicate|unique/i.test(erroDe(error)) ? 'Já existe uma área com esse nome.' : erroDe(error), 'erro');
    AREAS = null; fecharModal(); estAreas();
  };
  if($('ar-del')) $('ar-del').onclick = async () => {
    const { data, error } = await db.from('rh_areas').delete().eq('id', id).select('id');
    if(error) return msg('ar-msg', /foreign key|violates/i.test(erroDe(error))
      ? 'Há funções ou competências nesta área. Marque como inativa em vez de excluir.' : erroDe(error), 'erro');
    if(!data || !data.length) return msg('ar-msg', 'Não foi possível excluir.', 'erro');
    AREAS = null; fecharModal(); estAreas();
  };
}

  est(`${soLeitura()}<div class="card"><p class="mut" style="margin-top:0"><b>Organizacionais</b> (os valores da Ambimet) valem para todos.
      <b>Técnicas</b> podem ser de uma área. Cada nível de 1 a 5 tem uma <b>âncora</b>: o comportamento que se vê naquele nível — é o que torna a nota comparável.</p>
    <div class="tabela"><table><tr><th>Competência</th><th>Tipo</th><th>Área</th><th>Âncoras</th><th>Situação</th><th></th></tr>
    ${(comps || []).map(c => `<tr><td>${esc(c.nome)}</td><td>${c.tipo === 'tecnica' ? 'técnica' : 'organizacional'}</td><td>${esc(areaNome(c.area_id) || (c.tipo === 'tecnica' ? 'todas' : '—'))}</td>
      <td>${nNiveis(c.id) === 5 ? '<span class="badge b-ok">5 de 5</span>' : `<span class="badge b-aten">${nNiveis(c.id)} de 5</span>`}</td>
      <td>${c.ativo ? 'ativa' : 'inativa'}</td><td><button class="btn-sec btn-mini" onclick="editarComp(${c.id})">${EDITA() ? 'Editar' : 'Ver'}</button></td></tr>`).join('')
      || '<tr><td colspan="6" class="vazio">Nenhuma competência cadastrada. Os valores da Ambimet entram aqui como competências organizacionais.</td></tr>'}</table></div>
    ${EDITA() ? `<div style="margin-top:12px"><button class="btn" onclick="editarComp(null)">Nova competência</button></div>` : ''}</div>`);
}
async function editarComp(id){
  let c = { nome:'', tipo:'organizacional', area_id:null, descricao:'', ativo:true }, niv = [];
  if(id){
    const [a, b] = await Promise.all([db.from('rh_competencias').select('*').eq('id', id).single(),
      db.from('rh_competencia_niveis').select('*').eq('competencia_id', id).order('nivel')]);
    c = a.data; niv = b.data || [];
  }
  const ro = !EDITA() ? 'disabled' : '';
  const anc = n => (niv.find(x => x.nivel === n) || {}).ancora || '';
  modal(`<h3>${id ? esc(c.nome) : 'Nova competência'}</h3>
    <label for="cp-nome">Nome</label><input id="cp-nome" value="${esc(c.nome)}" ${ro}>
    <div class="g2"><div><label for="cp-tipo">Tipo</label><select id="cp-tipo" ${ro} onchange="$('cp-area').disabled=this.value!=='tecnica'">
        <option value="organizacional" ${c.tipo === 'organizacional' ? 'selected' : ''}>organizacional (todos)</option>
        <option value="tecnica" ${c.tipo === 'tecnica' ? 'selected' : ''}>técnica</option></select></div>
      <div><label for="cp-area">Área (só técnica)</label><select id="cp-area" ${ro || c.tipo !== 'tecnica' ? 'disabled' : ''}><option value="">todas as áreas</option>
        ${AREAS.filter(a => a.ativo).map(a => `<option value="${a.id}" ${a.id === c.area_id ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}</select></div></div>
    <label for="cp-desc">Descrição</label><textarea id="cp-desc" ${ro}>${esc(c.descricao || '')}</textarea>
    <h3 style="margin-top:14px">Âncoras por nível</h3>
    <p class="mut">O que a pessoa FAZ em cada nível. Ex.: nível 1 — "precisa de orientação para…"; nível 5 — "é referência e ensina…".</p>
    ${[1,2,3,4,5].map(n => `<label for="cp-n${n}">Nível ${n}</label><textarea id="cp-n${n}" style="min-height:52px" ${ro}>${esc(anc(n))}</textarea>`).join('')}
    <div id="cp-msg"></div>
    <div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">${EDITA() ? 'Cancelar' : 'Fechar'}</button>
      ${EDITA() ? `<button class="btn" id="cp-ok">Salvar</button>` : ''}</div>`, { larga:true, fixo:true });
  if(!EDITA()) return;
  $('cp-ok').onclick = async () => {
    if(!v('cp-nome')) return msg('cp-msg', 'Informe o nome.', 'erro');
    const reg = { nome: v('cp-nome'), tipo: v('cp-tipo'), area_id: v('cp-tipo') === 'tecnica' && v('cp-area') ? Number(v('cp-area')) : null,
                  descricao: v('cp-desc') || null };
    try{
      let cid = id;
      if(id){ const { error } = await db.from('rh_competencias').update(reg).eq('id', id); if(error) throw error; }
      else { const { data, error } = await db.from('rh_competencias').insert(reg).select('id').single(); if(error) throw error; cid = data.id; }
      for(const n of [1,2,3,4,5]){
        const texto = v('cp-n' + n), atual = niv.find(x => x.nivel === n);
        if(texto && atual && atual.ancora !== texto){ const { error } = await db.from('rh_competencia_niveis').update({ ancora: texto }).eq('id', atual.id); if(error) throw error; }
        else if(texto && !atual){ const { error } = await db.from('rh_competencia_niveis').insert({ competencia_id: cid, nivel: n, ancora: texto }); if(error) throw error; }
      }
      fecharModal(); estCompetencias();
    }catch(e){ msg('cp-msg', /duplicate|unique/i.test(erroDe(e)) ? 'Já existe uma competência com esse nome.' : erroDe(e), 'erro'); }
  };
}

const rec = h => { $('rec').innerHTML = h; };
let RQS = [];

  const { data, error } = await db.rpc('fn_rh_requisicoes_lista');

  const cargos = (funcoes || []).filter(f => f.cargo_id);
  modal(`<h3>${idRq ? 'Editar requisição' : 'Nova requisição de vaga'}</h3>
    ${!cargos.length ? '<div class="msg msg-aviso">Nenhum cargo configurado ainda. O RH configura em Estrutura → Cargos e áreas.</div>' : ''}
    <div class="g2"><div><label for="rq-cargo">Cargo</label><select id="rq-cargo"><option value="">— escolha —</option>
        ${cargos.map(c => `<option value="${c.cargo_id}" ${c.cargo_id === r.cargo_id ? 'selected' : ''}>${esc(c.funcao)}</option>`).join('')}</select></div>
      <div><label for="rq-setor">Setor (DP)</label><select id="rq-setor"><option value="">—</option>${setores.map(s2 => `<option value="${s2.id}" ${s2.id === r.setor_id ? 'selected' : ''}>${esc(s2.nome)}</option>`).join('')}</select></div></div>
    <div class="g3"><div><label for="rq-qtd">Quantidade</label><input id="rq-qtd" type="number" min="1" value="${r.quantidade}"></div>

        <option value="aumento_quadro" ${r.motivo === 'aumento_quadro' ? 'selected' : ''}>Aumento de quadro</option>
        <option value="substituicao" ${r.motivo === 'substituicao' ? 'selected' : ''}>Substituição</option></select></div>
      <div><label for="rq-tipo">Contratação</label><select id="rq-tipo">${Object.entries(CONTRATACAO).map(([k2, t]) => `<option value="${k2}" ${k2 === r.tipo_contratacao ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div>
    <div id="rq-subst-box" class="${r.motivo === 'substituicao' ? '' : 'hide'}"><label for="rq-subst">Quem está sendo substituído</label>

    fecharModal(); vRecrutamento('requisicoes');

async function executarMassa(ids, acao, parametro){

// e-mails pela Edge Function rh-notificar (SMTP próprio). Sem SMTP: ficam na fila.
async function enviarEmails(ids){
  const caixa = $('env-msg') || $('fi-msg');
  const { data, error } = await db.functions.invoke('rh-notificar', { body: { ids } });
  let erro = null;
  if(error){ try { erro = (await error.context.json()).erro; } catch(e){ erro = 'Não foi possível enviar agora.'; } }
  if(caixa) caixa.innerHTML = erro ? `<div class="msg msg-aviso">${esc(erro)}</div>`
    : `<div class="msg msg-${data.erros ? 'aviso' : 'ok'}">${data.enviados} enviado(s)${data.erros ? `, ${data.erros} com erro` : ''}.</div>`;
  return { erro, data };
}

async function fichaAcao(id, acao){
  let r;
  if(acao === 'mover') r = await db.rpc('fn_rh_mover_etapa', { p_candidatura: id, p_etapa: Number(v('fi-etapa')), p_motivo: null });
  else if(acao === 'revisar') r = await db.rpc('fn_rh_revisar_alerta', { p_candidatura: id, p_nota: v('fi-nota') });
  else if(acao === 'desistiu') r = await db.rpc('fn_rh_encerrar_candidatura', { p_candidatura: id, p_status: 'desistiu', p_motivo: null, p_texto: null });
  else if(acao === 'reativar') r = await db.rpc('fn_rh_reativar_candidatura', { p_candidatura: id, p_motivo: v('fi-reat') });
  else if(acao === 'comentar') r = await db.rpc('fn_rh_comentar_candidatura', { p_candidatura: id, p_texto: v('fi-com') });
  else if(acao === 'reprovar'){
    r = await db.rpc('fn_rh_acao_em_massa', { p_candidaturas: [id], p_acao: 'reprovar', p_parametro: { motivo: v('fi-mot'), texto: v('fi-txt') || null, modelo_id: v('fi-mod') ? Number(v('fi-mod')) : null } });
    if(!r.error && r.data.falhas) r = { error: { message: r.data.resultados[0].erro } };
  } else if(acao === 'email'){
    r = await db.rpc('fn_rh_acao_em_massa', { p_candidaturas: [id], p_acao: 'mensagem', p_parametro: { modelo_id: Number(v('fi-wz')) } });
    if(!r.error && r.data.falhas) r = { error: { message: r.data.resultados[0].erro } };
    if(!r.error){ const e = await enviarEmails(r.data.mensagens); await abrirFicha(id); if(e.erro) msg('fi-msg', e.erro, 'aviso'); return; }
  } else if(acao === 'whatsapp'){
    r = await db.rpc('fn_rh_whatsapp', { p_modelo: Number(v('fi-wz')), p_candidatura: id });
    if(!r.error) window.open('https://wa.me/' + r.data.telefone + '?text=' + encodeURIComponent(r.data.texto), '_blank', 'noopener');
  }
  if(r && r.error) return msg('fi-msg', String(erroDe(r.error)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, ''), 'erro');
  abrirFicha(id);
}

let SC_FORM = null;
async function pintarSelecao(c){
  try { await pintarSelecao0(c); }
  catch(e){ if($('fi-sel')) $('fi-sel').innerHTML = `<div class="msg msg-erro">Não foi possível carregar a seleção: ${esc(e.message || e)}. Se estiver na demonstração, feche a janela preta e abra de novo.</div>`; }

    <div id="pa-det"></div>

  h += await htmlProposta(c);
  caixa.innerHTML = h + '<div id="sel-msg"></div>';

const selErro = e => msg('sel-msg', String(erroDe(e)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, ''), 'erro');
async function agendarEntrevista(idCand){
  if(!v('en-quando')) return msg('sel-msg', 'Informe a data e a hora.', 'erro');
  const { error } = await db.rpc('fn_rh_entrevista_salvar', { p_id: null, p: { candidatura_id: idCand, quando: new Date(v('en-quando')).toISOString(),
    duracao_min: Number(v('en-dur')) || 60, formato: v('en-fmt'), local: v('en-local'), entrevistadores: v('en-quem').split(/[,;\s]+/).filter(Boolean) } });
  if(error) return selErro(error);
  await abrirFicha(idCand);
  msg('sel-msg', 'Entrevista agendada. Ela já aparece no link de acompanhamento do candidato' + (EDITA() ? ' — avise por WhatsApp ou e-mail.' : '.'), 'ok');
}
// aviso da entrevista ao candidato, com dia, hora e local ({entrevista} no modelo "entrevista_agendada")
async function avisarEntrevista(canal, idCand){
  const m = (await carregarModelos()).find(x => x.chave === 'entrevista_agendada');
  if(!m) return msg('sel-msg', 'Modelo de mensagem "entrevista_agendada" não encontrado.', 'erro');
  if(canal === 'whatsapp'){
    const { data, error } = await db.rpc('fn_rh_whatsapp', { p_modelo: m.id, p_candidatura: idCand });
    if(error) return selErro(error);
    window.open('https://wa.me/' + data.telefone + '?text=' + encodeURIComponent(data.texto.trim()), '_blank', 'noopener');
    return;
  }
  const r = await db.rpc('fn_rh_acao_em_massa', { p_candidaturas: [idCand], p_acao: 'mensagem', p_parametro: { modelo_id: m.id } });
  if(r.error || r.data.falhas) return msg('sel-msg', r.error ? erroDe(r.error) : r.data.resultados[0].erro, 'erro');
  const e = await enviarEmails(r.data.mensagens);
  await abrirFicha(idCand);
  msg('sel-msg', e.erro ? e.erro + ' O e-mail ficou na fila.' : 'E-mail com a data da entrevista enviado ao candidato.', e.erro ? 'aviso' : 'ok');
}
async function entrevistaStatus(idEnt, st, idCand){
  const { error } = await db.rpc('fn_rh_entrevista_status', { p_id: idEnt, p_status: st });
  if(error) return selErro(error);
  abrirFicha(idCand);
}
async function salvarScorecard(idCand, enviar){
  const notas = SC_FORM.competencias.map(k => ({ competencia_id: k.id, nota: v('sc-n-' + k.id) ? Number(v('sc-n-' + k.id)) : null, evidencia: v('sc-e-' + k.id) }))
    .filter(n => n.nota != null);
  const curta = notas.find(n => n.evidencia.length < 10);
  if(curta) return msg('sc-msg', 'Cada nota precisa de evidência (pelo menos uma frase): o que a pessoa disse ou fez.', 'erro');
  // grava o rascunho primeiro: o confirmar troca o conteúdo do modal, e desistir
  // de enviar não pode perder o que foi escrito
  const p = { p_candidatura: idCand, p_notas: notas, p_parecer: v('sc-par') || null, p_parecer_texto: v('sc-txt') || null, p_enviar: false, p_entrevista: null };
  let { error } = await db.rpc('fn_rh_scorecard_salvar', p);
  if(error) return msg('sc-msg', String(erroDe(error)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, ''), 'erro');
  if(enviar){
    if(!(await confirmar('Enviar scorecard', 'Depois de enviado, o scorecard não muda. Você passa a ver os dos outros avaliadores.', 'Enviar'))) return abrirFicha(idCand);
    ({ error } = await db.rpc('fn_rh_scorecard_salvar', { ...p, p_enviar: true }));
  }
  await abrirFicha(idCand);
  if(error) msg('sel-msg', String(erroDe(error)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, ''), 'erro');
  else if(enviar) msg('sel-msg', 'Scorecard enviado.', 'ok');
}
// a escolha da prova na ficha: as vinculadas à vaga; se não houver, todas as ativas (com aviso)
function htmlEscolhaProva(provas, vps, idCand){
  const ativas = provas.filter(p => p.ativo), daVaga = ativas.filter(p => (vps || []).some(x => x.prova_id === p.id));
  const lista = daVaga.length ? daVaga : ativas;
  return `<div class="card" style="margin-top:8px"><b>Convidar para uma prova</b>
    ${daVaga.length ? '' : '<div class="msg msg-aviso">Nenhuma prova vinculada a esta vaga: mostrando todas as ativas. Vincule em "Provas desta vaga", na página da vaga.</div>'}
    <div class="linha-acoes"><div><label for="pv-sel">Qual prova${daVaga.length ? ' (as desta vaga)' : ''}</label><select id="pv-sel">${lista.length > 1 ? '<option value="">— escolha a prova —</option>' : ''}
      ${lista.map(p => `<option value="${p.id}">${esc(p.titulo)} (${p.tempo_minutos} min)</option>`).join('')}</select></div>
      <div style="flex:0"><button class="btn" onclick="convidarProva(${idCand})">Convidar</button></div></div>
    <div class="mut">Depois de convidar, mande o link direto: Copiar, WhatsApp ou E-mail (aparecem ao lado da prova).</div></div>`;
}
async function pintarVagaProvas(){
  const caixa = $('vaga-provas'); if(!caixa || !VG) return;
  const [{ data: vps }, { data: provas }] = await Promise.all([db.from('rh_vaga_provas').select('*').eq('vaga_id', VG.id),
    db.from('rh_provas').select('id,titulo,ativo,tempo_minutos').order('titulo')]);
  const nome = id => (provas || []).find(p => p.id === id) || { titulo: 'prova ' + id, tempo_minutos: '?' };
  const livres = (provas || []).filter(p => p.ativo && !(vps || []).some(x => x.prova_id === p.id));
  caixa.innerHTML = `<p class="mut" style="margin-top:0">As provas que esta vaga usa. Ao convidar um candidato, só elas aparecem para escolher.</p>
    ${(vps || []).map(x => `<div style="margin:4px 0">${esc(nome(x.prova_id).titulo)} <span class="mut">(${nome(x.prova_id).tempo_minutos} min)</span>
      ${EDITA() ? ` <button class="btn-perigo btn-mini" onclick="desvincularProva(${x.id})">Tirar</button>` : ''}</div>`).join('') || '<div class="mut">Nenhuma prova vinculada.</div>'}
    ${EDITA() && livres.length ? `<div class="linha-acoes"><div><select id="vp-sel" aria-label="Prova a vincular">${livres.map(p => `<option value="${p.id}">${esc(p.titulo)} (${p.tempo_minutos} min)</option>`).join('')}</select></div>
      <div style="flex:0"><button class="btn-sec" onclick="vincularProva()">Vincular à vaga</button></div></div>` : ''}
    ${EDITA() && !(provas || []).length ? '<div class="mut">Crie provas em Recrutamento → Provas.</div>' : ''}<div id="vp-msg"></div>`;
}
async function vincularProva(){
  const { error } = await db.from('rh_vaga_provas').insert({ vaga_id: VG.id, prova_id: Number(v('vp-sel')) });
  if(error) return msg('vp-msg', erroDe(error), 'erro');
  pintarVagaProvas();
}
async function desvincularProva(id){
  const { error } = await db.from('rh_vaga_provas').delete().eq('id', id);
  if(error) return msg('vp-msg', erroDe(error), 'erro');
  pintarVagaProvas();
}

async function emailInternosTodos(aps){
  const ids = [], sem = [];
  for(const a of aps){
    const { data, error } = await db.rpc('fn_rh_link_interno', { p_aplicacao: a, p_canal: 'email' });
    if(error) sem.push((INTERNAS.find(x => x.id === a) || {}).nome || a); else ids.push(data.mensagem_id);
  }
  const e = ids.length ? await enviarEmails(ids) : { erro: null, data: { enviados: 0 } };
  if(sem.length) msg('env-msg', `Sem e-mail no DP: ${sem.join(', ')}. Para essas, use Copiar ou WhatsApp.` + (e.erro ? ' ' + e.erro : ''), 'aviso');

const botoesLinkInterno = id => `<span style="white-space:nowrap"><button class="btn-sec btn-mini" onclick="linkInterno(${id}, 'copiar', this)">Copiar link</button>
  <button class="btn-sec btn-mini" onclick="linkInterno(${id}, 'whatsapp', this)">WhatsApp</button>
  <button class="btn-sec btn-mini" onclick="linkInterno(${id}, 'email', this)">E-mail</button></span>`;
async function linkInterno(id, canal, botao){
  const { data, error } = await db.rpc('fn_rh_link_interno', { p_aplicacao: id, p_canal: canal === 'copiar' ? null : canal });
  if(error) return msg('sel-msg', String(erroDe(error)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, ''), 'erro');
  if(canal === 'whatsapp'){ window.open('https://wa.me/?text=' + encodeURIComponent(data.texto + data.url), '_blank', 'noopener'); return; }
  if(canal === 'email'){
    const e = await enviarEmails([data.mensagem_id]);
    return msg('sel-msg', e.erro ? e.erro + ' O e-mail ficou na fila.' : 'E-mail com o link enviado para ' + data.email + '.', e.erro ? 'aviso' : 'ok');
  }
  try { await navigator.clipboard.writeText(data.url); if(botao) botao.textContent = 'Copiado'; } catch(e){}
  msg('sel-msg', 'Link (vale até ' + fmtDataHora(data.expira_em) + '): ' + data.url, 'ok');

      : `<div style="white-space:pre-wrap;background:var(--cinza);padding:8px;border-radius:6px">${esc((r && r.resposta) || 'em branco')}</div>

// links diretos ao candidato (prova, inventário, proposta): copiar, WhatsApp ou e-mail
const MODELO_LINK = { prova:'convite_prova', perfil:'convite_perfil', proposta:'proposta_enviada', candidatura:'link_acompanhamento' };
const botoesLink = (tipo, id, idCand) => ` <span style="white-space:nowrap"><button class="btn-sec btn-mini" onclick="linkCandidato('${tipo}', ${id}, 'copiar', ${idCand}, this)">Copiar link</button>
  <button class="btn-sec btn-mini" onclick="linkCandidato('${tipo}', ${id}, 'whatsapp', ${idCand}, this)">WhatsApp</button>
  <button class="btn-sec btn-mini" onclick="linkCandidato('${tipo}', ${id}, 'email', ${idCand}, this)">E-mail</button></span>`;
async function linkCandidato(tipo, id, canal, idCand, botao){
  const alvo = tipo === 'candidatura' && $('fi-link-msg') ? 'fi-link-msg' : 'sel-msg';   // a mensagem aparece perto do botão
  if(canal === 'email'){
    const m = (await carregarModelos()).find(x => x.chave === MODELO_LINK[tipo]);
    if(!m) return msg(alvo, 'Modelo de e-mail "' + MODELO_LINK[tipo] + '" não encontrado.', 'erro');
    const r = await db.rpc('fn_rh_acao_em_massa', { p_candidaturas: [idCand], p_acao: 'mensagem', p_parametro: { modelo_id: m.id } });
    if(r.error || r.data.falhas) return msg(alvo, r.error ? erroDe(r.error) : r.data.resultados[0].erro, 'erro');
    const e = await enviarEmails(r.data.mensagens);
    await abrirFicha(idCand);
    return msg($(alvo) ? alvo : 'sel-msg', e.erro ? e.erro + ' O e-mail ficou na fila.' : 'E-mail com o link enviado ao candidato.', e.erro ? 'aviso' : 'ok');
  }
  const { data, error } = await db.rpc('fn_rh_link_candidato', { p_tipo: tipo, p_id: id, p_canal: canal === 'whatsapp' ? 'whatsapp' : null });
  if(error) return selErro(error);
  if(canal === 'whatsapp'){ window.open('https://wa.me/' + data.telefone + '?text=' + encodeURIComponent(data.texto + data.url), '_blank', 'noopener'); return; }
  try { await navigator.clipboard.writeText(data.url); if(botao) botao.textContent = 'Copiado'; } catch(e){}
  msg(alvo, 'Link (vale até ' + fmtDataHora(data.expira_em) + '): ' + data.url, 'ok');
}
async function emailLinkMassa(ids, chave){
  const m = (await carregarModelos()).find(x => x.chave === chave);
  if(!m) return msg('env-msg', 'Modelo de e-mail não encontrado.', 'erro');
  const { data, error } = await db.rpc('fn_rh_acao_em_massa', { p_candidaturas: ids, p_acao: 'mensagem', p_parametro: { modelo_id: m.id } });
  if(error) return msg('env-msg', erroDe(error), 'erro');
  await enviarEmails(data.mensagens);
}

            <option value="multipla">Múltipla escolha</option><option value="dissertativa">Dissertativa</option></select></div>
          <div style="max-width:110px"><label for="nq-peso">Peso</label><input id="nq-peso" type="number" min="0.5" step="0.5" value="1"></div></div>
        <label for="nq-enun">Enunciado</label><textarea id="nq-enun"></textarea>
        <div id="nq-alt-box"><label for="nq-alt">Alternativas (uma por linha; viram a, b, c…)</label><textarea id="nq-alt"></textarea></div>
        <label for="nq-gab">Gabarito (letra certa, na múltipla; roteiro de correção, na dissertativa)</label><input id="nq-gab">
        <div id="nq-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="addQuestao(${p.id}, ${(qs || []).reduce((m, q) => Math.max(m, q.ordem), 0)})">Incluir</button></div>
        <div class="mut">Questão que já tem resposta de candidato não muda: para corrigir, crie outra.</div>` : ''}</div>`);
}
async function salvarProva(idP){
  const { error } = await db.from('rh_provas').update({ titulo: v('pp-tit'), tempo_minutos: Number(v('pp-tempo')), ativo: v('pp-ativo') === '1', instrucoes: v('pp-inst') || null }).eq('id', idP);
  if(error) return msg('pp-msg', /check/i.test(erroDe(error)) ? 'O tempo vai de 5 a 240 minutos.' : erroDe(error), 'erro');
  await abrirProva(idP); msg('pp-msg', 'Prova salva.', 'ok');
}
async function addQuestao(idP, maxOrdem){
  const tipo = v('nq-tipo');
  if(!v('nq-enun')) return msg('nq-msg', 'Escreva o enunciado.', 'erro');
  const alternativas = tipo === 'multipla' ? v('nq-alt').split('\n').map(t => t.trim()).filter(Boolean).map((t, i) => ({ letra: String.fromCharCode(97 + i), texto: t.replace(/^[a-z]\)\s*/i, '') })) : null;
  const gab = tipo === 'multipla' ? v('nq-gab').toLowerCase().replace(/[^a-z]/g, '') : v('nq-gab');
  if(tipo === 'multipla' && (alternativas.length < 2 || !alternativas.some(a => a.letra === gab))) return msg('nq-msg', 'Na múltipla escolha: pelo menos duas alternativas, e o gabarito é a letra de uma delas.', 'erro');
  const { error } = await db.from('rh_prova_questoes').insert({ prova_id: idP, ordem: maxOrdem + 1, tipo, enunciado: v('nq-enun'), alternativas, gabarito: gab || null, peso: Number(v('nq-peso')) || 1 });
  if(error) return msg('nq-msg', erroDe(error), 'erro');
  abrirProva(idP);
}


/* ---- proposta (Fase 2D): valor só para rh_salarios; os demais veem a situação ---- */
const PR_ST = { enviada:['aguardando resposta','b-info'], aceita:['aceita','b-ok'], recusada:['recusada','b-erro'], expirada:['vencida','b-aten'],
  cancelada:['cancelada','b-erro'], bloqueada:['link bloqueado','b-erro'] };
const moeda = n => n == null ? '—' : Number(n).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
async function htmlProposta(c){
  const sal = tem('rh_salarios');
  const [{ data: resumo }, props] = await Promise.all([db.rpc('fn_rh_proposta_resumo', { p_candidatura: c.id }),
    sal ? db.from('rh_propostas').select('*').eq('candidatura_id', c.id).order('criado_em', { ascending:false }).then(r => r.data || []) : Promise.resolve([])]);
  const pret = sal ? ((await db.from('rh_candidatura_pretensao').select('*').eq('candidatura_id', c.id)).data || [])[0] : null;
  const lista = sal ? props.map(p => ({ ...p, status: p.status === 'enviada' && p.validade < hoje() ? 'expirada' : p.status })) : (resumo || []);
  const aberta = lista.some(p => p.status === 'enviada');
  const emite = sal && EDITA() && c.status === 'ativa' && !aberta;
  let h = `<h3 style="margin-top:12px">Proposta</h3>`;
  h += lista.map(p => `<div style="margin:6px 0">${bdg(PR_ST, p.status)} ${sal ? `<b>${moeda(p.salario)}</b> · ` : ''}início ${fmtData(p.data_inicio)} · responder até ${fmtData(p.validade)}
      ${p.respondida_em ? ` · respondida ${fmtDataHora(p.respondida_em)}` : ''}${p.fora_da_faixa ? ' <span class="badge b-aten">fora da faixa</span>' : ''}
      ${sal && p.justificativa_faixa ? `<div class="mut">Justificativa: ${esc(p.justificativa_faixa)}</div>` : ''}
      ${p.recusa_motivo ? `<div class="mut">Motivo da recusa: ${esc(p.recusa_motivo)}</div>` : ''}
      ${sal && p.contraproposta ? `<div class="msg msg-aviso" style="margin:4px 0"><b>Contraproposta do candidato:</b> ${esc(p.contraproposta)}</div>` : ''}
      ${sal && p.cancelada_motivo ? `<div class="mut">Cancelada: ${esc(p.cancelada_motivo)}</div>` : ''}
      ${sal && EDITA() && ['enviada','bloqueada'].includes(p.status) ? `<div class="linha-acoes"><div><input id="pc-${p.id}" placeholder="Motivo do cancelamento" aria-label="Motivo do cancelamento"></div>
        <div style="flex:0;white-space:nowrap">${p.status === 'enviada' ? botoesLink('proposta', p.id, c.id) + ' ' : ''}<button class="btn-perigo btn-mini" onclick="cancelarProposta(${p.id}, ${c.id})">Cancelar</button></div></div>` : ''}</div>`).join('')
    || '<div class="mut">Nenhuma proposta.</div>';
  if(!sal) h += `<div class="mut">O valor só aparece para quem tem o perfil de remuneração (rh_salarios): é quem registra a pretensão do candidato e emite a proposta.</div>`;
  if(sal) h += htmlPretensao(c, pret);
  if(emite){
    const { data: vg } = await db.from('rh_vagas').select('requisicao_id,jornada,beneficios').eq('id', c.vaga_id).single();
    const { data: rq } = vg ? await db.from('rh_requisicoes').select('cargo_id,tipo_contratacao').eq('id', vg.requisicao_id).single() : { data: null };
    const { data: fxs } = rq ? await db.from('rh_cargo_faixas').select('*').eq('cargo_id', rq.cargo_id).order('inicio', { ascending:false }) : { data: [] };
    const fx = (fxs || []).find(f => f.inicio <= hoje() && (!f.fim || f.fim >= hoje()));
    h += `<div class="card" style="margin-top:8px"><b>Emitir proposta</b>
      <div class="mut">${fx ? `Faixa do cargo: ${moeda(fx.minimo)} a ${moeda(fx.maximo)} (médio ${moeda(fx.medio)}). Fora dela, só o responsável pelo RH emite, com justificativa.`
                            : 'O cargo não tem faixa salarial vigente: só o responsável pelo RH emite, com justificativa.'}</div>
      ${pret && pret.valor ? `<div class="mut">Pretensão do candidato: <b>${moeda(pret.valor)}</b>${pret.observacao ? ' — ' + esc(pret.observacao) : ''}</div>` : ''}
      <div class="g3"><div><label for="pp-sal">Salário (R$)</label><input id="pp-sal" type="number" min="0" step="0.01"></div>
        <div><label for="pp-ini">Início previsto</label><input id="pp-ini" type="date" min="${hoje()}"></div>
        <div><label for="pp-val">Responder até</label><input id="pp-val" type="date" min="${hoje()}"></div></div>
      <div class="g2"><div><label for="pp-jor">Jornada</label><input id="pp-jor" value="${esc((vg && vg.jornada) || '')}"></div>
        <div><label for="pp-ben">Benefícios</label><input id="pp-ben" value="${esc((vg && vg.beneficios) || '')}"></div></div>
      <label for="pp-obs">Observações ao candidato</label><input id="pp-obs">
      <label for="pp-just">Justificativa (obrigatória fora da faixa ou sem faixa)</label><input id="pp-just">
      <div class="modal-acoes"><button class="btn" onclick="emitirProposta(${c.id})">Emitir proposta</button></div>
      <div class="mut">O candidato lê e responde pelo link de acompanhamento. Depois de emitida, a proposta não muda: para corrigir, cancele e emita outra.</div></div>`;
  }
  return h;
}

async function emitirProposta(idCand){
  const p = { salario: v('pp-sal'), data_inicio: v('pp-ini'), validade: v('pp-val') || null, jornada: v('pp-jor'), beneficios: v('pp-ben'),
              observacoes: v('pp-obs'), justificativa_faixa: v('pp-just') };

async function cancelarProposta(id, idCand){
  const { error } = await db.rpc('fn_rh_proposta_cancelar', { p_id: id, p_motivo: v('pc-' + id) });

}
