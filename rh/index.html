/* ---- LGPD do candidato (Fase 2D): pedidos, prazos de guarda, arquivos ---- */
async function recLgpd(){
  const [{ data: ped }, { data: venc }, { data: arqs }, { data: vadm }] = await Promise.all([db.rpc('fn_rh_lgpd_pedidos'), db.rpc('fn_rh_lgpd_vencidos'),
    db.from('rh_arquivos_remover').select('*').is('removido_em', null).order('criado_em'), db.rpc('fn_rh_admissao_dados_vencidos')]);
  const abertos = (ped || []).filter(p => !p.atendido_em);
  rec(`<div class="card"><h3>Pedidos de eliminação (${abertos.length} em aberto)</h3>
      ${abertos.map(p => `<div style="margin:8px 0"><b>${esc(p.nome)}</b> <span class="mut">${esc(p.email)} · ${fmtDataHora(p.quando)}</span>
        ${p.candidaturas_ativas ? ` <span class="badge b-aten">${p.candidaturas_ativas} candidatura(s) ativa(s): serão encerradas</span>` : ''}${p.contratado ? ' <span class="badge b-erro">contratado</span>' : ''}
        <div class="linha-acoes">${p.contratado ? '' : `<div style="flex:0"><button class="btn-perigo btn-mini" onclick="atenderLgpd(${p.id}, 'anonimizar')">Anonimizar agora</button></div>`}
          <div><input id="lj-${p.id}" placeholder="Ou recuse com a base legal (ex.: obrigação legal)" aria-label="Justificativa da recusa"></div>
          <div style="flex:0"><button class="btn-sec btn-mini" onclick="atenderLgpd(${p.id}, 'recusar')">Recusar</button></div></div></div>`).join('') || '<div class="mut">Nenhum pedido em aberto.</div>'}
      ${(ped || []).filter(p => p.atendido_em).length ? `<details><summary>Atendidos (${(ped || []).filter(p => p.atendido_em).length})</summary>
        ${(ped || []).filter(p => p.atendido_em).map(p => `<div class="mut">${fmtDataHora(p.atendido_em)} · ${esc(p.atendido_por)} · ${esc(p.detalhe)}</div>`).join('')}</details>` : ''}</div>
    <div class="card"><h3>Prazo de guarda vencido (${(venc || []).length})</h3>
      <p class="mut" style="margin-top:0">Sem candidatura ativa e fora do prazo: nome, contato, currículo e textos viram "[anonimizado]". Números (notas, etapas, datas) ficam para os indicadores.</p>
      ${(venc || []).map(x => `<div>${esc(x.nome)} <span class="mut">guardar até ${fmtData(x.reter_ate)}${x.banco_talentos ? ' · banco de talentos' : ''}</span></div>`).join('') || '<div class="mut">Nenhum vencido.</div>'}
      ${(venc || []).length ? `<div class="modal-acoes"><button class="btn-perigo" onclick="aplicarPrazos()">Anonimizar os vencidos agora</button></div>` : ''}</div>
    <div class="card"><h3>Dados de admissão: prazo de guarda vencido (${(vadm || []).length})</h3>
      <p class="mut" style="margin-top:0">Guardados até ${esc(String((window.__CFG || []).find(c => c.chave === 'admissao_dados_reter_anos')?.valor || 3))} anos após o desligamento. Vencido o prazo, saem o CPF, a conta, o endereço, os dependentes e os arquivos dos documentos; a admissão (datas, cargo, quem conferiu) fica como histórico.</p>
      ${(vadm || []).map(x => `<div>${esc(x.nome)} <span class="mut">desligado em ${fmtData(x.desligado_em)}, guardar até ${fmtData(x.guardar_ate)}</span></div>`).join('') || '<div class="mut">Nenhum vencido.</div>'}
      ${(vadm || []).length ? `<div class="modal-acoes"><button class="btn-perigo" onclick="aplicarPrazosAdmissao()">Apagar os dados vencidos agora</button></div>` : ''}</div>
    <div class="card"><h3>Arquivos a remover do armazenamento (${(arqs || []).length})</h3>
      ${(arqs || []).map(a => `<div class="mut">${esc(a.caminho)} — ${esc(a.motivo)}</div>`).join('') || '<div class="mut">Nada a remover.</div>'}
      ${(arqs || []).length ? `<div class="modal-acoes"><button class="btn-sec" onclick="removerArquivos()">Remover agora</button></div>` : ''}</div>
    <div id="lg-msg"></div>`);
  window.__ARQS = arqs || [];
}
async function atenderLgpd(id, acao){
  if(acao === 'anonimizar' && !(await confirmar('Anonimizar candidato', 'Nome, contato, currículo e textos deixam de existir. Não dá para desfazer.', 'Anonimizar'))) return recLgpd();
  const { error } = await db.rpc('fn_rh_lgpd_atender', { p_evento: id, p_acao: acao, p_justificativa: acao === 'recusar' ? v('lj-' + id) : null });
  if(acao === 'anonimizar') fecharModal();
  if(error) return msg('lg-msg', String(erroDe(error)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, ''), 'erro');
  await recLgpd(); msg('lg-msg', acao === 'anonimizar' ? 'Dados anonimizados. Remova o currículo na lista de arquivos.' : 'Recusa registrada.', 'ok');
}
async function aplicarPrazos(){
  if(!(await confirmar('Aplicar prazos de guarda', 'Os candidatos listados serão anonimizados. Não dá para desfazer.', 'Anonimizar'))) return recLgpd();
  fecharModal();
  const { data, error } = await db.rpc('fn_rh_expirar_candidatos');
  if(error) return msg('lg-msg', erroDe(error), 'erro');
  await recLgpd(); msg('lg-msg', `${data} candidato(s) anonimizado(s).`, 'ok');
}
async function aplicarPrazosAdmissao(){
  if(!(await confirmar('Apagar dados de admissão vencidos', 'CPF, conta, endereço, dependentes e arquivos dos documentos saem. Não dá para desfazer.', 'Apagar'))) return recLgpd();
  fecharModal();
  const { data, error } = await db.rpc('fn_rh_expirar_admissao_dados');
  if(error) return msg('lg-msg', erroDe(error), 'erro');
  await recLgpd(); msg('lg-msg', `${data} admissão(ões) com os dados apagados. Remova os arquivos na lista abaixo.`, 'ok');
}
async function removerArquivos(){
  const arqs = window.__ARQS || [];
  const { data, error } = await db.storage.from('rh-arquivos').remove(arqs.map(a => a.caminho));
  if(error) return msg('lg-msg', 'O armazenamento não respondeu: ' + (error.message || ''), 'erro');
  // some da fila o que saiu agora e o que já não existia (currículo que nunca chegou, por exemplo)
  const { error: e2 } = await db.rpc('fn_rh_arquivos_removidos', { p_ids: arqs.map(a => a.id) });
  if(e2) return msg('lg-msg', erroDe(e2), 'erro');
  await recLgpd(); msg('lg-msg', `${(data || []).length} arquivo(s) removido(s) do armazenamento; fila limpa.`, 'ok');
}

/* ---- testemunhas do contrato (decisão do Thiago, 29/09/2026): uma via, duas testemunhas.

  const sel = (n, atual) => `<select id="ts-${n}" aria-label="Testemunha ${n}"><option value="">— escolha —</option>${comLogin.map(p => `<option value="${p.id}" ${p.id === atual ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>`;

async function salvarDocColab(renova){
  const p = { colaborador_id: FICHA_COLAB.id, numero: v('dc-num'), emissao: v('dc-emi'), validade: v('dc-val') || null, aso_resultado: v('dc-aso') || null };
  if(!renova){ p.tipo = v('dc-tipo'); p.descricao = v('dc-desc'); p.requisito_id = v('dc-req') || null; if(!p.descricao) return msg('dc-msg', 'Escreva a descrição do documento.', 'erro'); }
  const arq = $('dc-arq').files && $('dc-arq').files[0];
  if(arq){
    if(arq.size > 10 * 1024 * 1024) return msg('dc-msg', 'O arquivo passa de 10 MB.', 'erro');
    const ext = (arq.name.match(/\.([a-z0-9]+)$/i) || [, 'pdf'])[1].toLowerCase();
    const caminho = `rh/colab/${FICHA_COLAB.id}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
    const { error: eUp } = await db.storage.from('rh-arquivos').upload(caminho, arq, { contentType: arq.type || 'application/pdf' });
    if(eUp) return msg('dc-msg', 'O envio do arquivo falhou: ' + (eUp.message || ''), 'erro');
    p.arquivo_path = caminho; p.arquivo_nome = arq.name;
  }
  const { error } = await db.rpc('fn_rh_documento_salvar', { p_renova: renova, p });
  if(error) return msg('dc-msg', /rh_documentos_colab_check/.test(erroDe(error)) ? 'Confira as datas: a validade não pode ser antes da emissão.'
                                   : String(erroDe(error)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, ''), 'erro');
  await abrirFichaColab(FICHA_COLAB.id); msg('fc-msg', renova ? 'Documento renovado; o anterior ficou no histórico.' : 'Documento registrado.', 'ok');
}

async function salvarBeneficio(){
  const deps = v('bn-d').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [n, p] = l.split(/\s+[—-]\s+/); return { nome: n.trim(), parentesco: (p || '').trim() || null }; });
  const { error } = await db.rpc('fn_rh_beneficio_aderir', { p_beneficio: Number(v('bn-b')), p_colaborador: FICHA_COLAB.id, p_inicio: v('bn-i') || null, p_dependentes: deps, p_obs: null });
  if(error) return msg('bn-msg', String(erroDe(error)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, ''), 'erro');
  await abrirFichaColab(FICHA_COLAB.id); msg('fc-msg', 'Benefício incluído.', 'ok');
}
async function encerrarBeneficio(id){
  const { error } = await db.rpc('fn_rh_beneficio_encerrar', { p_adesao: id, p_fim: null });
  if(error) return msg('fc-msg', erroDe(error), 'erro');
  await abrirFichaColab(FICHA_COLAB.id);
}
// Estrutura → Benefícios: o catálogo (sem valores: são do DP)

  const { data, error } = await db.from('rh_beneficios').select('*').order('nome');

  est(`<div class="card"><p class="mut" style="margin-top:0">Benefícios que a Ambimet oferece. Aqui fica quem pode ter e quem aderiu; valor e desconto em folha são do DP.</p>
      ${EDITA() ? `<div class="g3"><div><label for="bf-nome">Nome</label><input id="bf-nome" placeholder="ex.: Plano de saúde"></div>

        <div class="g2"><div><label for="bf-eleg">Quem pode ter</label><input id="bf-eleg" placeholder="ex.: CLT após a experiência"></div>

        <td>${b.aceita_dependentes ? 'sim' : 'não'}</td><td>${b.ativo ? '<span class="badge b-ok">ativo</span>' : '<span class="badge b-info">inativo</span>'}</td>
        ${EDITA() ? `<td><button class="btn-sec btn-mini" onclick="alternarBen(${b.id}, ${!b.ativo})">${b.ativo ? 'Desativar' : 'Reativar'}</button></td>` : ''}</tr>`).join('')}</table></div>`

async function salvarBenCatalogo(){
  if(!v('bf-nome')) return msg('bf-msg', 'Dê um nome.', 'erro');
  const { error } = await db.from('rh_beneficios').insert({ nome: v('bf-nome'), tipo: v('bf-tipo'), fornecedor: v('bf-forn') || null, elegibilidade: v('bf-eleg') || null, aceita_dependentes: v('bf-dep') === 'true' });
  if(error) return msg('bf-msg', /duplicate|unique/i.test(erroDe(error)) ? 'Já existe um benefício com esse nome.' : erroDe(error), 'erro');
  estBeneficios();
}
async function alternarBen(id, ativo){
  const { error } = await db.from('rh_beneficios').update({ ativo }).eq('id', id);
  if(error) return msg('bf-msg', erroDe(error), 'erro');
  estBeneficios();
}

function dadosVaga(){
  const o = {}; ['titulo','slug','descricao','responsabilidades','requisitos','diferenciais','beneficios','modalidade','cidade','uf','jornada','faixa_divulgada','encerra_em']
    .forEach(k => { o[k] = $('vg-' + k) ? $('vg-' + k).value : null; });
  if(!o.encerra_em) o.encerra_em = null;
  return o;
}
async function salvarVaga(silencioso){
  const { error } = await db.rpc('fn_rh_vaga_salvar', { p_id: VG.id, p: dadosVaga() });
  if(error){ msg('vg-msg', erroDe(error), 'erro'); return false; }
  if(!silencioso){ await abrirVaga(VG.id); msg('vg-msg', 'Anúncio salvo.', 'ok'); }
  return true;
}
async function publicarVaga(confirmar){
  if(VG.status === 'rascunho' && !(await salvarVaga(true))) return;
  const { data, error } = await db.rpc('fn_rh_publicar_vaga', { p_id: VG.id, p_confirmar: confirmar });
  if(error) return msg('vg-msg', erroDe(error), 'erro');
  if(!data.publicada){
    return modal(`<h3>Revise o anúncio antes de publicar</h3>
      <p>O texto tem termos que podem indicar discriminação na seleção (Lei 9.029/1995; CLT art. 373-A):</p>
      <p><b>${esc(data.alertas.join(', '))}</b></p>
      <p class="mut">Ajuste o texto e publique de novo. Se o termo for legítimo (ex.: vaga afirmativa para pessoa com deficiência), o responsável pelo RH pode publicar mesmo assim — a decisão fica registrada.</p>
      <div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Voltar e ajustar</button>
        ${ADMIN() ? `<button class="btn-perigo" onclick="fecharModal();publicarVaga(true)">Publicar mesmo assim</button>` : ''}</div>`);
  }
  await abrirVaga(VG.id); msg('vg-msg', 'Vaga publicada. O link público já funciona.', 'ok');
}
async function statusVaga(novo){
  if(novo === 'encerrada' && !(await confirmar('Encerrar vaga', 'A vaga sai da página de carreiras e não recebe mais candidaturas. Não dá para reabrir.', 'Encerrar'))) return;
  const { error } = await db.rpc('fn_rh_vaga_status', { p_id: VG.id, p_status: novo });
  if(error) return msg('vg-msg', erroDe(error), 'erro');
  abrirVaga(VG.id);
}
async function addPergunta(n){
  if(!v('pq-txt')) return msg('vg-msg', 'Escreva a pergunta.', 'erro');
  const elim = v('pq-elim');
  if(elim && v('pq-tipo') !== 'sim_nao') return msg('vg-msg', 'Eliminatória só em pergunta de sim/não.', 'erro');
  const { error } = await db.from('rh_vaga_perguntas').insert({ vaga_id: VG.id, ordem: n + 1, pergunta: v('pq-txt'), tipo: v('pq-tipo'),
    eliminatoria: !!elim, resposta_eliminatoria: elim || null });
  if(error) return msg('vg-msg', erroDe(error), 'erro');
  abrirVaga(VG.id);
}
async function tirarPergunta(idQ){
  const { error } = await db.from('rh_vaga_perguntas').delete().eq('id', idQ).select('id');
  if(error) return msg('vg-msg', erroDe(error), 'erro');
  abrirVaga(VG.id);
}
async function verCurriculo(idCand){
  const { data: k } = await db.from('rh_candidatos').select('curriculo_path').eq('id', idCand).single();
  if(!k || !k.curriculo_path) return;
  const { data, error } = await db.storage.from('rh-arquivos').createSignedUrl(k.curriculo_path, 60);
  if(error) return msg('vg-msg', 'Seu perfil não abre currículos (só rh e rh_admin).', 'aviso');
  window.open(data.signedUrl, '_blank', 'noopener');
}
async function copiarTexto(t, botao){
  try { await navigator.clipboard.writeText(t); if(botao) botao.textContent = 'Copiado'; }
  catch(e){ modal(`<h3>Link</h3><input value="${esc(t)}" readonly onclick="this.select()"><div class="modal-acoes"><button class="btn" onclick="fecharModal()">Ok</button></div>`); }
}

   do Word); a tela só desenha. Toda regra — quem cria, quem edita, o que

   quando todos assinam — mora nas funções fn_rh_fb_* (108).

const FB_TIPOS = { periodico:'Periódico', experiencia_45:'Experiência — 1º período (45 dias)', experiencia_90:'Experiência — 2º período (90 dias)',
  supervisao:'Supervisão / treinamento', reconhecimento:'Reconhecimento', orientacao:'Orientação', pos_avaliacao:'Pós-avaliação de desempenho', a_pedido:'A pedido do colaborador' };
const FB_STATUS = { rascunho:['rascunho','b-info'], aguardando_assinaturas:['aguardando assinaturas','b-aten'], concluido:['concluído','b-ok'], cancelado:['cancelado','b-erro'] };
const PAPEIS = { colaborador:'Supervisionado (colaborador)', condutor:'Supervisor (quem conduziu)', responsavel:'Responsável pelo feedback' };
const badgeFb = s => `<span class="badge ${(FB_STATUS[s] || [])[1] || 'b-info'}">${esc((FB_STATUS[s] || [s])[0])}</span>`;
let FBS = [], F_FB = { busca:'', status:'' };

async function vFeedbacks(arg){
  const { data, error } = await db.rpc('fn_rh_feedbacks');
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  FBS = data || [];
  el(`<div class="card"><div class="linha-acoes">
      <div><label for="fb-busca">Buscar por nome</label><input id="fb-busca" value="${esc(F_FB.busca)}" oninput="F_FB.busca=this.value;pintarFbs()"></div>
      <div style="max-width:240px"><label for="fb-status">Situação</label><select id="fb-status" onchange="F_FB.status=this.value;pintarFbs()">
        <option value="">Todas</option>${Object.entries(FB_STATUS).map(([k, [t]]) => `<option value="${k}" ${F_FB.status === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      ${tem('rh', 'rh_admin', 'rh_gestor') ? '<div style="flex:0"><button class="btn" onclick="novoFeedback()">Novo feedback</button></div>' : ''}</div>
      <p class="mut" style="margin-bottom:0">Formulário F-151. Depois de enviado para assinatura, o conteúdo não muda; depois de concluído, correção só por adendo.</p></div>
    <div id="fb-lista"></div>`);
  pintarFbs();

function pintarFbs(){
  const b = semAcento(F_FB.busca);
  const l = FBS.filter(f => (!b || semAcento(f.colaborador + ' ' + f.condutor).includes(b)) && (!F_FB.status || f.status === F_FB.status));
  $('fb-lista').innerHTML = !FBS.length ? `<div class="card"><div class="vazio">Nenhum feedback ainda. Comece por "Novo feedback".</div></div>`
    : `<div class="tabela"><table><tr><th>Colaborador</th><th>Tipo</th><th>Conversa</th><th>Conduzido por</th><th>Situação</th><th>Assinaturas</th><th>Combinados</th><th>Próx. retorno</th><th></th></tr>
      ${l.map(f => `<tr><td>${esc(f.colaborador)}</td><td>${esc(FB_TIPOS[f.tipo] || f.tipo)}</td><td>${fmtData(f.data_conversa)}</td><td>${esc(f.condutor)}</td>
        <td>${badgeFb(f.status)}${f.eu_assino ? ' <span class="badge b-aten">falta a sua</span>' : ''}</td>
        <td>${f.status === 'rascunho' ? '—' : `${f.assinaturas} de ${f.assinaturas_necessarias}`}</td>
        <td>${f.combinados_abertos ? `${f.combinados_abertos} aberto(s)${f.combinados_atrasados ? ` · <span class="badge b-erro">${f.combinados_atrasados} atrasado(s)</span>` : ''}` : '—'}</td>
        <td>${fmtData(f.proximo_retorno)}</td><td><button class="btn-sec btn-mini" onclick="irPara('feedback', ${f.id})">Abrir</button></td></tr>`).join('')}
      </table></div>`;
}
async function novoFeedback(colabId, tipo){
  const [{ data: pessoas }, { data: eu }] = await Promise.all([db.rpc('fn_rh_pessoas'), db.rpc('fn_rh_eu')]);
  const meuId = (eu || [])[0];
  const gestorSo = !EDITA();   // gestor: conduz ele mesmo, só a equipe (a função confere de novo)
  const lista = (pessoas || []).filter(p => !gestorSo || p.id !== meuId);
  if(!lista.length) return modal(`<h3>Novo feedback</h3><div class="vazio">Não há ninguém na sua equipe ainda. Quem define a equipe é o RH.</div>
    <div class="modal-acoes"><button class="btn" onclick="fecharModal()">Ok</button></div>`);
  const { data: todos } = gestorSo ? { data: [] } : await db.rpc('fn_rh_pessoas');
  modal(`<h3>Novo feedback formal</h3>
    <label for="nf-colab">Colaborador</label><select id="nf-colab"><option value="">— escolha —</option>
      ${lista.map(p => `<option value="${p.id}" ${p.id === colabId ? 'selected' : ''}>${esc(p.nome)}${p.funcao ? ' · ' + esc(p.funcao) : ''}</option>`).join('')}</select>
    <label for="nf-cond">Quem conduz (o supervisor do F-151)</label>
    ${gestorSo ? `<input id="nf-cond-nome" value="você" disabled><input id="nf-cond" type="hidden" value="${esc(meuId || '')}">`
      : `<select id="nf-cond"><option value="">— escolha —</option>${(todos || []).map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>`}
    <div class="g2"><div><label for="nf-tipo">Tipo</label><select id="nf-tipo">${Object.entries(FB_TIPOS).map(([k, t]) => `<option value="${k}" ${k === (tipo || 'periodico') ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
      <div><label for="nf-data">Data da conversa</label><input id="nf-data" type="date" value="${hoje()}" max="${hoje()}"></div></div>
    <label for="nf-ext">Responsável pelo feedback de fora da empresa (opcional)</label>
    <input id="nf-ext" placeholder="Nome completo — ex.: a psicóloga consultora">
    <label for="nf-ext-email">E-mail do responsável (opcional)</label>
    <input id="nf-ext-email" type="email" placeholder="Se ele tiver login no sistema, assina por lá; sem login, por link">
    <div id="nf-msg"></div>
    <div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="nf-ok">Criar e preencher</button></div>`);
  if(!gestorSo && colabId) { const p = lista.find(x => x.id === colabId); if(p && p.gestor_id) $('nf-cond').value = p.gestor_id; }
  $('nf-colab').onchange = () => { if(gestorSo) return; const p = lista.find(x => x.id === v('nf-colab')); if(p && p.gestor_id) $('nf-cond').value = p.gestor_id; };
  $('nf-ok').onclick = async () => {
    if(!v('nf-colab') || !v('nf-cond')) return msg('nf-msg', 'Escolha o colaborador e quem conduz.', 'erro');
    const { data, error } = await db.rpc('fn_rh_fb_criar', { p_colaborador: v('nf-colab'), p_condutor: v('nf-cond'), p_tipo: v('nf-tipo'),
      p_data: v('nf-data') || null, p_responsavel_externo: v('nf-ext') || null, p_responsavel_email: v('nf-ext-email') || null });
    if(error) return msg('nf-msg', erroDe(error), 'erro');
    fecharModal(); irPara('feedback', data);
  };
}

let FB = null;   // o feedback aberto (fn_rh_feedback_abrir)
async function abrirFeedback(id){
  const { data, error } = await db.rpc('fn_rh_feedback_abrir', { p_id: id });
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  if(!data) return el(`<div class="card"><div class="vazio">Este feedback não existe ou você não tem acesso a ele.</div></div>`);
  FB = data;
  if(data.editavel) await carregarObrig();
  const f = data.feedback, c = data.conteudo;
  const voltar = abas().some(a => a[0] === 'feedbacks') ? 'feedbacks' : 'meu';

      <div><h2 style="margin-top:0">${esc(c.colaborador || data.colaborador)}</h2>
        <div class="mut">${esc(c.cargo || '')} · ${esc(FB_TIPOS[f.tipo] || f.tipo)} · conversa em ${fmtData(f.data_conversa)} · conduzido por ${esc(data.condutor)}</div>
        <div class="mut">Formulário ${esc(c.modelo.codigo)} rev. ${esc(c.modelo.revisao_doc || '')} · versão ${c.modelo.versao} do modelo${f.responsavel_externo ? ' · responsável externo: ' + esc(f.responsavel_externo) : ''}</div></div>

  h += data.editavel ? htmlFbEditar(data) : htmlFbLer(data);
  el(h);
  if(!data.editavel && f.status === 'aguardando_assinaturas') pintarLinks();
}
// agrupa as respostas pelos blocos do Word (a "seção" de cada pergunta)
function blocosFb(respostas){
  const out = [];
  respostas.forEach(r => { const u = out[out.length - 1];
    if(r.secao && u && u.secao === r.secao) u.itens.push(r); else out.push({ secao: r.secao, itens: [r] }); });
  return out;
}
function htmlFbEditar(d){
  const f = d.feedback, c = d.conteudo;
  const campo = r => {
    if(r.tipo === 'sistema') return `<div style="margin:8px 0"><div class="mut">${esc(r.rotulo)}</div><b>${esc(r.valor || '—')}</b> <span class="mut">(vem do sistema)</span></div>`;
    const id = 'fq-' + r.chave, obrig = FB_OBRIG.has(r.chave) ? ' <span style="color:var(--verm-txt)">*</span>' : '';
    return `<label for="${id}">${esc(r.rotulo)}${obrig}</label>${r.tipo === 'texto_longo' || r.tipo === 'parecer'
      ? `<textarea id="${id}" data-chave="${r.chave}">${esc(r.valor || '')}</textarea>` : `<input id="${id}" data-chave="${r.chave}" value="${esc(r.valor || '')}">`}`;
  };
  return `<div class="card"><h3>Formulário</h3>
      <div class="g3"><div><label for="fe-data">Data da conversa</label><input id="fe-data" type="date" value="${esc(String(f.data_conversa).slice(0,10))}" max="${hoje()}"></div>
        <div><label for="fe-ret">Próximo retorno combinado</label><input id="fe-ret" type="date" value="${esc(f.proximo_retorno ? String(f.proximo_retorno).slice(0,10) : '')}"></div>

      <label for="fe-ext-email">E-mail do responsável (se ele tiver login, assina pelo sistema)</label>
      <input id="fe-ext-email" type="email" value="${esc(f.responsavel_email || '')}">
      ${blocosFb(c.respostas).map(b => b.secao ? `<fieldset style="border:1px solid var(--borda);border-radius:10px;margin:14px 0;padding:6px 14px 12px">
          <legend style="font-weight:700;color:var(--azul);padding:0 6px">${esc(b.secao)}</legend>${b.itens.map(campo).join('')}</fieldset>` : b.itens.map(campo).join('')).join('')}
      <div id="fe-msg"></div></div>
    <div class="card"><h3>Combinados</h3><p class="mut" style="margin-top:0">O que ficou acordado na conversa. Entram no documento assinado.</p>
      ${htmlCombinados(d, true)}
      <div class="linha-acoes" style="margin-top:8px">
        <div><label for="cb-acao">Ação</label><input id="cb-acao"></div>
        <div style="max-width:170px"><label for="cb-resp">Responsável</label><select id="cb-resp"><option value="colaborador">colaborador</option><option value="condutor">quem conduziu</option></select></div>
        <div style="max-width:170px"><label for="cb-prazo">Prazo</label><input id="cb-prazo" type="date"></div>
        <div style="flex:0"><button class="btn-sec" onclick="addCombinado()">Incluir</button></div></div></div>
    <div class="card"><div class="linha-acoes" style="justify-content:flex-end">
      ${ADMIN() ? `<button class="btn-perigo" onclick="excluirFb()">Excluir rascunho</button>` : ''}
      <button class="btn-perigo" onclick="cancelarFb()">Cancelar feedback</button>
      <button class="btn-sec" onclick="salvarFb()">Salvar rascunho</button>
      <button class="btn" onclick="enviarFb()">Enviar para assinaturas</button></div>
      <p class="mut" style="margin-bottom:0">Ao enviar, o conteúdo é congelado e recebe um código (SHA-256). Quem assina, assina exatamente aquele texto.</p></div>`;
}
// obrigatórias (a lista vem do modelo; a regra de verdade está no fn_rh_fb_enviar)
let FB_OBRIG = new Set();
async function carregarObrig(){
  if(FB_OBRIG.size) return;
  const { data } = await db.from('rh_feedback_perguntas').select('chave, obrigatoria').eq('obrigatoria', true);
  FB_OBRIG = new Set((data || []).map(x => x.chave));
}
function htmlCombinados(d, editando){
  const l = d.combinados || [];
  if(!l.length) return '<div class="mut">Nenhum combinado.</div>';
  const acomp = !editando && d.gerencia && d.feedback.status !== 'cancelado';
  return `<div class="tabela"><table><tr><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Situação</th>${acomp ? '<th>Evidência</th><th></th>' : ''}${editando ? '<th></th>' : ''}</tr>
    ${l.map(x => `<tr><td>${esc(x.acao)}</td><td>${x.responsavel === 'condutor' ? 'quem conduziu' : 'colaborador'}</td>
      <td>${fmtData(x.prazo)}${x.status === 'aberto' && x.prazo && String(x.prazo).slice(0,10) < hoje() ? ' <span class="badge b-erro">atrasado</span>' : ''}</td>
      <td>${x.status === 'feito' ? `<span class="badge b-ok">feito</span> ${fmtData(x.concluido_em)}` : x.status === 'cancelado' ? '<span class="badge b-erro">cancelado</span>' : '<span class="badge b-info">aberto</span>'}</td>

function respostasDaTela(){

}
async function salvarFb(silencioso){

    p_responsavel_email: v('fe-ext-email') || null });

async function tirarCombinado(cid){

async function vDesempenho(arg){
  if(typeof arg === 'number') return abrirCiclo(arg);
  const [{ data: minhas }, { data: ciclos, error }] = await Promise.all([db.rpc('fn_rh_minhas_avaliacoes'), db.rpc('fn_rh_ciclos')]);
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  el(htmlMinhasAvaliacoes(minhas || []) + `<div class="card pn-cab"><div style="flex:1;min-width:240px"><h2 style="margin:0 0 2px">🎯 Ciclos de avaliação de desempenho</h2>
      <p class="mut" style="margin:0">Cada ciclo define quem avalia (gestor, autoavaliação, pares, liderados), o peso de cada fonte e das metas, e termina com calibração, 9-box e ciência de cada pessoa.</p></div>
      ${EDITA() ? `<div><button class="btn" onclick="formCiclo()">+ Novo ciclo</button></div>` : ''}</div>
    ${(ciclos || []).length ? `<div class="tabela"><table><tr><th>Ciclo</th><th>Tipo</th><th>Período</th><th>Prazo</th><th>Situação</th><th>Preenchimento</th><th></th></tr>
      ${ciclos.map(c => `<tr><td><b>${esc(c.nome)}</b><div class="mut">${c.participantes} pessoa(s)${c.pares_a_aprovar ? ` · <span class="badge b-aten">${c.pares_a_aprovar} par(es) a aprovar</span>` : ''}</div></td>
        <td>${esc(c.tipo)}°</td><td>${fmtData(c.periodo_inicio)} a ${fmtData(c.periodo_fim)}</td><td>${fmtData(c.prazo_avaliacao)}</td>
        <td>${bdg(CICLO_ST, c.status)}${c.status === 'encerrado' ? `<div class="mut">ciência ${c.ciencias}/${c.participantes}</div>` : ''}</td>
        <td>${barraPct(c.pct)}<div class="mut">${c.enviadas}/${c.avaliacoes} avaliações${c.pct != null ? ' · ' + fmtNum(c.pct, 1) + '%' : ''}</div></td>
        <td><button class="btn-sec btn-mini" onclick="abrirCiclo(${c.id})">Abrir</button></td></tr>`).join('')}</table></div>`
      : `<div class="card"><div class="vazio">Nenhum ciclo ainda.${EDITA() ? ' Clique em "Novo ciclo": escolha o tipo, o período, os pesos e quem será avaliado.' : ''}</div></div>`}`);
}
const barraPct = p => `<div style="background:var(--cinza);border-radius:6px;height:8px;min-width:90px"><div style="background:var(--verde);border-radius:6px;height:8px;width:${Math.max(0, Math.min(100, p || 0))}%"></div></div>`;

function htmlMinhasAvaliacoes(l){
  if(!l.length) return '';
  const abertas = l.filter(a => a.status !== 'enviada').length;
  return `<div class="faixa-t">Minhas avaliações para responder${abertas ? ` <span class="badge b-aten">${abertas}</span>` : ''}</div><div class="tabela" style="margin-bottom:18px"><table>
    <tr><th>Quem</th><th>Como</th><th>Ciclo</th><th>Prazo</th><th>Situação</th><th></th></tr>
    ${l.map(a => `<tr><td>${a.relacao === 'auto' ? '<b>Você</b>' : esc(a.avaliado)}<div class="mut">${esc(a.funcao || '')}</div></td><td>${esc(RELACAO[a.relacao])}</td>
      <td>${esc(a.ciclo)}</td><td>${fmtData(a.prazo)}</td><td>${bdg(AV_ST, a.status)}</td>
      <td><button class="${a.status === 'enviada' ? 'btn-sec' : 'btn'} btn-mini" onclick="abrirAvaliacao(${a.id})">${a.status === 'enviada' ? 'Ver' : 'Responder'}</button></td></tr>`).join('')}</table></div>`;
}

// ---------- novo ciclo / editar ----------
function formCiclo(c){
  const t = c ? c.tipo : '180', w = c ? [c.peso_auto, c.peso_gestor, c.peso_pares, c.peso_liderados, c.peso_metas].map(Number) : PESOS_PADRAO[t];
  const trava = c && c.status !== 'rascunho';
  modal(`<h3>${c ? 'Editar ciclo' : 'Novo ciclo de avaliação'}</h3>
    <label for="cc-nome">Nome</label><input id="cc-nome" value="${esc(c ? c.nome : '')}" placeholder="ex.: Avaliação anual 2026">
    <label for="cc-tipo">Tipo</label><select id="cc-tipo" ${trava ? 'disabled' : ''} onchange="pesosPadrao()">${Object.entries(TIPO_CICLO).map(([k, x]) => `<option value="${k}" ${k === t ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    <div class="g2"><div><label for="cc-pi">Período avaliado — início</label><input id="cc-pi" type="date" value="${esc(c ? c.periodo_inicio : '')}" ${trava ? 'disabled' : ''}></div>
      <div><label for="cc-pf">Período avaliado — fim</label><input id="cc-pf" type="date" value="${esc(c ? c.periodo_fim : '')}" ${trava ? 'disabled' : ''}></div>
      <div><label for="cc-pa">Prazo para responder</label><input id="cc-pa" type="date" value="${esc(c ? c.prazo_avaliacao : '')}"></div>
      <div><label for="cc-pc">Prazo da calibração (opcional)</label><input id="cc-pc" type="date" value="${esc(c && c.prazo_calibracao || '')}"></div></div>
    <label>Peso de cada fonte na nota (somam 100)</label>
    <div class="g3">${PESOS.map((p, i) => `<div><label for="cc-w-${p}" style="margin-top:0">${p === 'auto' ? 'Autoavaliação' : p === 'metas' ? 'Metas' : p[0].toUpperCase() + p.slice(1)}</label>
      <input id="cc-w-${p}" type="number" min="0" max="100" step="1" value="${w[i]}" ${trava ? 'disabled' : ''} oninput="somaPesos()"></div>`).join('')}
      <div><label style="margin-top:0">Soma</label><div id="cc-soma" class="cfg-num"></div></div></div>
    <label style="font-weight:400;color:var(--texto)"><input type="checkbox" id="cc-pot" style="width:auto" ${!c || c.usa_potencial ? 'checked' : ''} ${trava ? 'disabled' : ''}> Avaliar potencial (para o 9-box)</label>
    <label for="cc-obs">Observação (opcional)</label><textarea id="cc-obs" rows="2">${esc(c && c.observacao || '')}</textarea>
    ${trava ? '<div class="mut">Ciclo já iniciado: tipo, período e pesos não mudam (mudariam a régua de quem já respondeu).</div>' : ''}
    <div id="cc-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button>
    <button class="btn" onclick="salvarCiclo(${c ? c.id : 'null'})">Salvar</button></div>`, { larga: true });
  pesosPadrao(true); somaPesos();
}
function pesosPadrao(soAjustar){
  const t = v('cc-tipo');
  if(!soAjustar) PESOS_PADRAO[t].forEach((x, i) => { $('cc-w-' + PESOS[i]).value = x; });
  $('cc-w-auto').disabled = $('cc-w-auto').disabled || t === '90';
  ['pares', 'liderados'].forEach(p => { if(t !== '360' && !soAjustar) $('cc-w-' + p).value = 0; });
  somaPesos();
}
function somaPesos(){
  const s = PESOS.reduce((a, p) => a + Number($('cc-w-' + p).value || 0), 0);
  $('cc-soma').innerHTML = `<span style="color:var(${s === 100 ? '--verde-txt' : '--verm-txt'})">${fmtNum(s)}</span>`;
}
async function salvarCiclo(id){
  const p = { nome: v('cc-nome'), tipo: v('cc-tipo'), periodo_inicio: v('cc-pi'), periodo_fim: v('cc-pf'), prazo_avaliacao: v('cc-pa'),
    prazo_calibracao: v('cc-pc'), usa_potencial: $('cc-pot').checked, observacao: v('cc-obs') };
  PESOS.forEach(x => { p['peso_' + x] = Number($('cc-w-' + x).value || 0); });
  if(!p.nome || !p.periodo_inicio || !p.periodo_fim || !p.prazo_avaliacao) return msg('cc-msg', 'Preencha nome, período e prazo.', 'erro');
  const { data, error } = await db.rpc('fn_rh_ciclo_salvar', { p_id: id, p });
  if(error) return msg('cc-msg', limparErro(error), 'erro');
  fecharModal(); abrirCiclo(data);
}
const limparErro = e => String(erroDe(e)).replace(/^.*?: (?=[A-ZÁÉÍÓÚ])/, '');

// ---------- o ciclo aberto ----------
async function abrirCiclo(id, sub){
  if(sub) SUB_DES = sub;
  const [{ data, error }, { data: res }] = await Promise.all([db.rpc('fn_rh_ciclo_abrir', { p_ciclo: id }), db.rpc('fn_rh_resultados_ciclo', { p_ciclo: id })]);
  if(error || !data) return el(`<div class="card"><div class="vazio">Ciclo não encontrado ou sem acesso.</div></div>`);
  CICLO = data; CICLO.res = res || [];
  const c = data.ciclo, ed = EDITA(), st = c.status;
  const pesos = PESOS.map(p => [p, Number(c['peso_' + p])]).filter(x => x[1] > 0).map(([p, x]) => `${p === 'auto' ? 'autoavaliação' : p} ${fmtNum(x)}%`).join(' · ');
  const acoes = [];
  if(ed && ['rascunho','avaliacao','calibracao'].includes(st)) acoes.push(`<button class="btn-sec" onclick="formCiclo(CICLO.ciclo)">Editar</button>`);
  if(ed && ['rascunho','avaliacao'].includes(st)) acoes.push(`<button class="btn-sec" onclick="formIncluir()">Incluir pessoas</button>`);
  if(ed && st === 'rascunho') acoes.push(`<button class="btn" onclick="iniciarCiclo()">Iniciar ciclo</button>`);
  if(ed && st === 'avaliacao') acoes.push(`<button class="btn" onclick="abrirCalibracao(false)">Fechar avaliações e abrir calibração</button>`);
  if(ed && st === 'calibracao') acoes.push(`<button class="btn" onclick="encerrarCiclo()">Encerrar e liberar resultados</button>`);
  if(CICLO.res.length) acoes.push(`<button class="btn-sec" onclick="exportarCiclo()">Exportar .xlsx</button>`, `<button class="btn-sec" onclick="imprimirCiclo()">Imprimir</button>`);
  if(ADMIN() && !['encerrado','cancelado'].includes(st)) acoes.push(`<button class="btn-perigo" onclick="cancelarCiclo()">Cancelar ciclo</button>`);
  el(`<div style="margin-bottom:10px"><a href="#" onclick="event.preventDefault();irPara('desempenho')">← ciclos</a></div>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><h2 style="margin-top:0">${esc(c.nome)}</h2><div class="mut">${esc(TIPO_CICLO[c.tipo])} · período ${fmtData(c.periodo_inicio)} a ${fmtData(c.periodo_fim)} · responder até ${fmtData(c.prazo_avaliacao)}${c.prazo_calibracao ? ' · calibração até ' + fmtData(c.prazo_calibracao) : ''}</div>
        <div class="mut">Pesos: ${esc(pesos)}${c.usa_potencial ? ' · com potencial (9-box)' : ''} · pares e liderados só aparecem com ${data.min_anonimato}+ respostas</div></div>
      <div>${bdg(CICLO_ST, st)}</div></div>
      ${st === 'rascunho' ? `<div class="msg msg-info">Rascunho: inclua as pessoas${c.tipo === '360' ? ' e os pares (o gestor indica, o RH aprova)' : ''}, confira os gestores e inicie. Ao iniciar, as competências de cada cargo são congeladas e as avaliações abrem.</div>` : ''}
      ${st === 'calibracao' ? `<div class="msg msg-info">Calibração: ajuste desempenho e potencial em comitê (com justificativa) na aba <b>Resultados e 9-box</b>. Ao encerrar, os resultados congelam e cada pessoa recebe para ciência.</div>` : ''}
      ${st === 'cancelado' ? `<div class="msg msg-erro">Cancelado: ${esc(c.cancelado_motivo || '')}</div>` : ''}
      ${acoes.length ? `<div class="linha-acoes" style="margin-top:10px;flex-wrap:wrap">${acoes.map(a => `<div style="flex:0">${a}</div>`).join('')}</div>` : ''}
      <div id="ci-msg"></div></div>
    <div class="sub"><button class="${SUB_DES === 'participantes' ? 'on' : ''}" onclick="SUB_DES='participantes';pintarCiclo()">Participantes (${data.participantes.length})</button>
      <button class="${SUB_DES === 'resultados' ? 'on' : ''}" onclick="SUB_DES='resultados';pintarCiclo()">Resultados e 9-box</button></div>
    <div id="ci-corpo"></div>`);
  pintarCiclo();
}
function pintarCiclo(){
  document.querySelectorAll('.sub button').forEach((b, i) => b.classList.toggle('on', (i === 0) === (SUB_DES === 'participantes')));
  $('ci-corpo').innerHTML = SUB_DES === 'participantes' ? htmlParticipantes() : htmlResultados();
}
function htmlParticipantes(){
  const c = CICLO.ciclo, ps = CICLO.participantes;
  if(!ps.length) return `<div class="card"><div class="vazio">Ninguém no ciclo ainda.${EDITA() && c.status === 'rascunho' ? ' Use "Incluir pessoas".' : ''}</div></div>`;
  const chip = a => `<span class="badge ${(AV_ST[a.status] || [])[1] || 'b-info'}" title="${esc(RELACAO[a.relacao])}${a.relacao === 'par' || a.relacao === 'liderado' ? '' : ': ' + esc(a.avaliador)}">${esc(RELACAO[a.relacao].slice(0, 4))}${a.aprovado ? '' : ' (a aprovar)'}</span>`;
  return `<div class="tabela"><table><tr><th>Pessoa</th><th>Gestor avaliador</th><th>Avaliações</th><th>Metas</th>${c.usa_potencial ? '<th>Potencial</th>' : ''}${c.status === 'encerrado' ? '<th>Ciência</th>' : ''}<th></th></tr>
    ${ps.map(p => `<tr><td><b>${esc(p.nome)}</b><div class="mut">${esc(p.funcao || '')}${p.setor ? ' · ' + esc(p.setor) : ''}</div></td>
      <td>${p.gestor ? esc(p.gestor) : '<span class="badge b-erro">sem gestor</span>'}</td>
      <td>${p.avaliacoes.map(chip).join(' ') || '<span class="mut">abre ao iniciar</span>'}</td>
      <td>${p.metas.length ? `${p.metas.length}${p.metas.some(m => m.realizado === null) ? ` <span class="mut">(${p.metas.filter(m => m.realizado === null).length} sem realizado)</span>` : ''}` : '<span class="mut">—</span>'}</td>
      ${c.usa_potencial ? `<td>${p.potencial ? nt(p.potencial.nota) : '<span class="mut">falta</span>'}</td>` : ''}
      ${c.status === 'encerrado' ? `<td>${p.ciencia_em ? `<span class="badge b-ok">${fmtData(p.ciencia_em)}</span>` : '<span class="badge b-aten">pendente</span>'}</td>` : ''}
      <td><button class="btn-sec btn-mini" onclick="abrirParticipante(${p.id})">Abrir</button></td></tr>`).join('')}</table></div>`;
}
function htmlResultados(){
  const c = CICLO.ciclo, rs = CICLO.res;
  if(!rs.length) return `<div class="card"><div class="vazio">Sem resultados para mostrar ainda.</div></div>`;
  const fonte = (n, s, q) => s === 'insuficiente' ? `<span class="badge b-aten" title="${q} resposta(s): abaixo do mínimo de ${CICLO.min_anonimato}, não mostramos a nota">insuficiente</span>` : s === 'sem' ? '<span class="mut">—</span>' : nt(n);
  return `${c.status !== 'encerrado' ? `<div class="msg msg-info">Resultado <b>provisório</b>: é recalculado a cada resposta. Ao encerrar, ele congela.</div>` : ''}
    <div class="tabela"><table><tr><th>Pessoa</th>${Number(c.peso_auto) ? '<th>Auto</th>' : ''}<th>Gestor</th>${c.tipo === '360' ? '<th>Pares</th><th>Liderados</th>' : ''}${Number(c.peso_metas) ? '<th>Metas</th>' : ''}
      <th>Nota final</th><th>Desempenho</th>${c.usa_potencial ? '<th>Potencial</th><th>9-box</th>' : ''}<th>Falta na nota</th></tr>
    ${rs.map(r => `<tr><td><a href="#" onclick="event.preventDefault();abrirParticipante(${r.participante_id})">${esc(r.nome)}</a><div class="mut">${esc(r.funcao || '')}</div></td>
      ${Number(c.peso_auto) ? `<td>${nt(r.nota_auto)}</td>` : ''}<td>${nt(r.nota_gestor)}</td>
      ${c.tipo === '360' ? `<td>${fonte(r.nota_pares, r.pares_situacao, r.n_pares)}</td><td>${fonte(r.nota_liderados, r.liderados_situacao, r.n_liderados)}</td>` : ''}
      ${Number(c.peso_metas) ? `<td>${nt(r.nota_metas)}</td>` : ''}
      <td><b>${nt(r.nota_final)}</b></td><td>${nt(r.desempenho_final)}${r.calibrado ? ' <span class="badge b-info" title="ajustado na calibração">calibrado</span>' : ''}</td>
      ${c.usa_potencial ? `<td>${nt(r.potencial_final)}</td><td>${r.quadrante ? esc(r.quadrante_nome) : '<span class="mut">—</span>'}</td>` : ''}
      <td class="mut">${esc((r.fontes_faltando || []).join('; '))}</td></tr>`).join('')}</table></div>
    <p class="mut">Nota final = média das fontes pelos pesos do ciclo; fonte sem nota fica <b>fora</b> da média e aparece em "Falta na nota" (não tapamos a lacuna). Sem a avaliação do gestor não há nota. Desempenho = nota final, ou o valor da calibração.</p>
    ${c.usa_potencial ? htmlNoveBox(rs) : ''}`;
}
function htmlNoveBox(rs){
  const por = {}; rs.forEach(r => { if(r.quadrante) (por[r.quadrante] = por[r.quadrante] || []).push(r); });
  const nomes = ['Insuficiente','Eficaz','Comprometido','Questionável','Mantenedor','Forte desempenho','Enigma','Forte potencial','Estrela'];
  const sem = rs.filter(r => !r.quadrante);
  return `<div class="card"><h3 style="margin-top:0">9-box</h3><p class="mut" style="margin-top:0">Desempenho (→) × potencial (↑). Faixas nas Configurações (9-box). Clique no nome para abrir a pessoa.</p>
    <div style="display:grid;grid-template-columns:28px repeat(3,1fr);gap:6px;align-items:stretch">
      ${NB_LAYOUT.map((linha, i) => `<div class="mut" style="writing-mode:vertical-rl;transform:rotate(180deg);text-align:center">${['alto', 'médio', 'baixo'][i]}</div>` + linha.map(q => {
        const tom = NB_TOM[q], l = por[q] || [];
        return `<div style="background:var(--${tom}-fundo);border-radius:10px;padding:8px 10px;min-height:86px">
          <div style="display:flex;justify-content:space-between;gap:6px"><b style="color:var(--${tom}-txt)">${esc(nomes[q - 1])}</b><span class="badge b-info">${l.length}</span></div>
          ${l.map(r => `<div><a href="#" onclick="event.preventDefault();abrirParticipante(${r.participante_id})">${esc(r.nome)}</a>${r.calibrado ? ' <span class="mut">✱</span>' : ''}</div>`).join('')}</div>`; }).join('')).join('')}
      <div></div>${['baixo', 'médio', 'alto'].map(x => `<div class="mut" style="text-align:center">${x}</div>`).join('')}</div>
    <div class="mut" style="margin-top:6px">↑ potencial · → desempenho · ✱ calibrado${sem.length ? ` · fora do 9-box (falta desempenho ou potencial): ${esc(sem.map(r => r.nome).join(', '))}` : ''}</div></div>`;
}

// ---------- incluir pessoas / iniciar / calibração / encerrar ----------
async function formIncluir(){
  const [{ data: pessoas }, areas] = await Promise.all([db.rpc('fn_rh_pessoas'), carregarAreas()]);
  const ja = new Set(CICLO.participantes.map(p => p.colaborador_id));
  modal(`<h3>Incluir pessoas no ciclo</h3>
    <p class="mut">"Incluir todos" pega quem está ativo, com o tempo mínimo de casa no fim do período (Configurações → Desempenho). Para incluir alguém fora dessa regra, marque abaixo.</p>
    <div class="linha-acoes"><div><label for="in-area">Área</label><select id="in-area"><option value="">Todas</option>${(areas || []).map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></div>
      <div style="flex:0"><button class="btn" onclick="incluirTodos()">Incluir todos</button></div></div>
    <label>Ou escolha</label><div style="max-height:260px;overflow:auto;border:1px solid var(--borda);border-radius:8px;padding:6px 10px">
      ${(pessoas || []).filter(p => !ja.has(p.id)).map(p => `<label style="font-weight:400;color:var(--texto);display:flex;gap:8px;margin:4px 0"><input type="checkbox" class="in-p" value="${p.id}" style="width:auto">
        ${esc(p.nome)} <span class="mut">${esc(p.funcao || '')}</span></label>`).join('') || '<div class="vazio">Todos já estão no ciclo.</div>'}</div>
    <div id="in-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Fechar</button><button class="btn" onclick="incluirMarcados()">Incluir marcados</button></div>`, { larga: true });
}
function resumoInclusao(r){
  return `${r.incluidos} incluída(s).` + (r.fora_por_tempo_de_casa ? ` ${r.fora_por_tempo_de_casa} ficaram fora por ter menos de ${r.min_dias_casa} dias de casa no fim do período.` : '')
    + ((r.recusados || []).length ? ' Não incluídas: ' + r.recusados.map(x => `${x.nome} (${x.motivo})`).join(', ') + '.' : '');
}
async function incluirTodos(){
  const { data, error } = await db.rpc('fn_rh_ciclo_incluir_todos', { p_ciclo: CICLO.ciclo.id, p_area: v('in-area') ? Number(v('in-area')) : null, p_setor: null });
  if(error) return msg('in-msg', limparErro(error), 'erro');
  fecharModal(); await abrirCiclo(CICLO.ciclo.id, 'participantes'); msg('ci-msg', resumoInclusao(data), 'ok');
}
async function incluirMarcados(){
  const ids = [...document.querySelectorAll('.in-p:checked')].map(x => x.value);
  if(!ids.length) return msg('in-msg', 'Marque pelo menos uma pessoa.', 'erro');
  const { data, error } = await db.rpc('fn_rh_ciclo_incluir', { p_ciclo: CICLO.ciclo.id, p_ids: ids });
  if(error) return msg('in-msg', limparErro(error), 'erro');
  fecharModal(); await abrirCiclo(CICLO.ciclo.id, 'participantes'); msg('ci-msg', resumoInclusao(data), 'ok');
}
async function iniciarCiclo(){
  if(!(await confirmar('Iniciar o ciclo', 'As competências de cada cargo serão congeladas e as avaliações abrem para quem avalia. Tipo, período e pesos não mudam mais.', 'Iniciar'))) return;
  const { data, error } = await db.rpc('fn_rh_ciclo_iniciar', { p_ciclo: CICLO.ciclo.id });
  if(error) return msg('ci-msg', limparErro(error), 'erro');
  await abrirCiclo(CICLO.ciclo.id); msg('ci-msg', `Ciclo iniciado: ${data.participantes} pessoa(s), ${data.avaliacoes} avaliação(ões) abertas.`, 'ok');
}
async function abrirCalibracao(mesmoAssim){
  if(!mesmoAssim && !(await confirmar('Fechar as avaliações', 'Ninguém mais responde depois disso. Os resultados passam para a calibração.', 'Seguir'))) return;
  const { data, error } = await db.rpc('fn_rh_ciclo_abrir_calibracao', { p_ciclo: CICLO.ciclo.id, p_mesmo_assim: !!mesmoAssim });
  if(error) return msg('ci-msg', limparErro(error), 'erro');
  if(!data.ok){ if(await confirmar('Há avaliações não enviadas', data.mensagem, 'Seguir assim mesmo')) return abrirCalibracao(true); return; }
  abrirCiclo(CICLO.ciclo.id, 'resultados');
}
async function encerrarCiclo(){
  if(!(await confirmar('Encerrar o ciclo', 'Os resultados congelam (com código de integridade) e cada pessoa passa a ver o seu e registrar ciência. Não dá para desfazer.', 'Encerrar'))) return;
  const { data, error } = await db.rpc('fn_rh_ciclo_encerrar', { p_ciclo: CICLO.ciclo.id });
  if(error) return msg('ci-msg', limparErro(error), 'erro');
  await abrirCiclo(CICLO.ciclo.id, 'resultados'); msg('ci-msg', `Encerrado: ${data} resultado(s) congelado(s) e liberado(s) para ciência.`, 'ok');
}
async function cancelarCiclo(){

async function salvarPotencial(pid){

      ${c.niveis.length ? `<ul class="mut" style="margin:6px 0">${c.niveis.map(n => `<li><b>${n.nivel}</b> — ${esc(n.ancora)}</li>`).join('')}</ul>` : ''}
      <div class="linha-acoes" role="radiogroup" aria-label="${esc(c.nome)}" style="flex-wrap:wrap">${[1, 2, 3, 4, 5].map(n => `<label style="flex:0;font-weight:600;color:var(--texto);display:flex;gap:4px;align-items:center;border:1px solid var(--borda);border-radius:8px;padding:6px 12px;margin:0">

        ${a.pode_nao_observar ? `<label style="flex:0;font-weight:600;color:var(--texto);display:flex;gap:4px;align-items:center;border:1px solid var(--borda);border-radius:8px;padding:6px 12px;margin:0">
          <input type="radio" name="av-${c.id}" value="" style="width:auto" ${c.respondida && c.nota === null ? 'checked' : ''} ${fechada ? 'disabled' : ''}> Não observei</label>` : ''}</div>
      <label for="avc-${c.id}">Comentário (opcional)</label><textarea id="avc-${c.id}" rows="2" ${fechada ? 'disabled' : ''}>${esc(c.resposta_comentario || '')}</textarea></div>`).join('')}

async function salvarAvaliacaoLogado(enviar){
  const resp = AVF.competencias.map(c => { const r = document.querySelector(`input[name="av-${c.id}"]:checked`);
    return r ? { competencia_id: c.id, nota: r.value === '' ? null : Number(r.value), comentario: v('avc-' + c.id) || null } : null; }).filter(Boolean);
  const { data, error } = await db.rpc('fn_rh_avaliacao_salvar', { p_id: AVF.id, p_respostas: resp, p_comentario: v('av-geral') || null, p_enviar: enviar });
  if(error) return msg('av-msg', limparErro(error), 'erro');
  if(!data.ok) return msg('av-msg', data.mensagem, 'erro');
  if(data.status === 'enviada'){ await abrirAvaliacao(AVF.id); return msg('av-msg', data.mensagem, 'ok'); }

}

async function enviarRapido(){
  if(!v('fr-p') || !v('fr-x')) return msg('fr-msg', 'Escolha a pessoa e escreva a mensagem.', 'erro');
  const { error } = await db.rpc('fn_rh_feedback_rapido_enviar', { p_destinatario: v('fr-p'), p_tipo: v('fr-t'), p_texto: v('fr-x'),
    p_competencia: v('fr-c') ? Number(v('fr-c')) : null, p_visibilidade: v('fr-v') });
  if(error) return msg('fr-msg', limparErro(error), 'erro');
  if(ABA === 'desenvolvimento') { await vDesenvolvimento('rapido'); } else { await vMeu(); }
  msg('fr-msg', 'Enviado. Obrigado por reconhecer!', 'ok');
}
async function retirarRapido(id){
  if(!(await confirmar('Retirar o feedback', 'Ele deixa de aparecer para todos.', 'Retirar'))) return;

}

/* =====================================================================
   OKR E SUCESSÃO (Fase 4C) e PESQUISA DE CLIMA (Fase 4D).
   O progresso do OKR e todo número da pesquisa vêm do banco. A pesquisa é
   anônima: a tela nunca recebe resposta individual — só o agregado, com a
   pesquisa encerrada e com o mínimo de respostas.
   ===================================================================== */
const NIVEL_OKR = { empresa:'Empresa', area:'Área', setor:'Setor', pessoa:'Pessoa' };
const CONF = { alta:['confiança alta','b-ok'], media:['confiança média','b-aten'], baixa:['confiança baixa','b-erro'] };
const PRONT = { agora:['Pronto agora','b-ok'], '1_2_anos':['1 a 2 anos','b-aten'], '3_mais':['3+ anos','b-info'] };
const RISCO = { alto:['risco alto','b-erro'], medio:['risco médio','b-aten'], baixo:['risco baixo','b-info'] };
const PESQ_ST = { rascunho:['Rascunho','b-info'], aberta:['Aberta','b-aten'], encerrada:['Encerrada','b-ok'], cancelada:['Cancelada','b-erro'] };
let SUB_OKR = 'objetivos', OKRS = [], SUB_CLIMA = null;
const barraProg = (p, tom) => `<div style="background:var(--cinza);border-radius:6px;height:8px;min-width:90px"><div style="background:var(${tom || '--royal'});border-radius:6px;height:8px;width:${Math.max(0, Math.min(100, p || 0))}%"></div></div>`;
const tomProg = p => p >= 70 ? '--verde' : p >= 40 ? '--royal' : '--lar';

async function vOkr(arg){
  if(typeof arg === 'string') SUB_OKR = arg;
  const subs = [['objetivos', 'Objetivos e resultados-chave']].concat(EMPRESA() ? [['sucessao', 'Sucessão']] : []);
  if(!subs.some(s => s[0] === SUB_OKR)) SUB_OKR = 'objetivos';
  el(`<div class="sub">${subs.map(([k, t]) => `<button class="${SUB_OKR === k ? 'on' : ''}" onclick="vOkr('${k}')">${t}</button>`).join('')}</div><div id="okr-corpo"></div>`);
  SUB_OKR === 'objetivos' ? pintarOkrs() : pintarSucessao();
}

// ---------- OKR: a árvore ----------
async function pintarOkrs(caixa){
  const alvo = caixa || 'okr-corpo';
  const { data, error } = await db.rpc('fn_rh_okrs', { p_data: hoje(), p_todos: false });
  if(error) return $(alvo).innerHTML = `<div class="msg msg-erro">${esc(erroDe(error))}</div>`;
  OKRS = data || [];
  const ids = new Set(OKRS.map(o => o.id)), raiz = OKRS.filter(o => !o.pai_id || !ids.has(o.pai_id));
  const filhos = pid => OKRS.filter(o => o.pai_id === pid);
  const card = (o, nivel) => `<div class="card" style="margin-left:${Math.min(nivel, 3) * 22}px;${nivel ? 'border-left:4px solid var(--aqua)' : ''}">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:220px">
        <span class="badge b-info">${esc(NIVEL_OKR[o.nivel])}: ${esc(o.alvo || '')}</span> ${o.status !== 'ativo' ? bdg({ encerrado:['encerrado','b-ok'], cancelado:['cancelado','b-erro'], rascunho:['rascunho','b-info'] }, o.status) : ''}
        <h3 style="margin:6px 0 2px">${esc(o.titulo)}</h3><div class="mut">dono: ${esc(o.dono || '—')} · ${fmtData(o.inicio)} a ${fmtData(o.fim)}${o.descricao ? ' · ' + esc(o.descricao) : ''}</div></div>
        <div style="min-width:160px"><div class="mut">Progresso</div><b style="font-size:20px">${fmtNum(o.progresso || 0, 1)}%</b>${barraProg(o.progresso, tomProg(o.progresso))}</div></div>
      <div class="tabela" style="margin-top:8px"><table><tr><th>Resultado-chave</th><th>Atual / meta</th><th>Progresso</th><th>Último check-in</th><th></th></tr>
        ${o.krs.map(k => `<tr><td>${esc(k.titulo)}<div class="mut">${k.dono ? 'dono: ' + esc(k.dono) : ''}${Number(k.peso) !== 1 ? ` · peso ${fmtNum(k.peso, 2)}` : ''}</div></td>
          <td>${k.tipo === 'marco' ? (Number(k.atual) === 1 ? 'feito' : 'a fazer') : `${fmtNum(k.atual ?? k.inicial, 2)} / ${fmtNum(k.meta, 2)} ${esc(k.unidade || '')}<div class="mut">partiu de ${fmtNum(k.inicial, 2)}</div>`}</td>
          <td style="min-width:110px">${barraProg(k.progresso, tomProg(k.progresso))}<div class="mut">${fmtNum(k.progresso, 1)}%</div></td>
          <td>${k.ultimo_checkin ? `${fmtData(k.ultimo_checkin)} ${bdg(CONF, k.confianca)}${k.bloqueios ? `<div class="mut">bloqueio: ${esc(k.bloqueios)}</div>` : ''}` : '<span class="badge b-aten">sem check-in</span>'}</td>
          <td>${o.status === 'ativo' && (k.eu_dono || o.edita) ? `<button class="btn btn-mini" onclick="formCheckin(${k.id})">Check-in</button>` : ''}
            <button class="btn-sec btn-mini" onclick="verCheckins(${k.id})">Histórico</button>
            ${o.edita && o.status === 'ativo' ? `<button class="btn-sec btn-mini" onclick="formKr(${o.id}, ${k.id})">Editar</button>` : ''}</td></tr>`).join('')
          || '<tr><td colspan="5" class="mut">Sem resultados-chave ainda.</td></tr>'}</table></div>
      ${o.edita && o.status === 'ativo' ? `<div class="linha-acoes" style="margin-top:6px"><div style="flex:0"><button class="btn-sec btn-mini" onclick="formKr(${o.id})">+ Resultado-chave</button></div>
        <div style="flex:0"><button class="btn-sec btn-mini" onclick="formOkr(null, ${o.id})">+ Objetivo alinhado a este</button></div>
        <div style="flex:0"><button class="btn-sec btn-mini" onclick="formOkr(${o.id})">Editar</button></div>
        <div style="flex:0"><button class="btn-sec btn-mini" onclick="encerrarOkr(${o.id})">Encerrar</button></div></div>` : ''}
      ${o.nota_final ? `<div class="mut">Balanço: ${esc(o.nota_final)}</div>` : ''}</div>` + filhos(o.id).map(f => card(f, nivel + 1)).join('');
  $(alvo).innerHTML = (caixa ? '' : `<div class="card pn-cab"><div style="flex:1;min-width:240px"><h2 style="margin:0 0 2px">🎯 OKR — objetivos e resultados-chave</h2>
      <p class="mut" style="margin:0">Da empresa para a área, o setor e a pessoa, cada objetivo alinhado ao de cima. O dono de cada resultado-chave faz check-in com o valor, a <b>confiança</b> e o que está travando. Progresso = (atual − inicial) ÷ (meta − inicial).</p></div>
      <div><button class="btn" onclick="formOkr()">+ Objetivo</button></div></div><div id="okr-msg"></div>`)
    + (raiz.length ? raiz.map(o => card(o, 0)).join('') : '<div class="card"><div class="vazio">Nenhum objetivo no período. Comece pelos objetivos da empresa (RH) e desdobre para as áreas, setores e pessoas.</div></div>');
}
const recarregarOkr = t => (ABA === 'okr' ? pintarOkrs() : vMeu()).then(() => { if(t && $('okr-msg')) msg('okr-msg', t, 'ok'); });
async function formOkr(id, paiId){
  const o = id ? OKRS.find(x => x.id === id) : { nivel: paiId ? ({ empresa:'area', area:'setor', setor:'pessoa', pessoa:'pessoa' })[OKRS.find(x => x.id === paiId).nivel] : (EDITA() ? 'empresa' : tem('rh_gestor') ? 'setor' : 'pessoa'), pai_id: paiId || null };
  const [areas, setores, { data: pessoas }] = await Promise.all([carregarAreas(), (async () => (await db.rpc('fn_rh_setores')).data || [])(), db.rpc('fn_rh_pessoas')]);
  const niveis = EDITA() ? ['empresa', 'area', 'setor', 'pessoa'] : tem('rh_gestor') ? ['setor', 'pessoa'] : ['pessoa'];
  const d0 = hoje(), trimestre = somaDias(d0, 90);
  modal(`<h3>${id ? 'Editar objetivo' : 'Novo objetivo'}</h3>
    ${id ? `<div class="mut">${esc(NIVEL_OKR[o.nivel])}: ${esc(o.alvo || '')}</div>` : `<label for="ok-n">Nível</label><select id="ok-n" onchange="okrNivel()">${niveis.map(n => `<option value="${n}" ${o.nivel === n ? 'selected' : ''}>${esc(NIVEL_OKR[n])}</option>`).join('')}</select>
      <div id="ok-alvo-a"><label for="ok-a">Área</label><select id="ok-a">${(areas || []).map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></div>
      <div id="ok-alvo-s"><label for="ok-s">Setor</label><select id="ok-s">${setores.map(s => `<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></div>
      <div id="ok-alvo-p"><label for="ok-p">Pessoa</label><select id="ok-p">${(pessoas || []).map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>`}
    <label for="ok-t">Objetivo (qualitativo, inspirador)</label><input id="ok-t" value="${esc(o.titulo || '')}" placeholder="ex.: Ser a referência em amostragem de chaminé no Nordeste">
    <label for="ok-d">Descrição (opcional)</label><textarea id="ok-d" rows="2">${esc(o.descricao || '')}</textarea>
    <label for="ok-pai">Alinhado a (opcional)</label><select id="ok-pai"><option value="">— nenhum —</option>${OKRS.filter(x => x.id !== id).map(x => `<option value="${x.id}" ${o.pai_id === x.id ? 'selected' : ''}>${esc(NIVEL_OKR[x.nivel])} · ${esc(x.titulo)}</option>`).join('')}</select>
    <div class="g2"><div><label for="ok-i">Início</label><input id="ok-i" type="date" value="${esc(o.inicio || d0)}"></div><div><label for="ok-f">Fim</label><input id="ok-f" type="date" value="${esc(o.fim || trimestre)}"></div></div>
    <label for="ok-dono">Dono</label><select id="ok-dono"><option value="">— eu —</option>${(pessoas || []).map(p => `<option value="${p.id}" ${o.dono_id === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>
    <div id="ok-m"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="salvarOkr(${id || 'null'})">Salvar</button></div>`);
  if(!id) okrNivel();
}
function okrNivel(){ const n = v('ok-n'); $('ok-alvo-a').style.display = n === 'area' ? '' : 'none'; $('ok-alvo-s').style.display = n === 'setor' ? '' : 'none'; $('ok-alvo-p').style.display = n === 'pessoa' ? '' : 'none'; }
async function salvarOkr(id){
  const p = { titulo: v('ok-t'), descricao: v('ok-d'), pai_id: v('ok-pai') || null, inicio: v('ok-i'), fim: v('ok-f'), dono_id: v('ok-dono') || null };
  if(!id){ p.nivel = v('ok-n'); if(p.nivel === 'area') p.area_id = v('ok-a'); if(p.nivel === 'setor') p.setor_id = v('ok-s'); if(p.nivel === 'pessoa') p.colaborador_id = v('ok-p'); }
  if(!p.titulo) return msg('ok-m', 'Escreva o objetivo.', 'erro');
  const { error } = await db.rpc('fn_rh_okr_salvar', { p_id: id, p });
  if(error) return msg('ok-m', limparErro(error), 'erro');
  fecharModal(); recarregarOkr(id ? 'Objetivo salvo.' : 'Objetivo criado. Agora inclua os resultados-chave.');
}
async function formKr(okrId, krId){

    <label for="kr-t">Resultado-chave (mensurável)</label><input id="kr-t" value="${esc(k.titulo || '')}" placeholder="ex.: realizar 120 campanhas no trimestre">
    <div class="g2"><div><label for="kr-k">Tipo</label><select id="kr-k" ${krId ? 'disabled' : ''}><option value="numero" ${k.tipo === 'numero' ? 'selected' : ''}>Número</option><option value="percentual" ${k.tipo === 'percentual' ? 'selected' : ''}>Percentual</option><option value="marco" ${k.tipo === 'marco' ? 'selected' : ''}>Marco (feito / não feito)</option></select></div>
      <div><label for="kr-u">Unidade</label><input id="kr-u" value="${esc(k.unidade || '')}" placeholder="campanhas, %, R$"></div>

      <div><label for="kr-p">Peso</label><input id="kr-p" type="number" step="any" value="${k.peso ?? 1}"></div>
      <div><label for="kr-d">Dono</label><select id="kr-d"><option value="">— o do objetivo —</option>${(pessoas || []).map(p => `<option value="${p.id}" ${k.dono_id === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div></div>

    <div id="kr-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="salvarKr(${okrId}, ${krId || 'null'})">Salvar</button></div>`);

async function salvarKr(okrId, krId){
  const p = { okr_id: okrId, titulo: v('kr-t'), tipo: v('kr-k'), unidade: v('kr-u'), inicial: v('kr-i'), meta: v('kr-m'), peso: v('kr-p') || 1, dono_id: v('kr-d') || null };

    <label style="font-weight:400;color:var(--texto)"><input type="checkbox" id="eo-c" style="width:auto"> Cancelar em vez de encerrar (o objetivo deixou de fazer sentido)</label>

// ---------- sucessão ----------
let SUC = [];
