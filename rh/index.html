  const { data } = await db.rpc('fn_rh_sucessao'); SUC = data || [];
  $('okr-corpo').innerHTML = `<div class="card pn-cab"><div style="flex:1;min-width:240px"><h2 style="margin:0 0 2px">🧭 Sucessão</h2>
      <p class="mut" style="margin:0">Posições críticas (um cargo ou uma pessoa-chave), o risco de perdê-las e quem pode assumir — com a prontidão, o último 9-box e o PDI que prepara a pessoa. <b>Só o RH e a consulta veem.</b></p></div>
      ${EDITA() ? `<div><button class="btn" onclick="formPosicao()">+ Posição crítica</button></div>` : ''}</div><div id="suc-msg"></div>
    ${SUC.length ? SUC.map(p => `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div>
        <h3 style="margin:0">${esc(p.titulo)}</h3><div class="mut">${p.tipo === 'pessoa' ? 'pessoa-chave: ' + esc(p.ocupante || '') : 'cargo: ' + esc(p.cargo || '')}${p.impacto ? ' · ' + esc(p.impacto) : ''}</div></div>
        <div>${bdg(RISCO, p.risco_perda)} ${p.tem_pronto ? '<span class="badge b-ok">tem sucessor pronto</span>' : '<span class="badge b-erro">ninguém pronto agora</span>'}${p.ativo ? '' : ' <span class="badge b-info">inativa</span>'}</div></div>
      <div class="tabela" style="margin-top:8px"><table><tr><th>Sucessor</th><th>Prontidão</th><th>Último 9-box</th><th>PDI</th><th></th></tr>
        ${p.sucessores.map(s => `<tr><td>${esc(s.nome)}${s.observacao ? `<div class="mut">${esc(s.observacao)}</div>` : ''}</td><td>${bdg(PRONT, s.prontidao)}</td><td>${esc(s.nove_box || '—')}</td>
          <td>${s.pdi_id ? `<a href="#" onclick="event.preventDefault();abrirPdi(${s.pdi_id})">${esc((PDI_ST[s.pdi_status] || [s.pdi_status])[0])}</a>` : '<span class="mut">sem PDI ligado</span>'}</td>
          <td>${EDITA() ? `<select onchange="mudarProntidao(${s.id}, this.value)">${Object.entries(PRONT).map(([k, x]) => `<option value="${k}" ${s.prontidao === k ? 'selected' : ''}>${x[0]}</option>`).join('')}</select>
            <button class="btn-perigo btn-mini" onclick="tirarSucessor(${s.id})">Tirar</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="mut">Nenhum sucessor indicado.</td></tr>'}</table></div>
      ${EDITA() ? `<button class="btn-sec btn-mini" style="margin-top:6px" onclick="formSucessor(${p.id})">+ Sucessor</button>` : ''}</div>`).join('')
      : '<div class="card"><div class="vazio">Nenhuma posição crítica mapeada. Comece pelas funções que parariam a operação se ficassem vagas.</div></div>'}`;
}
async function formPosicao(){
  const [{ data: pessoas }, funcoes] = await Promise.all([db.rpc('fn_rh_pessoas'), (async () => (await db.rpc('fn_rh_funcoes')).data || [])()]);
  modal(`<h3>Posição crítica</h3>
    <label for="po-tp">Tipo</label><select id="po-tp" onchange="$('po-c-b').style.display=this.value==='cargo'?'':'none';$('po-o-b').style.display=this.value==='pessoa'?'':'none'"><option value="pessoa">Pessoa-chave</option><option value="cargo">Cargo</option></select>
    <div id="po-o-b"><label for="po-o">Quem ocupa</label><select id="po-o">${(pessoas || []).map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
    <div id="po-c-b" style="display:none"><label for="po-c">Cargo</label><select id="po-c">${funcoes.filter(f => f.cargo_id).map(f => `<option value="${f.cargo_id}">${esc(f.funcao)}</option>`).join('')}</select></div>
    <label for="po-t">Nome da posição</label><input id="po-t" placeholder="ex.: Coordenação de amostragem">
    <div class="g2"><div><label for="po-r">Risco de perda</label><select id="po-r"><option value="alto">Alto</option><option value="medio" selected>Médio</option><option value="baixo">Baixo</option></select></div>
      <div><label for="po-k">Criticidade</label><select id="po-k"><option value="alta">Alta</option><option value="media">Média</option></select></div></div>
    <label for="po-i">Impacto se ficar vaga</label><textarea id="po-i" rows="2"></textarea>
    <div id="po-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="salvarPosicao()">Salvar</button></div>`);
}
async function salvarPosicao(){
  const p = { tipo: v('po-tp'), ocupante_id: v('po-tp') === 'pessoa' ? v('po-o') : null, cargo_id: v('po-tp') === 'cargo' ? v('po-c') : null, titulo: v('po-t'), risco_perda: v('po-r'), criticidade: v('po-k'), impacto: v('po-i') };
  if(!p.titulo) return msg('po-msg', 'Dê um nome à posição.', 'erro');
  const { error } = await db.rpc('fn_rh_sucessao_posicao_salvar', { p_id: null, p }); if(error) return msg('po-msg', limparErro(error), 'erro');
  fecharModal(); pintarSucessao();
}
async function formSucessor(posId){
  const { data: pessoas } = await db.rpc('fn_rh_pessoas');
  modal(`<h3>Sucessor</h3><label for="su-p">Pessoa</label><select id="su-p">${(pessoas || []).map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>
    <label for="su-r">Prontidão</label><select id="su-r">${Object.entries(PRONT).map(([k, x]) => `<option value="${k}">${x[0]}</option>`).join('')}</select>
    <label for="su-o">Observação (o que falta para estar pronto)</label><textarea id="su-o" rows="2"></textarea>
    <div class="mut">O plano de preparo é o PDI da pessoa: ligue-o depois de abrir o PDI dela.</div>
    <div id="su-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="salvarSucessor(${posId})">Salvar</button></div>`);
}
async function salvarSucessor(posId){
  const pdis = (await db.rpc('fn_rh_pdis', { p_colaborador: v('su-p') })).data || [];
  const aberto = pdis.find(p => ['rascunho','aguardando_acordo','ativo'].includes(p.status));
  const { error } = await db.rpc('fn_rh_sucessor_salvar', { p_id: null, p: { posicao_id: posId, colaborador_id: v('su-p'), prontidao: v('su-r'), observacao: v('su-o'), pdi_id: aberto ? aberto.id : null } });
  if(error) return msg('su-msg', limparErro(error), 'erro');
  fecharModal(); pintarSucessao();
}
async function mudarProntidao(id, pr){ const { error } = await db.rpc('fn_rh_sucessor_salvar', { p_id: id, p: { prontidao: pr } }); if(error) return msg('suc-msg', limparErro(error), 'erro'); pintarSucessao(); }
async function tirarSucessor(id){ if(!(await confirmar('Tirar sucessor', 'A indicação sai do mapa de sucessão.', 'Tirar'))) return; await db.rpc('fn_rh_sucessor_excluir', { p_id: id }); pintarSucessao(); }

// ---------- CLIMA ----------
let PESQ = null;
async function vClima(arg){
  if(typeof arg === 'number') return abrirPesquisa(arg);
  if(typeof arg === 'string') SUB_CLIMA_T = arg;
  if(EMPRESA() && SUB_CLIMA_T === 'pulso') return vPulso();
  if(EMPRESA() && SUB_CLIMA_T === 'questionarios') return vQuestionarios();
  const { data, error } = await db.rpc('fn_rh_pesquisas');
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  el(subBarClima() + `<div class="card pn-cab"><div style="flex:1;min-width:240px"><h2 style="margin:0 0 2px">🌤️ Pesquisa de clima</h2>
      <p class="mut" style="margin:0"><b>Anônima de verdade:</b> a resposta não fica ligada a ninguém; o resultado só aparece com a pesquisa encerrada e com pelo menos o mínimo de respostas; recorte pequeno é recusado. Riscos psicossociais (NR-1, PGR) são do sistema <b>PSI</b>, não desta pesquisa.</p></div>
      ${EDITA() ? `<div><button class="btn" onclick="formPesquisa()">+ Nova pesquisa</button></div>` : ''}</div>
    ${(data || []).length ? `<div class="tabela"><table><tr><th>Pesquisa</th><th>Período</th><th>Situação</th><th>Adesão</th><th></th></tr>
      ${data.map(s => `<tr><td><b>${esc(s.titulo)}</b><div class="mut">${s.tipo === 'enps' ? 'eNPS' : 'clima'} · ${s.perguntas} pergunta(s) · mínimo ${s.min_respostas} respostas</div></td>
        <td>${fmtData(s.inicio)} a ${fmtData(s.fim)}</td><td>${bdg(PESQ_ST, s.status)}</td>
        <td>${s.convidados ? `${barraPct(s.adesao_pct)}<div class="mut">${s.responderam}/${s.convidados} · ${fmtNum(s.adesao_pct || 0, 1)}%</div>` : '<span class="mut">—</span>'}</td>
        <td><button class="btn-sec btn-mini" onclick="abrirPesquisa(${s.id})">Abrir</button></td></tr>`).join('')}</table></div>`
      : `<div class="card"><div class="vazio">Nenhuma pesquisa ainda.${EDITA() ? ' Clique em "Nova pesquisa" e use o modelo de clima da Ambimet como ponto de partida.' : ''}</div></div>`}`);
}
async function formPesquisa(){
  const [areas, setores] = await Promise.all([carregarAreas(), (async () => (await db.rpc('fn_rh_setores')).data || [])()]);
  modal(`<h3>Nova pesquisa</h3><label for="pq-t">Título</label><input id="pq-t" placeholder="ex.: Pesquisa de clima 2026">
    <div class="g2"><div><label for="pq-k">Tipo</label><select id="pq-k"><option value="clima">Clima (modelo completo)</option><option value="enps">Só eNPS (rápida)</option></select></div>
      <div><label for="pq-m">Mínimo de respostas para mostrar resultado</label><input id="pq-m" type="number" min="5" value="5"></div>
      <div><label for="pq-i">Abre em</label><input id="pq-i" type="date" value="${hoje()}"></div><div><label for="pq-f">Fecha em</label><input id="pq-f" type="date" value="${somaDias(hoje(), 14)}"></div></div>
    <label for="pq-a">Público — áreas (vazio = todos)</label><select id="pq-a" multiple size="3">${(areas || []).map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select>
    <label for="pq-s">Público — setores (vazio = todos)</label><select id="pq-s" multiple size="3">${setores.map(s => `<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select>
    <label for="pq-x">Instruções para quem responde</label><textarea id="pq-x" rows="2">Leva cerca de 5 minutos. Responda com sinceridade: a pesquisa é anônima — ninguém, nem o RH, vê a sua resposta individual.</textarea>
    <div id="pq-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="criarPesquisa()">Criar</button></div>`);
}
async function criarPesquisa(){
  const sel = id => [...$(id).selectedOptions].map(o => Number(o.value));
  const p = { titulo: v('pq-t'), tipo: v('pq-k'), min_respostas: v('pq-m'), inicio: v('pq-i'), fim: v('pq-f'), instrucoes: v('pq-x'), publico: { areas: sel('pq-a'), setores: sel('pq-s') } };
  if(!p.titulo) return msg('pq-msg', 'Dê um título.', 'erro');
  const { data, error } = await db.rpc('fn_rh_pesquisa_salvar', { p_id: null, p }); if(error) return msg('pq-msg', limparErro(error), 'erro');
  await db.rpc('fn_rh_pesquisa_usar_modelo', { p_pesquisa: data, p_modelo: p.tipo === 'enps' ? 'enps_ambimet' : 'clima_ambimet' });
  fecharModal(); abrirPesquisa(data, 'Criada com o modelo da Ambimet. Ajuste as perguntas e abra.');
}
async function abrirPesquisa(id, aviso){
  const [{ data: lista }, { data: perg }] = await Promise.all([db.rpc('fn_rh_pesquisas'), db.from('rh_pesquisa_perguntas').select('*').eq('pesquisa_id', id).order('ordem')]);
  const s = (lista || []).find(x => x.id === id); if(!s) return el(`<div class="card"><div class="vazio">Pesquisa não encontrada.</div></div>`);
  PESQ = { ...s, perguntas: perg || [] }; const ed = EDITA();
  let corpo = '';
  if(s.status === 'rascunho') corpo = `<div class="faixa-t">Perguntas (${PESQ.perguntas.length})</div><div class="tabela"><table><tr><th>#</th><th>Dimensão</th><th>Pergunta</th><th>Tipo</th><th></th></tr>
      ${PESQ.perguntas.map(q => `<tr><td>${q.ordem}</td><td>${esc(q.dimensao)}</td><td>${esc(q.texto)}${q.obrigatoria ? '' : ' <span class="mut">(opcional)</span>'}</td>
        <td>${q.tipo === 'escala' ? '1 a 5' : q.tipo === 'enps' ? '0 a 10 (eNPS)' : 'texto'}</td><td>${ed ? `<button class="btn-perigo btn-mini" onclick="excluirPergunta(${q.id})">Tirar</button>` : ''}</td></tr>`).join('')}</table></div>
    ${ed ? `<details><summary>+ Pergunta</summary><div class="g3"><div><label for="nq-d">Dimensão</label><input id="nq-d" placeholder="ex.: Liderança"></div>
      <div><label for="nq-k">Tipo</label><select id="nq-k"><option value="escala">Escala 1 a 5</option><option value="texto">Texto aberto</option><option value="enps">eNPS 0 a 10</option></select></div></div>
      <label for="nq-t">Pergunta</label><input id="nq-t"><button class="btn-sec" style="margin-top:6px" onclick="novaPergunta()">Incluir</button></details>` : ''}`;
  if(s.status === 'aberta'){
    const { data: pend } = ed ? await db.rpc('fn_rh_pesquisa_pendentes', { p_pesquisa: id }) : { data: [] };
    corpo = `<div class="msg msg-info">Aberta até ${fmtData(s.fim)}. O resultado aparece <b>só depois de encerrar</b> — com ela aberta, comparar antes e depois de alguém responder mostraria a resposta dessa pessoa.</div>
      ${ed ? `<div class="faixa-t">Ainda não responderam (${(pend || []).length})</div><div class="mut">Para lembrar. Quem já respondeu não aparece com data, e a resposta não tem nome.</div>
        <div class="tabela"><table><tr><th>Pessoa</th><th>Setor</th><th></th></tr>${(pend || []).map(p => `<tr><td>${esc(p.nome)}</td><td>${esc(p.setor || '')}</td>
          <td><button class="btn-sec btn-mini" onclick="linkPesquisa('${p.colaborador_id}')">Link (quem não tem login)</button></td></tr>`).join('')}</table></div><div id="pq-link" style="word-break:break-all"></div>` : ''}`;
  }
  el(`<div style="margin-bottom:10px"><a href="#" onclick="event.preventDefault();irPara('clima')">← pesquisas</a></div>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="margin-top:0">${esc(s.titulo)}</h2>
      <div class="mut">${fmtData(s.inicio)} a ${fmtData(s.fim)} · mínimo ${s.min_respostas} respostas${s.convidados ? ` · adesão ${s.responderam}/${s.convidados} (${fmtNum(s.adesao_pct || 0, 1)}%)` : ''}</div></div><div>${bdg(PESQ_ST, s.status)}</div></div>
      <div class="linha-acoes" style="margin-top:8px">${ed && s.status === 'rascunho' ? `<div style="flex:0"><button class="btn" onclick="abrirPesquisaAgora()">Abrir a pesquisa</button></div>` : ''}
        ${ed && s.status === 'aberta' ? `<div style="flex:0"><button class="btn" onclick="encerrarPesquisa()">Encerrar e ver o resultado</button></div>` : ''}
        ${s.status === 'encerrada' ? `<div style="flex:0"><button class="btn-sec" onclick="imprimirClima()">Imprimir</button></div>` : ''}</div>
      <div id="pq-m2"></div></div>${corpo}<div id="pq-res"></div>`);
  if(aviso) msg('pq-m2', aviso, 'ok');
  if(s.status === 'encerrada') pintarResultado();   // o gestor recebe o da equipe (fn_rh_pesquisa_resultado_equipe)
}
async function novaPergunta(){
  const { error } = await db.rpc('fn_rh_pesquisa_pergunta_salvar', { p_id: null, p: { pesquisa_id: PESQ.id, dimensao: v('nq-d'), tipo: v('nq-k'), texto: v('nq-t') } });
  if(error) return msg('pq-m2', limparErro(error), 'erro'); abrirPesquisa(PESQ.id, 'Pergunta incluída.');
}
async function excluirPergunta(qid){ const { error } = await db.rpc('fn_rh_pesquisa_pergunta_excluir', { p_id: qid }); if(error) return msg('pq-m2', limparErro(error), 'erro'); abrirPesquisa(PESQ.id); }
async function abrirPesquisaAgora(){
  if(!(await confirmar('Abrir a pesquisa', 'Cada pessoa do público recebe um convite. As perguntas não mudam mais.', 'Abrir'))) return;
  const { data, error } = await db.rpc('fn_rh_pesquisa_abrir', { p_id: PESQ.id }); if(error) return msg('pq-m2', limparErro(error), 'erro');
  abrirPesquisa(PESQ.id, `Aberta: ${data} pessoa(s) convidada(s). Quem tem login vê no Meu RH; para quem não tem, gere o link.`);
}
async function encerrarPesquisa(){
  if(!(await confirmar('Encerrar a pesquisa', 'Ninguém mais responde. O resultado aparece (se houver o mínimo de respostas).', 'Encerrar'))) return;
  const { error } = await db.rpc('fn_rh_pesquisa_encerrar', { p_id: PESQ.id, p_cancelar: false }); if(error) return msg('pq-m2', limparErro(error), 'erro');
  abrirPesquisa(PESQ.id);
}
async function linkPesquisa(colab){
  const { data, error } = await db.rpc('fn_rh_pesquisa_link', { p_pesquisa: PESQ.id, p_colaborador: colab }); if(error) return msg('pq-m2', limparErro(error), 'erro');
  mostrarLinkDes('pq-link', data); $('pq-link').querySelector('.mut').textContent = 'O link é só desta pessoa, mas a resposta não fica ligada a ela.';
}
let RES_CLIMA = null;
async function pintarResultado(dim, grupo){
  const { data: r, error } = EMPRESA() ? await db.rpc('fn_rh_pesquisa_resultado', { p_pesquisa: PESQ.id, p_dim: dim || null, p_grupo: grupo || null })
                                        : await db.rpc('fn_rh_pesquisa_resultado_equipe', { p_pesquisa: PESQ.id });
  if(error) return msg('pq-res', limparErro(error), 'erro');
  RES_CLIMA = r;
  if(r.situacao === 'bloqueado' || (r.situacao === 'insuficiente' && r.motivo)) return $('pq-res').innerHTML = `<div class="card"><h3 style="margin-top:0">Resultado da sua equipe</h3><div class="msg msg-aviso">${esc(r.motivo)} Para proteger o anonimato, nenhum número da equipe é mostrado.</div></div>`;
  if(r.situacao === 'insuficiente') return $('pq-res').innerHTML = `<div class="card"><div class="msg msg-aviso">Só ${r.n} resposta(s) — abaixo do mínimo de ${r.minimo}. Para proteger o anonimato, nenhum número é mostrado.</div></div>`;
  const grupos = {};
  if(EMPRESA()) for(const d of ['area', 'setor', 'tempo_casa']) grupos[d] = ((await db.rpc('fn_rh_pesquisa_grupos', { p_pesquisa: PESQ.id, p_dim: d })).data || []);
  const TEMPO = { ate_1:'até 1 ano', '1_3':'1 a 3 anos', '3_5':'3 a 5 anos', '5_mais':'5 anos ou mais' };
  const nomeG = (d, g) => d === 'tempo_casa' ? (TEMPO[g] || g) : g;
  const opts = Object.entries(grupos).flatMap(([d, l]) => l.map(g => `<option value="${d}|${esc(g.grupo)}" ${dim === d && grupo === g.grupo ? 'selected' : ''}>${({ area:'Área', setor:'Setor', tempo_casa:'Tempo de casa' })[d]}: ${esc(nomeG(d, g.grupo))} (${g.n})</option>`));
  const corFav = f => f >= 70 ? '--verde' : f >= 50 ? '--lar' : '--verm';
  $('pq-res').innerHTML = (!EMPRESA() ? `<div class="card"><h3 style="margin:0">Resultado da sua equipe (direta e indireta)</h3><div class="mut">Liberado porque a equipe tem pelo menos ${r.minimo} respostas e nenhuma comparação isola alguém.</div></div>` : '') + (!EMPRESA() ? '' : `<div class="card"><div class="linha-acoes"><div><label for="rc-g">Recorte (um de cada vez)</label><select id="rc-g" onchange="const [d,g]=this.value.split('|');pintarResultado(d||null,g||null)">
      <option value="">Toda a empresa</option>${opts.join('')}</select></div></div>
      <div class="mut">Só aparecem os grupos com pelo menos ${r.minimo} respostas; os pequenos são somados em "Outros" (e, se preciso, um vizinho vai junto, para ninguém ser descoberto por subtração).${opts.length ? '' : ' <b>Esta pesquisa não permite recorte sem expor alguém.</b>'}</div></div>`) + `
    <div class="pn-cards">
      ${pnCard({ ic:'🗳️', lab:'Respostas', val: r.n, tom:'azul', ctx: r.convidados ? `adesão ${fmtNum(r.adesao_pct || 0, 1)}% de ${r.convidados}` : (dim ? 'no recorte' : '') })}
      ${pnCard({ ic:'👍', lab:'Favorabilidade', val: r.favorabilidade != null ? fmtNum(r.favorabilidade, 1) + '%' : null, tom: r.favorabilidade >= 70 ? 'verde' : 'lar', ctx:`média ${fmtNum(r.media || 0, 2)} de 5`, formula:'respostas 4 ou 5 (escala de 1 a 5) ÷ respostas' })}

      <div><b>${esc(p.titulo)}</b><div class="mut">anônima · até ${fmtData(p.fim)}</div></div><button class="btn btn-mini" onclick="responderPesquisa(${p.pesquisa_id})">Responder</button></div>`).join('')}</div>` : '';
}
let FPESQ = null;
async function responderPesquisa(id){
  const { data, error } = await db.rpc('fn_rh_pesquisa_formulario', { p_pesquisa: id });
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(limparErro(error))}</div></div>`);
  FPESQ = data;
  if(data.respondida) return el(`<div class="card"><div class="msg msg-ok">Você já respondeu esta pesquisa. Obrigado!</div></div>`);
  el(`<div style="margin-bottom:10px"><a href="#" onclick="event.preventDefault();irPara('meu')">← Meu RH</a></div>
    <div class="card"><h2 style="margin-top:0">${esc(data.titulo)}</h2><div class="msg msg-info">${esc(data.instrucoes || '')} <b>Sua resposta é anônima</b>: ela é guardada sem o seu nome, e o resultado só aparece somado, com pelo menos ${data.min_respostas} respostas.</div></div>
    ${htmlPerguntasPesquisa(data.perguntas)}
    <div class="card"><div id="rp-msg"></div><button class="btn" onclick="enviarPesquisa()">Enviar (anônimo)</button></div>`);
}
function htmlPerguntasPesquisa(perg){
  let dimAnt = null;
  return perg.map(q => { const cab = q.dimensao !== dimAnt ? `<div class="faixa-t">${esc(q.dimensao)}</div>` : ''; dimAnt = q.dimensao;
    const op = (n, rot) => `<label style="flex:0;font-weight:600;color:var(--texto);display:flex;gap:4px;align-items:center;border:1px solid var(--borda);border-radius:8px;padding:6px 10px;margin:0">
      <input type="radio" name="pq-${q.id}" value="${n}" style="width:auto"> ${rot ?? n}</label>`;
    return cab + `<div class="card"><div style="margin-bottom:6px">${esc(q.texto)}${q.obrigatoria || q.tipo === 'texto' ? '' : ''}</div>
      ${q.tipo === 'escala' ? `<div class="linha-acoes" style="flex-wrap:wrap">${[1, 2, 3, 4, 5].map(n => op(n)).join('')}</div><div class="mut">1 = discordo totalmente · 5 = concordo totalmente</div>`
        : q.tipo === 'enps' ? `<div class="linha-acoes" style="flex-wrap:wrap">${Array.from({ length: 11 }, (_, n) => op(n)).join('')}</div><div class="mut">0 = de jeito nenhum · 10 = com certeza</div>`
        : `<textarea id="pq-t-${q.id}" rows="2" maxlength="2000" placeholder="opcional — evite citar nomes"></textarea>`}</div>`; }).join('');
}
function respostasPesquisa(perg){
  const r = {};
  perg.forEach(q => { if(q.tipo === 'texto'){ const t = ($('pq-t-' + q.id).value || '').trim(); if(t) r[q.id] = t; }
    else { const x = document.querySelector(`input[name="pq-${q.id}"]:checked`); if(x) r[q.id] = Number(x.value); } });
  return r;
}
async function enviarPesquisa(){
  const { data, error } = await db.rpc('fn_rh_pesquisa_responder', { p_pesquisa: FPESQ.id, p_respostas: respostasPesquisa(FPESQ.perguntas) });
  if(error) return msg('rp-msg', limparErro(error), 'erro');
  if(!data.ok) return msg('rp-msg', data.mensagem, 'erro');
  el(`<div class="card" style="text-align:center"><div style="font-size:40px">✅</div><h2>Obrigado!</h2><div class="msg msg-ok">${esc(data.mensagem)}</div>
    <button class="btn-sec" onclick="irPara('meu')">Voltar ao Meu RH</button></div>`);
}

/* =====================================================================
   COMPETÊNCIA TÉCNICA — ISO/IEC 17025, 6.2 (Fase 5). A trilha de cada pessoa
   por atividade: em treinamento → supervisionado → autorizado, com os
   critérios conferidos no banco, quem autorizou, monitoramento que renova ou
   suspende, e a MATRIZ DE QUALIFICAÇÃO exportável para a Cgcre.
   ===================================================================== */
const ETAPA = { em_treinamento:['em treinamento','b-info'], supervisionado:['supervisionado','b-info'], autorizado:['autorizado','b-ok'], suspenso:['SUSPENSO','b-erro'], revogado:['revogado','b-erro'] };
const SIT_AUT = { vigente:['autorizado','b-ok'], vencendo:['vence em breve','b-aten'], vencida:['VENCIDA','b-erro'], em_treinamento:['em treinamento','b-info'],
  supervisionado:['supervisionado','b-info'], suspenso:['SUSPENSO','b-erro'], revogado:['revogado','b-erro'] };
const EVID_TIPO = { treinamento:'Treinamento no método', execucao_supervisionada:'Execução supervisionada', proficiencia:'Ensaio de proficiência / interlaboratorial',
  avaliacao_teorica:'Avaliação teórica', certificado:'Certificado', outro:'Outro' };
const MON_MET = { observacao:'Observação da execução', reensaio:'Reensaio / amostra cega', proficiencia:'Ensaio de proficiência', auditoria_testemunha:'Auditoria testemunha',
  revisao_registros:'Revisão de registros', outro:'Outro' };
const ATIV_TIPO = { amostragem:'Amostragem', ensaio:'Ensaio', calibracao:'Calibração', analise_resultado:'Análise de resultado', revisao:'Revisão técnica', emissao_relatorio:'Emissão de relatório', outro:'Outro' };
let SUB_TEC = 'matriz', MATRIZ = null, TRILHA = null, F_TEC_AREA = '';

async function vTecnica(arg){
  if(typeof arg === 'string') SUB_TEC = arg;
  const subs = [['matriz', 'Matriz de qualificação'], ['atividades', 'Atividades técnicas']].concat(EMPRESA() ? [['autorizadores', 'Quem autoriza']] : []);
  if(!subs.some(s => s[0] === SUB_TEC)) SUB_TEC = 'matriz';
  el(`<div class="sub">${subs.map(([k, t]) => `<button class="${SUB_TEC === k ? 'on' : ''}" onclick="vTecnica('${k}')">${t}</button>`).join('')}</div><div id="tec-corpo"></div>`);
  ({ matriz: pintarMatriz, atividades: pintarAtividades, autorizadores: pintarAutorizadores })[SUB_TEC]();
}

// ---------- matriz ----------
async function pintarMatriz(){
  const [{ data, error }, areas] = await Promise.all([db.rpc('fn_rh_matriz_qualificacao', { p_area: F_TEC_AREA ? Number(F_TEC_AREA) : null }), carregarAreas()]);
  if(error) return $('tec-corpo').innerHTML = `<div class="msg msg-erro">${esc(erroDe(error))}</div>`;
  MATRIZ = data;
  const cel = (p, t) => { const c = (p.celulas || {})[t.id] || {};
    if(c.autorizacao_id) return `<a href="#" onclick="event.preventDefault();abrirTrilha(${c.autorizacao_id})">${bdg(SIT_AUT, c.situacao)}</a>${c.validade && ['vigente','vencendo','vencida'].includes(c.situacao) ? `<div class="mut">até ${fmtData(c.validade)}</div>` : ''}`;
    return c.exigida ? `<span class="badge b-aten">exigida — sem trilha</span>${EDITA() || tem('rh_gestor') ? ` <a href="#" onclick="event.preventDefault();iniciarTrilha('${p.id}', ${t.id})">abrir</a>` : ''}` : '<span class="mut">—</span>'; };
  $('tec-corpo').innerHTML = `<div class="card pn-cab"><div style="flex:1;min-width:240px"><h2 style="margin:0 0 2px">🔬 Matriz de qualificação (ISO/IEC 17025, 6.2)</h2>
      <p class="mut" style="margin:0">Quem está autorizado para cada atividade técnica, até quando, e quem está em treinamento. A célula abre a trilha: evidências, quem autorizou, monitoramentos e o histórico. Pronta para a auditoria da Cgcre (.xlsx).</p></div>
      <div style="min-width:180px"><label for="tec-area">Área</label><select id="tec-area" onchange="F_TEC_AREA=this.value;pintarMatriz()"><option value="">Todas</option>${(areas || []).map(a => `<option value="${a.id}" ${String(a.id) === F_TEC_AREA ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}</select></div>
      <div class="linha-acoes"><div style="flex:0"><button class="btn-sec" onclick="exportarMatriz()">Exportar .xlsx</button></div><div style="flex:0"><button class="btn-sec" onclick="imprimirMatriz()">Imprimir</button></div>
        ${EDITA() || tem('rh_gestor') ? `<div style="flex:0"><button class="btn" onclick="formTrilha()">+ Abrir trilha</button></div>` : ''}</div></div><div id="tec-msg"></div>
    ${data && data.atividades.length ? (data.pessoas.length ? `<div class="tabela"><table><tr><th>Pessoa</th>${data.atividades.map(t => `<th title="${esc(t.nome)}${t.metodo ? ' — ' + esc(t.metodo) : ''}">${esc(t.codigo)}</th>`).join('')}</tr>
      ${data.pessoas.map(p => `<tr><td><b>${esc(p.nome)}</b><div class="mut">${esc(p.funcao || '')}</div></td>${data.atividades.map(t => `<td>${cel(p, t)}</td>`).join('')}</tr>`).join('')}</table></div>
      <div class="mut">${data.atividades.map(t => `<b>${esc(t.codigo)}</b>: ${esc(t.nome)}${t.metodo ? ' (' + esc(t.metodo) + ')' : ''}`).join(' · ')}</div>`
      : '<div class="card"><div class="vazio">Ninguém em trilha nem com a atividade exigida pelo cargo. Ligue os requisitos "Autorização ISO 17025" dos cargos às atividades (Estrutura → Cargos) ou abra uma trilha.</div></div>')
      : `<div class="card"><div class="vazio">Nenhuma atividade técnica cadastrada.${EDITA() ? ' Comece em "Atividades técnicas".' : ''}</div></div>`}`;
}
async function formTrilha(colab, ativ){
  const [{ data: pessoas }, { data: ativs }] = await Promise.all([db.rpc('fn_rh_pessoas'), db.from('rh_atividades_tecnicas').select('id,codigo,nome').eq('ativo', true).order('codigo')]);
  modal(`<h3>Abrir trilha de autorização</h3>
    <label for="tr-p">Pessoa</label><select id="tr-p">${(pessoas || []).map(p => `<option value="${p.id}" ${p.id === colab ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>
    <label for="tr-a">Atividade</label><select id="tr-a">${(ativs || []).map(a => `<option value="${a.id}" ${a.id === ativ ? 'selected' : ''}>${esc(a.codigo)} — ${esc(a.nome)}</option>`).join('')}</select>
    <label for="tr-o">Observação (opcional)</label><textarea id="tr-o" rows="2"></textarea>
    <div id="tr-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="salvarTrilha()">Abrir</button></div>`);
}
function iniciarTrilha(colab, ativ){ return formTrilha(colab, ativ); }
async function salvarTrilha(){
  const { data, error } = await db.rpc('fn_rh_aut_iniciar', { p_colaborador: v('tr-p'), p_atividade: Number(v('tr-a')), p_obs: v('tr-o') || null });
  if(error) return msg('tr-msg', limparErro(error), 'erro');
  fecharModal(); if(ABA === 'tecnica') await pintarMatriz(); abrirTrilha(data, 'Trilha aberta: em treinamento (acompanhado).');
}

// ---------- a trilha ----------
async function abrirTrilha(id, aviso){
  const { data: x } = await db.rpc('fn_rh_autorizacao_abrir', { p_aut: id });
  if(!x) return;
  TRILHA = x; const a = x.autorizacao, t = x.atividade, c = x.criterios, et = a.etapa;
  const passo = (ok, txt) => `<div>${ok ? '✅' : '<span class="badge b-aten">falta</span>'} ${txt}</div>`;
  modal(`<h3>${esc(x.nome)} — ${esc(t.codigo)}</h3><div class="mut">${esc(t.nome)}${t.metodo ? ' · ' + esc(t.metodo) : ''}</div>
    <div style="margin:8px 0">${bdg(ETAPA, et)} ${a.situacao !== et ? bdg(SIT_AUT, a.situacao) : ''}
      ${a.autorizado_em ? `<span class="mut">autorizado em ${fmtData(a.autorizado_em)} por <b>${esc(x.autorizado_por_nome || '')}</b> · vale até ${fmtData(a.validade)}</span>` : ''}</div>
    ${t.criterio ? `<div class="mut">Critério de competência: ${esc(t.criterio)}</div>` : ''}
    <div class="faixa-t" style="margin-top:10px">Trilha</div>
    <div class="g3"><div>${passo(c.treinamentos > 0, `Treinamento no método (${c.treinamentos})`)}</div>
      <div>${passo(c.supervisionadas >= c.supervisionadas_min, `Execuções supervisionadas satisfatórias: ${c.supervisionadas} de ${c.supervisionadas_min}`)}</div>
      <div>${c.exige_proficiencia ? passo(c.proficiencia_ok, 'Ensaio de proficiência satisfatório') : '<span class="mut">proficiência não exigida</span>'}</div></div>
    ${c.falta.length && ['supervisionado','suspenso'].includes(et) ? `<div class="msg msg-info">Para autorizar, falta: ${esc(c.falta.join('; '))}.</div>` : ''}
    <div class="linha-acoes" style="margin-top:8px;flex-wrap:wrap">
      ${x.edita && et === 'em_treinamento' ? `<div style="flex:0"><button class="btn-sec" onclick="avancarTrilha('supervisionado')" ${c.pode_supervisionar ? '' : 'disabled title="registre o treinamento antes"'}>Passar a supervisionado</button></div>` : ''}
      ${x.autoriza && ['supervisionado','suspenso'].includes(et) ? `<div style="flex:0"><button class="btn" onclick="avancarTrilha('autorizado')" ${c.pode_autorizar ? '' : 'disabled'}>Autorizar</button></div>` : ''}

      ${x.revoga && et !== 'revogado' ? `<div style="flex:0"><button class="btn-perigo" onclick="motivoTrilha('revogado')">Revogar</button></div>` : ''}</div>

const erroTri = e => msg('tri-msg', limparErro(e), 'erro');
// execução supervisionada, proficiência e avaliação teórica EXIGEM resultado; nas outras ele é opcional
function ajustarResultadoEv(){
  const exige = ['execucao_supervisionada', 'proficiencia', 'avaliacao_teorica'].includes(v('ev-t'));
  $('ev-r').innerHTML = (exige ? '' : '<option value="">— (não se aplica)</option>') + '<option value="satisfatorio">Satisfatório</option><option value="insatisfatorio">Insatisfatório</option>';
  $('ev-r').value = exige ? 'satisfatorio' : '';
}
async function recarregarTrilha(t){ if(ABA === 'tecnica' && SUB_TEC === 'matriz') await pintarMatriz(); abrirTrilha(TRILHA.autorizacao.id, t); }
async function avancarTrilha(para){
  const { data, error } = await db.rpc('fn_rh_aut_avancar', { p_aut: TRILHA.autorizacao.id, p_para: para, p_motivo: null });
  if(error) return erroTri(error); recarregarTrilha(para === 'autorizado' ? 'Autorizado. A validade conta a partir de hoje.' : 'Agora supervisionado.');
}
function motivoTrilha(para){
  const box = $('tri-msg');
  box.innerHTML = `<div class="msg msg-aviso"><label for="tri-mot">Motivo da ${para === 'suspenso' ? 'suspensão' : 'revogação'}</label><textarea id="tri-mot" rows="2"></textarea>
    <button class="btn-perigo" style="margin-top:6px" id="tri-ok">${para === 'suspenso' ? 'Suspender' : 'Revogar'}</button></div>`;
  $('tri-ok').onclick = async () => { const { error } = await db.rpc('fn_rh_aut_avancar', { p_aut: TRILHA.autorizacao.id, p_para: para, p_motivo: v('tri-mot') });
    if(error) return erroTri(error); recarregarTrilha(para === 'suspenso' ? 'Suspensa.' : 'Revogada.'); };
}
async function salvarEvidencia(){
  if(!v('ev-x')) return erroTri({ message: 'Descreva a evidência (o que foi feito, onde, com quem).' });
  const { error } = await db.rpc('fn_rh_aut_evidencia', { p_aut: TRILHA.autorizacao.id, p: { tipo: v('ev-t'), data: v('ev-d'), resultado: v('ev-r') || null, descricao: v('ev-x') } });
  if(error) return erroTri(error); recarregarTrilha('Evidência registrada.');
}
async function salvarMonitoramento(){
  const { data, error } = await db.rpc('fn_rh_aut_monitorar', { p_aut: TRILHA.autorizacao.id, p: { data: v('mo-d'), metodo: v('mo-m'), resultado: v('mo-r'), observacao: v('mo-o') } });
  if(error) return erroTri(error); recarregarTrilha(data === 'suspensa' ? 'Monitoramento insatisfatório: autorização SUSPENSA.' : data === 'renovada' ? 'Monitoramento satisfatório: validade renovada.' : 'Monitoramento registrado.');
}

    <h3>Histórico</h3>${x.eventos.map(v2 => `<p>${fmtDataHora(v2.em)} · ${esc(v2.de || '—')} → ${esc(v2.para)} · ${esc(v2.quem || '')}${v2.motivo ? ' · ' + esc(v2.motivo) : ''}</p>`).join('')}`);

// ---------- exportar e imprimir a matriz ----------
async function linhasAutorizacoes(){ return (await db.rpc('fn_rh_autorizacoes', { p_colaborador: null })).data || []; }
async function exportarMatriz(){
  if(typeof XLSX === 'undefined' || !MATRIZ) return msg('tec-msg', 'Não foi possível carregar o gerador de planilha.', 'erro');
  const wb = XLSX.utils.book_new(), m = MATRIZ;
  const rotulo = c => !c || !c.etapa ? (c && c.exigida ? 'EXIGIDA — sem trilha' : '') : (SIT_AUT[c.situacao] || [c.situacao])[0] + (c.validade && ['vigente','vencendo','vencida'].includes(c.situacao) ? ' até ' + fmtData(c.validade) : '');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(m.pessoas.map(p => Object.assign({ Pessoa: p.nome, 'Função': p.funcao || '', Setor: p.setor || '' },
    Object.fromEntries(m.atividades.map(t => [t.codigo, rotulo((p.celulas || {})[t.id])]))))), 'Matriz');
  const aut = await linhasAutorizacoes();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(aut.map(a => ({ Pessoa: a.nome, 'Função': a.funcao || '', 'Código': a.codigo, Atividade: a.atividade, 'Método': a.metodo || '',
    Etapa: (ETAPA[a.etapa] || [a.etapa])[0], 'Situação': (SIT_AUT[a.situacao] || [a.situacao])[0], 'Autorizado em': a.autorizado_em ? fmtData(a.autorizado_em) : '',
    'Autorizado por': a.autorizado_por || '', 'Válido até': a.validade ? fmtData(a.validade) : '', 'Supervisionadas': `${a.supervisionadas}/${a.supervisionadas_min}`,
    'Último monitoramento': a.ultimo_monitoramento ? fmtData(a.ultimo_monitoramento) : '', 'Próximo monitoramento': a.proximo ? fmtData(a.proximo) : '' }))), 'Autorizações');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(m.atividades.map(t => ({ 'Código': t.codigo, Atividade: t.nome, 'Método': t.metodo || '', Tipo: ATIV_TIPO[t.tipo] || t.tipo,
    'Validade (meses)': t.validade_meses, 'Supervisionadas mínimas': t.supervisionadas_min }))), 'Atividades');
  XLSX.writeFile(wb, `matriz-qualificacao-${hoje()}.xlsx`);
}
function imprimirMatriz(){
  const m = MATRIZ; if(!m) return;
  janelaDes('Matriz de qualificação', `<h2>Matriz de qualificação — ISO/IEC 17025, 6.2</h2><p>Gerada em ${fmtDataHora(m.gerada_em)}</p>
    <table><tr><th>Pessoa</th>${m.atividades.map(t => `<th>${esc(t.codigo)}</th>`).join('')}</tr>
    ${m.pessoas.map(p => `<tr><td>${esc(p.nome)}<br><small>${esc(p.funcao || '')}</small></td>${m.atividades.map(t => { const c = (p.celulas || {})[t.id] || {};
      return `<td>${c.etapa ? esc((SIT_AUT[c.situacao] || [c.situacao])[0]) + (c.validade && ['vigente','vencendo','vencida'].includes(c.situacao) ? '<br><small>até ' + fmtData(c.validade) + '</small>' : '') : c.exigida ? 'exigida' : '—'}</td>`; }).join('')}</tr>`).join('')}</table>
    <p style="font-size:11px">${m.atividades.map(t => `${esc(t.codigo)}: ${esc(t.nome)}${t.metodo ? ' (' + esc(t.metodo) + ')' : ''}`).join(' · ')}</p>`);
}

async function salvarAtividade(id){
  const p = { codigo: v('at-c'), nome: v('at-n'), tipo: v('at-t'), metodo: v('at-m'), criterio: v('at-k'), area_id: v('at-a') || null, supervisionadas_min: v('at-s'), validade_meses: v('at-v'),

const QST = { pendente:['pendente','b-aten'], respondido:['respondido','b-ok'], cancelado:['cancelado','b-info'] };

// ---------- pulso ----------

      ${EDITA() ? `<div class="linha-acoes"><div style="flex:0"><button class="btn-sec" onclick="rodarPulso()">Rodar agora</button></div><div style="flex:0"><button class="btn" onclick="formPulso()">+ Pulso</button></div></div>` : ''}</div>

      return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3 style="margin:0">${esc(p.titulo)}</h3>
          <div class="mut">a cada ${p.frequencia_dias} dias, aberto por ${p.duracao_dias} · próxima rodada ${fmtData(p.proxima)} · alerta abaixo de ${fmtNum(p.limiar_favorabilidade, 0)}% ou queda de ${fmtNum(p.limiar_queda_pp, 0)} pontos</div></div>
          <div>${p.ativo ? '<span class="badge b-ok">ativo</span>' : '<span class="badge b-info">parado</span>'} ${EDITA() ? `<button class="btn-sec btn-mini" onclick="alternarPulso(${p.id}, ${!p.ativo})">${p.ativo ? 'Parar' : 'Retomar'}</button>` : ''}</div></div>

          ${s.slice().reverse().map(x => `<tr><td>${fmtData(x.inicio)} a ${fmtData(x.fim)}</td><td>${x.situacao === 'aberta' ? '<span class="badge b-aten">aberta</span>' : x.situacao === 'ok' ? '<span class="badge b-ok">encerrada</span>' : '<span class="badge b-info">abaixo do mínimo</span>'}</td>
            <td>${x.n ?? '—'}</td><td>${x.favorabilidade != null ? fmtNum(x.favorabilidade, 1) + '%' : '—'}</td><td>${x.enps != null ? fmtNum(x.enps, 1) : '—'}</td>
            <td><button class="btn-sec btn-mini" onclick="SUB_CLIMA_T='pesquisas';abrirPesquisa(${x.pesquisa_id})">Abrir</button></td></tr>`).join('')}</table></div>` : '<div class="mut" style="margin-top:6px">Nenhuma rodada ainda.</div>'}</div>`; }).join('')

}

async function alternarPulso(id, ativo){ await db.rpc('fn_rh_pulso_salvar', { p_id: id, p: { ativo } }); vPulso(); }
async function rodarPulso(){

      ${data.map(q => `<tr><td>${esc(q.nome)}<div class="mut">${esc(q.setor || '')}</div></td><td>${esc(QTIPO[q.tipo])}</td><td>${fmtData(q.referencia)}</td>

async function rodarOnboarding(){ const { data, error } = await db.rpc('fn_rh_onboarding_gerar'); if(error) return msg('qs-msg', limparErro(error), 'erro'); await vQuestionarios(); msg('qs-msg', `${data} questionário(s) criado(s).`, 'ok'); }
async function verQuestionario(id){
  const { data: q } = await db.rpc('fn_rh_questionario_abrir', { p_id: id }); if(!q) return;
  modal(`<h3>${esc(QTIPO[q.tipo])} — ${esc(q.nome)}</h3><div class="mut">referência ${fmtData(q.referencia)} · ${bdg(QST, q.status)}${q.respondido_em ? ' · respondido em ' + fmtDataHora(q.respondido_em) + (q.respondido_meio === 'link' ? ' (pelo link)' : '') : ''}</div>

    <div id="vq-link" style="word-break:break-all"></div>

}
async function linkQuestionario(id){ const { data, error } = await db.rpc('fn_rh_questionario_link', { p_id: id }); if(error) return; mostrarLinkDes('vq-link', data); $('vq-link').querySelector('.mut').textContent = 'Identificado: só o RH lê as respostas.'; }
// a própria pessoa responde (Meu RH)
async function responderQuestionario(id){
  const { data: q } = await db.rpc('fn_rh_questionario_abrir', { p_id: id }); if(!q) return;
  if(q.status !== 'pendente') return verQuestionario(id);
  window.__Q = q;
  modal(`<h3>${esc(QTIPO[q.tipo])}</h3><div class="msg msg-info">Este questionário é <b>identificado</b> e só o RH lê — o seu gestor não vê. Responda com sinceridade: é para melhorar a experiência de quem trabalha aqui.</div>
    ${q.perguntas.map(p => `<div style="padding:6px 0;border-top:1px solid var(--borda)"><div style="margin-bottom:4px">${esc(p.texto)}${p.obrigatoria ? '' : ' <span class="mut">(opcional)</span>'}</div>
      ${p.resposta === 'escala' ? `<div class="linha-acoes" style="flex-wrap:wrap">${[1, 2, 3, 4, 5].map(n => `<label style="flex:0;font-weight:600;color:var(--texto);display:flex;gap:4px;align-items:center;border:1px solid var(--borda);border-radius:8px;padding:5px 10px;margin:0"><input type="radio" name="rq-${p.ordem}" value="${n}" style="width:auto"> ${n}</label>`).join('')}</div><div class="mut">1 = discordo totalmente · 5 = concordo totalmente</div>`
        : p.resposta === 'sim_nao' ? `<div class="linha-acoes">${[['sim', 'Sim'], ['nao', 'Não']].map(([k, t]) => `<label style="flex:0;font-weight:600;color:var(--texto);display:flex;gap:4px;align-items:center;border:1px solid var(--borda);border-radius:8px;padding:5px 12px;margin:0"><input type="radio" name="rq-${p.ordem}" value="${k}" style="width:auto"> ${t}</label>`).join('')}</div>`
        : `<textarea id="rq-${p.ordem}" rows="2"></textarea>`}</div>`).join('')}
    <div id="rq-msg"></div><div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Depois</button><button class="btn" onclick="enviarQuestionario(${id})">Enviar</button></div>`, { larga: true });
}
async function enviarQuestionario(id){
  const r = {};
  window.__Q.perguntas.forEach(p => { if(p.resposta === 'texto'){ const t = v('rq-' + p.ordem); if(t) r[p.ordem] = t; }
    else { const x = document.querySelector(`input[name="rq-${p.ordem}"]:checked`); if(x) r[p.ordem] = p.resposta === 'escala' ? Number(x.value) : x.value; } });
  const { data, error } = await db.rpc('fn_rh_questionario_responder', { p_id: id, p_respostas: r });
  if(error) return msg('rq-msg', limparErro(error), 'erro'); if(!data.ok) return msg('rq-msg', data.mensagem, 'erro');
  fecharModal(); if(ABA === 'meu') vMeu();
}

async function concluirDesl(mesmoAssim){

  const { data, error } = await db.rpc('fn_rh_desligamento_concluir', { p_id: DESL.desligamento.id, p_mesmo_assim: !!mesmoAssim });

async function salvarComunicado(){
  const sel = i => [...$(i).selectedOptions].map(o => Number(o.value));
  const p = { titulo: v('cm-t'), texto: v('cm-x'), categoria: v('cm-c'), expira_em: v('cm-e') || null, exige_leitura: $('cm-l').checked, fixado: $('cm-f').checked, publico: { areas: sel('cm-a'), setores: sel('cm-s') } };
  if(!p.titulo || !p.texto) return msg('cmf-msg', 'Título e texto.', 'erro');
  // o anexo vai para o armazenamento privado (rh/mural/…); só abre para o público do comunicado publicado
  const arq = $('cm-arq') && $('cm-arq').files && $('cm-arq').files[0];
  if(arq){
    if(arq.size > 10 * 1024 * 1024) return msg('cmf-msg', 'O anexo passa de 10 MB.', 'erro');
    if(!/^(application\/pdf|image\/)/.test(arq.type || '')) return msg('cmf-msg', 'Anexo em PDF ou imagem.', 'erro');
    const caminho = 'rh/mural/' + Date.now().toString(36) + '-' + (arq.name || 'anexo').normalize('NFD').replace(/[^\w.-]+/g, '_').slice(-60);
    const up = await db.storage.from('rh-arquivos').upload(caminho, arq, { contentType: arq.type });
    if(up.error) return msg('cmf-msg', 'Não foi possível enviar o anexo.', 'erro');
    p.anexo_path = caminho; p.anexo_nome = arq.name;
  }
  const { error } = await db.rpc('fn_rh_comunicado_salvar', { p_id: null, p }); if(error) return msg('cmf-msg', limparErro(error), 'erro');
  fecharModal(); vMuralGerenciar();
}

let F_IND = { preset:'30' }, IND = null, RADAR = null, CUSTO = null;

const IND_TOM = { headcount:'azul', admissoes:'verde', desligamentos:'verm', turnover:'lar', turnover_voluntario:'neutro', turnover_90:'verm', time_to_fill:'royal', time_to_hire:'cobalto',
  aceite_proposta:'verde', pdi_em_dia:'aqua', enps:'royal', favorabilidade:'verde' };
const IND_RUIM = { desligamentos:true, turnover:true, turnover_90:true, turnover_voluntario:true, time_to_fill:true, time_to_hire:true, headcount:null, admissoes:null };
const RISCO_NIVEL = { alto:['risco alto', 'b-erro'], medio:['risco médio', 'b-aten'], baixo:['risco baixo', 'b-ok'] };
const RISCO_FATOR = { sem_mudanca:'Muito tempo sem mudança de função', queda_avaliacao:'Queda na avaliação', pdi_parado:'PDI parado', sem_1a1:'Sem 1:1',
  pulso_queda:'Pulso da empresa em queda', experiencia:'Fim da experiência', gestor_turnover:'Pedidos de demissão na equipe do gestor' };
const RISCO_ACAO = { um_a_um:'1:1', pdi:'Revisar o PDI', conversa:'Conversa de carreira', reconhecimento:'Reconhecimento', outro:'Outra' };
function fmtInd(x){
  if(x.valor === null || x.valor === undefined) return null;
  const casas = ['%', 'dias', 'pontos'].includes(x.unidade) && !Number.isInteger(Number(x.valor)) ? 1 : 0;
  return fmtNum(x.valor, casas) + (x.unidade === '%' ? '%' : x.unidade === 'dias' ? ' dias' : '');
}
async function vIndicadores(){
  const [ini, fim] = periodoDoPreset(F_IND.preset);

    veRadar ? db.rpc('fn_rh_radar') : Promise.resolve({ data: null }), veCusto ? db.rpc('fn_rh_custo_turnover', { p_inicio: ini, p_fim: fim }) : Promise.resolve({ data: null })]);
  if(ri.error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(ri.error))}</div></div>`);
  IND = ri.data; RADAR = rr.data; CUSTO = rc.data;
  if(!IND) return el(`<div class="card"><div class="vazio">Indicadores são da empresa e das equipes.</div></div>`);
  const grupos = [...new Set(IND.indicadores.map(x => x.grupo))];
  const cartao = x => pnCard({ ic: IND_IC[x.codigo] || '📊', lab: x.nome, val: fmtInd(x), tom: IND_TOM[x.codigo] || 'azul', formula: x.formula,
    variacao: x.anterior !== undefined ? _variacao(x.valor, x.anterior, IND_RUIM[x.codigo] === undefined ? null : IND_RUIM[x.codigo], x.unidade === '%' ? 1 : 0, x.unidade === '%' ? ' p.p.' : '') : null,
    ctx: x.base !== undefined && x.base !== null ? `base: ${x.base}${x.pesquisa ? ' · ' + x.pesquisa : ''}` : (x.ciclo || '') });
  let h = `<div class="card pn-cab"><div style="flex:1;min-width:240px"><h2 style="margin:0 0 2px">📈 Indicadores</h2>
      <p class="mut" style="margin:0">${IND.escopo === 'equipe' ? 'Da sua equipe. ' : ''}Período ${fmtData(ini)} a ${fmtData(fim)}. Passe o mouse no ⓘ para ver a fórmula de cada número — a mesma vai no .xlsx.</p></div>
      <div><label for="in-p">Período</label><select id="in-p" onchange="F_IND.preset=this.value;vIndicadores()">
        ${[['30', 'Últimos 30 dias'], ['mes', 'Este mês'], ['tri', 'Este trimestre'], ['12m', 'Últimos 12 meses']].map(([k, t]) => `<option value="${k}" ${F_IND.preset === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div><button class="btn-sec" onclick="exportarIndicadores()">Exportar .xlsx</button></div></div>`;
  for(const g of grupos){
    const itens = IND.indicadores.filter(x => x.grupo === g);
    const cards = itens.filter(x => !x.lista && x.codigo !== 'nove_box');
    h += `<div class="faixa-t">${esc(g)}</div>`;
    if(cards.length) h += `<div class="pn-cards">${cards.map(cartao).join('')}</div>`;
    const org = itens.find(x => x.codigo === 'eficiencia_origem');

function exportarIndicadores(){

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(IND.indicadores.filter(x => !x.lista && x.codigo !== 'nove_box').map(x => ({ Grupo: x.grupo, Indicador: x.nome,
    Valor: x.valor === null || x.valor === undefined ? '' : Number(x.valor), Unidade: x.unidade || '', 'Período anterior': x.anterior === null || x.anterior === undefined ? '' : Number(x.anterior),
    Base: x.base === null || x.base === undefined ? '' : x.base, 'Como calculamos': x.formula }))), 'Indicadores');
  const org = IND.indicadores.find(x => x.codigo === 'eficiencia_origem');
  if(org) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((org.lista || []).map(o => ({ Origem: o.origem, Candidaturas: o.candidaturas, Contratados: o.contratados, 'Taxa (%)': Number(o.taxa) }))), 'Por origem');
  const nb = IND.indicadores.find(x => x.codigo === 'nove_box');
  if(nb && nb.lista) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(nb.lista.map(q => ({ Quadrante: q.quadrante, Nome: q.nome, Pessoas: q.qtd }))), '9-box');
  if(RADAR && RADAR.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(RADAR.map(r => ({ Pessoa: r.nome, 'Função': r.funcao || '', Pontos: r.pontos, 'Nível': (RISCO_NIVEL[r.nivel] || [r.nivel])[0],
    'O que pesou': r.fatores.map(f => `${RISCO_FATOR[f.fator] || f.fator} (+${f.peso}): ${f.detalhe}`).join('; '), 'Ações': r.acoes.map(a => `${RISCO_ACAO[a.tipo] || a.tipo}: ${a.acao}`).join('; ') }))), 'Radar');
  if(CUSTO && CUSTO.itens.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(CUSTO.itens.map(i => ({ Pessoa: i.nome, Cargo: i.cargo || '', 'Último dia': i.ultimo_dia,

  XLSX.writeFile(wb, `RH - indicadores ${IND.inicio} a ${IND.fim}.xlsx`);
}

/* =====================================================================
   IA OPCIONAL (Fase 7C, prompt §8.7) — Edge Function rh-ia. SUGERE, NUNCA
   DECIDE: a caixa aparece marcada como sugestão, e só vale o que uma pessoa
   copiar/editar e salvar pelo caminho normal. Os botões só aparecem com a IA
   ligada (Configurações → ia_ligada) e para quem pode pedir aquilo.
   ===================================================================== */
let IA_ST = {};
async function carregarIA(){ try { const { data } = await db.rpc('fn_rh_ia_status'); IA_ST = data || {}; } catch(e) { IA_ST = {}; } }
function botaoIA(funcao, ref, alvo, rotulo){
  return IA_ST[funcao] ? `<div id="${alvo}" style="margin-top:10px"><button class="btn-sec btn-mini" onclick="pedirIA('${funcao}', '${esc(String(ref))}', '${alvo}')">✨ ${esc(rotulo)}</button>
    <span class="mut">sugestão da IA; dados pessoais não são enviados</span></div>` : '';
}
let IA_ULT = null;
async function pedirIA(funcao, ref, alvo){
  const box = $(alvo); if(!box) return;
  box.innerHTML = '<div class="mut">Pedindo a sugestão… (pode levar alguns segundos)</div>';
  const { data, error } = await db.functions.invoke('rh-ia', { body: { funcao, ref } });
  if(error || !data || data.erro){
    let m = data && data.erro;
    if(!m && error && error.context && typeof error.context.json === 'function'){ try { m = (await error.context.json()).erro; } catch(e) {} }
    box.innerHTML = `<div class="msg msg-erro">${esc(m || 'A IA não respondeu.')}</div>`; return;
  }
  IA_ULT = { funcao, s: data.sugestao };
  const s = data.sugestao, li = a => `<ul style="margin:4px 0 8px;padding-left:18px">${(a || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  let h = '';
  if(funcao === 'curriculo') h = `<p>${esc(s.resumo)}</p><b>Experiências</b><ul style="padding-left:18px">${s.experiencias.map(e => `<li>${esc(e.funcao)} <span class="mut">${esc(e.periodo)}</span> — ${esc(e.destaque)}</li>`).join('')}</ul>
      <b>Formação</b>${li(s.formacao)}<b>Requisitos da vaga</b><ul style="padding-left:18px">${s.requisitos.map(r => `<li>${esc(r.requisito)}: <span class="badge ${r.situacao === 'aparece' ? 'b-ok' : r.situacao === 'parcial' ? 'b-aten' : 'b-info'}">${esc(r.situacao.replace('_', ' '))}</span> <span class="mut">${esc(r.evidencia)}</span></li>`).join('')}</ul>
      <b>Perguntas para a entrevista</b>${li(s.perguntas_para_entrevista)}`;
  if(funcao === 'pdi') h = `<div class="tabela"><table><tr><th>Ação</th><th>Tipo</th><th>Competência</th><th>Prazo</th></tr>${s.acoes.map(a => `<tr><td>${esc(a.titulo)}<div class="mut">${esc(a.porque)}</div></td>
      <td>${esc(({ pratica:'70 — prática', mentoria:'20 — mentoria', curso:'10 — curso' })[a.tipo] || a.tipo)}</td><td>${esc(a.competencia)}</td><td>${a.prazo_dias} dias</td></tr>`).join('')}</table></div>
      ${s.observacoes ? `<div class="mut">${esc(s.observacoes)}</div>` : ''}<div class="mut">Para usar, inclua a ação pelo botão de sempre — combinada com a pessoa.</div>`;
  if(funcao === 'vaga') h = `<b>${esc(s.titulo)}</b><p>${esc(s.descricao)}</p><b>Responsabilidades</b>${li(s.responsabilidades)}<b>Requisitos</b>${li(s.requisitos)}<b>Diferenciais</b>${li(s.diferenciais)}
      ${s.avisos.length ? `<div class="msg msg-aviso">${s.avisos.map(esc).join('<br>')}</div>` : ''}
      ${$('vg-descricao') && !$('vg-descricao').readOnly ? `<button class="btn-sec btn-mini" onclick="usarRascunhoVaga()">Copiar para os campos (ainda não salva)</button>` : ''}`;
  box.innerHTML = `<div class="card" style="border-left:4px solid var(--royal)"><span class="badge b-info">✨ Sugestão da IA — revise, corrija e decida</span>
    <div style="margin-top:8px">${h}</div><div class="mut">${esc(data.aviso || '')}</div></div>`;
}
function usarRascunhoVaga(){
  if(!IA_ULT || IA_ULT.funcao !== 'vaga') return;
  const s = IA_ULT.s, set = (id, v) => { if($(id) && !$(id).value.trim()) $(id).value = v; };
  set('vg-descricao', s.descricao); set('vg-responsabilidades', s.responsabilidades.map(x => '• ' + x).join('\n'));
  set('vg-requisitos', s.requisitos.map(x => '• ' + x).join('\n')); set('vg-diferenciais', s.diferenciais.map(x => '• ' + x).join('\n'));
  msg('vg-msg', 'Rascunho copiado para os campos vazios. Revise e salve — o alerta de termos discriminatórios continua valendo na publicação.', 'aviso');
}

async function vMeu(){

  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  const meus = (fbs || []).filter(f => data.meu && f.colaborador_id === data.meu.id);

  el(htmlMeu(data.meu) + des + (fc ? htmlMinhaFicha(fc) : '') + `<div class="faixa-t">Meus feedbacks</div><div class="card">${meus.length

  risco_peso_gestor_turnover:'Radar: peso — pedidos de demissão na equipe do gestor', risco_min_saidas_gestor:'Radar: pedidos de demissão (12 meses) que contam para o gestor',
  risco_corte_medio:'Radar: pontos a partir dos quais o risco é médio', risco_corte_alto:'Radar: pontos a partir dos quais o risco é alto',
  turnover_custo_recrutamento:'Custo de turnover: custo médio de um processo seletivo (R$)', turnover_meses_ate_pleno:'Custo de turnover: meses até o substituto render o pleno',
  turnover_fator_produtividade:'Custo de turnover: fração do salário perdida por mês até o pleno', anonimato_min_pares_360:'Mínimo de avaliadores para mostrar nota 360' };
const cfgUnidade = c => /_dias(_|$)/.test(c.chave) ? 'dias' : /_mb$/.test(c.chave) ? 'MB' : /_anos$/.test(c.chave) ? 'anos' : /_hora$/.test(c.chave) ? 'por hora'
  : /^aderencia_peso_/.test(c.chave) ? 'pontos' : /^ninebox_/.test(c.chave) ? 'de 5' : /_pct$/.test(c.chave) ? '%' : /^anonimato_min/.test(c.chave) ? 'pessoas' : '';
const cfgValor = c => {
  if(c.tipo === 'lista') return `<div class="cfg-chips">${String(c.valor || '').split(',').map(x => x.trim()).filter(Boolean).map(x => `<span class="badge b-info">${esc(x)}</span>`).join(' ')}</div>`;
  if(String(c.valor || '').length > 90) return `<div class="cfg-longo">${esc(String(c.valor).slice(0, 160))}…</div>`;
  if(c.valor === 'sim' || c.valor === 'não' || c.valor === 'nao') return `<span class="badge ${c.valor === 'sim' ? 'b-ok' : 'b-aten'}">${esc(c.valor)}</span>`;
  return `<span class="cfg-num">${esc(c.valor)}</span> <span class="mut">${esc(cfgUnidade(c))}</span>`;
};
let F_CFG = '';
async function vConfig(){
  const { data, error } = await db.from('rh_config').select('*').order('chave').order('inicio', { ascending:false });
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  const h = hoje(), dia = x => x ? String(x).slice(0, 10) : x;
  const vig = (data || []).filter(c => dia(c.inicio) <= h && (!c.fim || dia(c.fim) >= h));
  window.__CFG = vig; window.__CFG_TODAS = data || [];
  el(`<div class="card pn-cab"><div style="flex:1;min-width:240px"><h2 style="margin:0 0 2px">⚙️ Configurações do RH</h2>
      <p class="mut" style="margin:0">As regras do negócio que o sistema usa. Mudar um valor fecha a vigência atual ontem e abre outra hoje — o histórico fica e a trilha registra quem mudou.</p></div>
      <div style="min-width:240px"><label for="cfg-busca">Buscar</label><input id="cfg-busca" value="${esc(F_CFG)}" placeholder="ex.: prazo, peso, link" oninput="F_CFG=this.value;pintarConfig()"></div></div>
    <div id="cfg-lista"></div>`);
  pintarConfig();
}
function pintarConfig(){
  const b = semAcento(F_CFG), vig = window.__CFG || [], usados = new Set();
  const nome = c => CFG_NOME[c.chave] || c.chave.replace(/_/g, ' ');
  const filtra = c => !b || semAcento(nome(c) + ' ' + c.chave + ' ' + (c.descricao || '')).includes(b);
  const somaPesos = vig.filter(c => /^aderencia_peso_/.test(c.chave)).reduce((s, c) => s + Number(c.valor || 0), 0);
  $('cfg-lista').innerHTML = CFG_GRUPOS.map(([ic, titulo, re]) => {
    const itens = vig.filter(c => !usados.has(c.chave) && re.test(c.chave));
    itens.forEach(c => usados.add(c.chave));
    const vis = itens.filter(filtra);
    if(!vis.length) return '';
    return `<div class="card"><h3 class="pn-h3">${ic} ${esc(titulo)}</h3>
      ${/aderência/.test(titulo) && somaPesos !== 100 ? `<div class="msg msg-aviso">Os pesos da aderência somam ${somaPesos}; o normal é 100 (o sistema redistribui, mas fica mais fácil de ler).</div>` : ''}
      ${vis.map(c => `<div class="cfg-item">
        <div class="cfg-txt"><b>${esc(nome(c))}</b><div class="mut">${esc(c.descricao || '')}</div>
          <div class="cfg-chave"><code>${esc(c.chave)}</code>${c.inicio && c.inicio !== '2000-01-01' ? ` · desde ${fmtData(c.inicio)}` : ''}${(window.__CFG_TODAS || []).filter(x => x.chave === c.chave).length > 1 ? ` · <a href="#" onclick="event.preventDefault();historicoConfig('${esc(c.chave)}')">histórico</a>` : ''}</div></div>
        <div class="cfg-val">${cfgValor(c)}</div>
        <div><button class="btn-sec btn-mini" onclick="editarConfig('${esc(c.chave)}')">Alterar</button></div></div>`).join('')}</div>`;
  }).join('') || '<div class="card"><div class="vazio">Nada com essa busca.</div></div>';
}
function historicoConfig(chave){
  const l = (window.__CFG_TODAS || []).filter(x => x.chave === chave);
  modal(`<h3>${esc(CFG_NOME[chave] || chave)} — histórico</h3><div class="tabela"><table><tr><th>Valor</th><th>De</th><th>Até</th><th>Quem</th></tr>
    ${l.map(x => `<tr><td>${esc(String(x.valor).slice(0, 80))}</td><td>${fmtData(x.inicio === '2000-01-01' ? null : x.inicio) || 'início'}</td><td>${x.fim ? fmtData(x.fim) : 'hoje'}</td><td>${esc(x.criado_por || '')}</td></tr>`).join('')}</table></div>
    <div class="modal-acoes"><button class="btn" onclick="fecharModal()">Fechar</button></div>`, { larga:true });
}
function editarConfig(chave){
  const c = (window.__CFG || []).find(x => x.chave === chave); if(!c) return;
  const longo = String(c.valor || '').length > 90;
  modal(`<h3>${esc(CFG_NOME[c.chave] || c.chave)}</h3><p class="mut">${esc(c.descricao)}</p>
    <label for="cf-valor">Novo valor ${c.tipo === 'lista' ? '(separado por vírgula)' : cfgUnidade(c) ? '(' + cfgUnidade(c) + ')' : ''}</label>
    ${longo ? `<textarea id="cf-valor" style="min-height:260px">${esc(c.valor)}</textarea>` : `<input id="cf-valor" value="${esc(c.valor)}" ${c.tipo === 'inteiro' ? 'inputmode="numeric"' : ''}>`}
    <div class="mut">A mudança vale a partir de hoje; o valor atual fica no histórico.</div>
    <div id="cf-msg"></div>
    <div class="modal-acoes"><button class="btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="cf-ok">Salvar</button></div>`, longo ? { larga:true } : undefined);
  $('cf-ok').onclick = async () => {
    const { error } = await db.rpc('fn_rh_config_definir', { p_chave: chave, p_valor: v('cf-valor') });
    if(error) return msg('cf-msg', erroDe(error), 'erro');
    fecharModal(); vConfig();
  };
}

/* =====================================================================
   AUDITORIA (rh_admin) — a política só devolve tabelas rh_ (Guia §5).
   ===================================================================== */
let F_AUD = { tabela:'' };
async function vAuditoria(){
  // a política já só devolve tabelas rh_ (Guia §5); a lista de tabelas sai do que a trilha tem
  const { data: todas } = await db.from('auditoria').select('tabela').order('tabela').limit(2000);
  const tabs = [...new Set((todas || []).map(x => x.tabela))];
  let q = db.from('auditoria').select('*');
  if(F_AUD.tabela) q = q.eq('tabela', F_AUD.tabela);
  const { data, error } = await q
    .order('quando', { ascending:false }).limit(200);
  if(error) return el(`<div class="card"><div class="msg msg-erro">${esc(erroDe(error))}</div></div>`);
  el(`<div class="card"><div class="linha-acoes"><div style="max-width:280px"><label for="au-tab">Tabela</label><select id="au-tab" onchange="F_AUD.tabela=this.value;vAuditoria()">
      <option value="">Todas</option>${tabs.map(t => `<option ${F_AUD.tabela === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div>
    <p class="mut">Últimas 200 alterações e exclusões. Ninguém apaga esta trilha, nem o administrador.</p>
    ${(data || []).length ? `<div class="tabela"><table><tr><th>Quando</th><th>Quem</th><th>Tabela</th><th>Operação</th><th>Campos</th><th></th></tr>
      ${data.map((a, i) => `<tr><td>${fmtDataHora(a.quando)}</td><td>${esc(a.quem)}</td><td>${esc(a.tabela)}</td><td>${esc(a.operacao)}</td>
        <td>${esc((a.campos || []).join(', '))}</td><td><button class="btn-sec btn-mini" onclick="verAud(${i})">Ver</button></td></tr>`).join('')}</table></div>`
      : '<div class="vazio">Nenhuma alteração registrada ainda.</div>'}</div>`);
  window.__AUD = data || [];
}
function verAud(i){
  const a = window.__AUD[i]; if(!a) return;
  modal(`<h3>${esc(a.tabela)} · ${esc(a.operacao)}</h3><div class="mut">${fmtDataHora(a.quando)} · ${esc(a.quem)}</div>
    <div class="g2"><div><h3>Antes</h3><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(a.antes, null, 1))}</pre></div>
    <div><h3>Depois</h3><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(a.depois, null, 1))}</pre></div></div>
    <div class="modal-acoes"><button class="btn" onclick="fecharModal()">Fechar</button></div>`, { larga:true });
}

// ===================== BOOT =====================
(async function boot(){
  $('li-versao').textContent = VERSAO;
  const { data } = await db.auth.getSession();
  if(data.session && (LINK_TIPO === 'invite' || LINK_TIPO === 'recovery')) return telaDefinirSenha(LINK_TIPO);
  $('login').classList.remove('hide');
  if(!data.session && LINK_TIPO) return msg('li-msg', 'Esse link expirou ou já foi usado. Peça um novo ao responsável pelo RH.', 'erro');
  if(data.session) iniciar();
  // só login e logout de verdade redesenham a tela (o SIGNED_IN repete a cada
  // renovação de token e ao voltar o foco — lição do DP)
  db.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT') location.href = location.pathname; });
})();
