<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ambimet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Página PÚBLICA do módulo rh (prompt §4: arquivo separado do rh/index.html
   para quem não tem login não baixar o código interno e para ser leve no
   celular). Paleta do Guia rev. 10, §1.2 — mesmos tokens do sistema. */
:root{
  --azul:      #0b0047;
  --azul-esc:  #060030;
  --royal:     #2264dc;
  --cobalto:   #5a8cff;
  --aqua:      #01b4d4;
  --verde:     #1a9c66;
  --verm:      #d9403a;
  --lar:       #e8912d;
  --texto:     #25303c;
  --cinza:     #f4f6f9;
  --borda:     #dde3ea;
  --cinza-txt: #6b7684;
  --branco:      #ffffff;
  --verde-fundo: #e2f5ec; --verde-txt: #0f6b45;
  --lar-fundo:   #fdf1de; --lar-txt:   #8a5a00;
  --verm-fundo:  #fbe9e7; --verm-txt:  #a5352a;
  --azul-fundo:  #e9edfb; --azul-txt:  #1a54c0;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--texto);background:var(--cinza);font-size:15px}
.hide{display:none!important}
.top{background:linear-gradient(90deg,var(--azul),var(--azul-esc));color:var(--branco);padding:14px 16px;text-align:center}
.top{display:flex;align-items:center;justify-content:center;gap:12px}
.top .marca img{height:28px;width:auto;display:block}
.top .risco{width:1px;height:22px;background:var(--cobalto);opacity:.5}
.top b{font-size:17px}.top b span{color:var(--aqua)}
main{max-width:720px;margin:16px auto;padding:0 14px}
.card{background:var(--branco);border:1px solid var(--borda);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h2,h3{color:var(--azul);margin:.2em 0}h2{font-size:19px}h3{font-size:15px}
.mut{color:var(--cinza-txt);font-size:13px}
label{font-size:13px;font-weight:600;color:var(--cinza-txt);display:block;margin:12px 0 4px}
input,textarea{font-family:inherit;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;width:100%;font-size:16px;background:var(--branco);color:var(--texto)}
textarea{min-height:80px;resize:vertical}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px 16px;font-weight:600;font-size:15px}
.btn{background:var(--royal);color:var(--branco);width:100%}
.btn-sec{background:var(--branco);color:var(--royal);border:1px solid var(--borda)}
.msg{padding:11px 14px;border-radius:8px;margin:10px 0}
.msg-ok{background:var(--verde-fundo);color:var(--verde-txt)}
.msg-erro{background:var(--verm-fundo);color:var(--verm-txt)}
.msg-aviso{background:var(--lar-fundo);color:var(--lar-txt)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.b-erro{background:var(--verm-fundo);color:var(--verm-txt)}
.pf-falta{border:2px solid var(--verm);background:var(--verm-fundo)}
.b-info{background:var(--azul-fundo);color:var(--azul-txt)}
.b-ok{background:var(--verde-fundo);color:var(--verde-txt)}
.b-aten{background:var(--lar-fundo);color:var(--lar-txt)}
.msg-info{background:var(--azul-fundo);color:var(--azul-txt)}
/* admissão: passos, documentos em cartão, revisão */
.barra{height:8px;background:var(--cinza);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.barra span{display:block;height:8px;background:var(--verde);border-radius:6px}
.passos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:560px){.passos{grid-template-columns:1fr 1fr}}
.passo{background:var(--branco);border:1px solid var(--borda);color:var(--texto);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;text-align:left;font-weight:600;font-size:13.5px}
.passo small{display:block;font-weight:400;color:var(--cinza-txt);font-size:11.5px}
.passo .num{width:24px;height:24px;border-radius:50%;background:var(--cinza);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.passo.feito .num{background:var(--verde-fundo);color:var(--verde-txt)}
.passo.on{border-color:var(--royal);box-shadow:0 0 0 2px var(--azul-fundo)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 10px}
.fld label{margin-top:10px}
.campo-sel{width:100%;padding:11px;border:1px solid var(--borda);border-radius:8px;font-size:16px;background:var(--branco);color:var(--texto)}
h4{color:var(--azul);margin:18px 0 0;font-size:14px}
.opcoes{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}.opcoes label{font-weight:400;color:var(--texto);margin:0}.opcoes input{width:auto}
.doc{border:1px solid var(--borda);border-left:4px solid var(--borda);border-radius:10px;padding:10px 12px;margin:8px 0}
.doc.st-pendente{border-left-color:var(--lar)}.doc.st-enviado{border-left-color:var(--royal)}.doc.st-aprovado{border-left-color:var(--verde)}
.doc.st-recusado{border-left-color:var(--verm)}.doc.st-dispensado{border-left-color:var(--cinza-txt);opacity:.8}
.doc-cab{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.btn-arq{display:inline-block;margin:8px 0 0;padding:10px 14px;border-radius:8px;background:var(--azul-fundo);color:var(--azul-txt);font-weight:600;cursor:pointer;font-size:14px}
.arq-oculto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.contrato-txt{white-space:pre-wrap;background:var(--cinza);border-radius:8px;padding:12px;font-size:14px;max-height:360px;overflow:auto}
.aceite{font-weight:600;color:var(--texto)}.aceite input{width:auto}
.revisao{list-style:none;padding:0;margin:0}.revisao li{padding:9px 12px;border-radius:8px;margin:6px 0}
.revisao li.ok{background:var(--verde-fundo);color:var(--verde-txt)}.revisao li.falta{background:var(--lar-fundo);color:var(--lar-txt)}
.campo{margin:8px 0}.campo .v{white-space:pre-wrap}
.secao{border-top:1px solid var(--borda);margin-top:12px;padding-top:6px;font-weight:700;color:var(--azul);font-size:14px}
#pad{width:100%;height:170px;border:1px dashed var(--cinza-txt);border-radius:8px;touch-action:none;background:var(--branco)}
.rodape{text-align:center;color:var(--cinza-txt);font-size:11.5px;margin:16px 0}
#veu{position:fixed;inset:0;background:rgba(244,246,249,.82);display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:14px}
#veu.on{display:flex}
#veu img{width:150px;height:auto}
#veu .barra{width:150px;height:4px;background:var(--borda);border-radius:2px;overflow:hidden}
#veu .barra i{display:block;width:40%;height:100%;background:var(--aqua);animation:veu 1s infinite linear}
@keyframes veu{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
/* avaliação de desempenho pelo link (Fase 4A) */
.escala{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.escala label{display:flex;align-items:center;gap:4px;border:1px solid var(--borda);border-radius:8px;padding:8px 12px;margin:0;font-weight:600;color:var(--texto);cursor:pointer;background:var(--branco)}
.escala input{width:auto;margin:0}
.ancoras{font-size:12.5px;color:var(--cinza-txt);margin:4px 0 0 0;padding-left:18px}
.nota-grande{font-size:30px;font-weight:700;color:var(--azul)}
</style></head><body>

<script>
// ===================== VERSÃO (Guia §6) =====================
const VERSAO = 'v13 · 29/09/2026';

/* AVISO DE CARREGANDO (Guia §5.1, Modelo E) — no topo, antes de qualquer if. */
(function(){
  var n = 0, tMostrar = null, tEsconder = null, desde = 0;
  var PERMANENCIA = 300;
  function veu(){ return document.getElementById('veu'); }
  function mostrar(){ var v = veu(); if(!v) return; if(!v.classList.contains('on')){ v.classList.add('on'); desde = Date.now(); } }
  function esconder(){
    var v = veu(); if(!v) return;
    var falta = PERMANENCIA - (Date.now() - desde);
    if(v.classList.contains('on') && falta > 0){ tEsconder = setTimeout(esconder, falta); return; }
    v.classList.remove('on');
  }
  function comecou(){ clearTimeout(tEsconder); tEsconder = null; if(++n === 1){ clearTimeout(tMostrar); tMostrar = setTimeout(mostrar, 250); } }
  function acabou(){ if(--n <= 0){ n = 0; clearTimeout(tMostrar); clearTimeout(tEsconder); tEsconder = setTimeout(esconder, 350); } }
  var orig = window.fetch;
  if(typeof orig !== 'function') return;
  window.fetch = function(){
    var url = '';
    try { var a = arguments[0]; url = String((a && a.url) || a || ''); } catch(e){}
    if(url.indexOf('supabase.co') < 0) return orig.apply(this, arguments);
    comecou();
    return orig.apply(this, arguments).then(function(r){ acabou(); return r; }, function(e){ acabou(); throw e; });
  };
})();

// Mesmo projeto do rh/index.html — CONFIRMAR NA PUBLICAÇÃO. Chave publishable.
// Esta página só alcança as duas funções abertas a quem não tem login
// (fn_rh_fb_por_token e fn_rh_fb_assinar_por_token), que validam o token por dentro.
const SUPABASE_URL  = 'https://yvvrxmhbaehuuxxsvxgi.supabase.co';
const SUPABASE_ANON = 'sb_publishable_WUcykcuZAcyjdaKtVjkb6Q_jID9Zi89';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession: false } });

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// data pura ("2026-09-25") é o dia; data COM hora (timestamptz) vem em UTC e é
// mostrada no dia de Brasília — cortar a string dava o dia seguinte depois das 21h
const fmtData = d => { if(!d) return '—'; const s = String(d);
  return s.length > 10 ? new Date(s).toLocaleDateString('pt-BR', { timeZone:'America/Sao_Paulo' }) : new Date(s + 'T12:00:00').toLocaleDateString('pt-BR'); };
const tela = h => { $('conteudo').innerHTML = h; };
const msg = (id, t, tipo) => { const b = $(id); if(b) b.innerHTML = `<div class="msg msg-${tipo || 'ok'}">${esc(t)}</div>`; };
const QS = new URLSearchParams(location.search);
const TOKEN = (QS.get('assinar') || '').trim();

const SITUACAO = {
  invalido: 'Este link não é válido. Confira se copiou o endereço inteiro.',
  ja_assinado: 'Esta assinatura já foi registrada. Obrigado.',
  cancelado: 'Este feedback foi cancelado. Procure o RH.',
  link_cancelado: 'Este link foi substituído por outro. Use o link mais recente que você recebeu.',
  bloqueado: 'Este link foi bloqueado por tentativas erradas. Peça um novo ao RH.',
  expirado: 'Este link venceu. Peça um novo ao RH.',
  indisponivel: 'Este feedback não está aguardando assinatura.'
};

// ===================== ASSINAR O FEEDBACK (?assinar=TOKEN) =====================
let PAD = null, DADOS = null;
async function telaAssinar(){
  const { data, error } = await db.rpc('fn_rh_fb_por_token', { p_token: TOKEN });
  if(error) return tela(`<div class="card"><div class="msg msg-erro">Não foi possível abrir agora. Tente de novo em alguns minutos.</div></div>`);
  DADOS = data;
  if(data.situacao !== 'pendente') return tela(`<div class="card"><h2>Registro de feedback</h2><div class="msg msg-${data.situacao === 'ja_assinado' ? 'ok' : 'aviso'}">${esc(SITUACAO[data.situacao] || 'Link indisponível.')}</div></div>`);
  const c = data.conteudo, col = data.papel === 'colaborador';
  const blocos = [];
  c.respostas.forEach(r => { const u = blocos[blocos.length - 1];
    if(r.secao && u && u.secao === r.secao) u.itens.push(r); else blocos.push({ secao: r.secao, itens: [r] }); });
  tela(`<div class="card"><h2>${esc(String(c.modelo.cabecalho || '').split('\n').join(' · '))}</h2>
      <div class="mut">${esc(c.modelo.codigo)} rev. ${esc(c.modelo.revisao_doc || '')} · conversa em ${fmtData(c.data_conversa)} · conduzida por ${esc(c.condutor)}</div>
      <div class="msg msg-info">${col ? 'Leia o registro da sua conversa de feedback. Assinar confirma que você <b>tomou ciência</b> — não que concorda com tudo: você pode escrever seu comentário, que fica junto.'
        : 'Você foi indicado(a) como <b>responsável pelo feedback</b>. Leia o registro e assine.'}</div></div>
    <div class="card">${blocos.map(b => `${b.secao ? `<div class="secao">${esc(b.secao)}</div>` : ''}${b.itens.map(r =>
        `<div class="campo"><div class="mut">${esc(r.rotulo)}</div><div class="v">${esc(r.valor || '—')}</div></div>`).join('')}`).join('')}
      ${c.combinados.length ? `<div class="secao">Combinados</div>${c.combinados.map(x => `<div class="campo">• ${esc(x.acao)} <span class="mut">(${x.responsavel === 'condutor' ? 'supervisor' : 'você'}${x.prazo ? ', até ' + fmtData(x.prazo) : ''})</span></div>`).join('')}` : ''}
      ${c.proximo_retorno ? `<div class="campo"><b>Próximo retorno combinado:</b> ${fmtData(c.proximo_retorno)}</div>` : ''}
      <p class="mut" style="word-break:break-all">Código deste conteúdo (SHA-256): ${esc(data.conteudo_hash)}</p></div>
    <div class="card"><h3>Assinar</h3>
      <label for="as-nome">Seu nome completo</label><input id="as-nome" autocomplete="name" value="">
      ${col ? `<label for="as-doc">CPF ou matrícula</label><input id="as-doc" inputmode="numeric" autocomplete="off">
        <div class="mut">Só para conferir que é você. O número não fica guardado neste registro.</div>`
        : `<div class="mut">Digite o nome exatamente como a Ambimet cadastrou: ${esc(data.nome_esperado)}.</div>`}

}
function montarPad(canvas){
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(300, r.width || 300); canvas.height = r.height || 170;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx) return { limpar(){}, desenhou: () => false, dataURL: () => '' };
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--azul').trim() || 'navy';
  let desenhando = false, lx = 0, ly = 0, desenhou = false;
  const pos = e => { const t = e.touches ? e.touches[0] : e; const b = canvas.getBoundingClientRect();
    return [(t.clientX - b.left) * (canvas.width / b.width), (t.clientY - b.top) * (canvas.height / b.height)]; };
  const ini = e => { desenhando = true; [lx, ly] = pos(e); e.preventDefault(); };
  const mov = e => { if(!desenhando) return; const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke(); [lx, ly] = [x, y]; desenhou = true; e.preventDefault(); };
  const fim = () => { desenhando = false; };
  canvas.addEventListener('mousedown', ini); canvas.addEventListener('mousemove', mov); window.addEventListener('mouseup', fim);
  canvas.addEventListener('touchstart', ini, { passive:false }); canvas.addEventListener('touchmove', mov, { passive:false }); canvas.addEventListener('touchend', fim);
  return { limpar(){ ctx.clearRect(0, 0, canvas.width, canvas.height); desenhou = false; }, desenhou: () => desenhou, dataURL: () => canvas.toDataURL('image/png') };
}

    hiringOrganization: { '@type':'Organization', name:'Ambimet Engenharia', sameAs:'https://ambimet.com.br', logo: new URL('logo-branco.png', location.href).href },
    jobLocation: { '@type':'Place', address: { '@type':'PostalAddress', addressLocality: d.cidade, addressRegion: d.uf, addressCountry:'BR' } },

async function copiarLink(){

  catch(e){ i.focus(); i.select(); try { document.execCommand('copy'); b.textContent = 'Copiado ✓'; } catch(e2){ b.textContent = 'Selecionado: Ctrl+C'; } }
  setTimeout(() => { if($('c-copiar')) $('c-copiar').textContent = 'Copiar'; }, 2500);

// currículo: a Edge Function confere o token e devolve a URL de envio; o arquivo
// vai direto para o bucket privado; o banco confere que chegou no lugar certo
async function enviarCurriculo(token, arq){
  try{
    const { data: e, error: e1 } = await db.functions.invoke('rh-candidatura', { body: { token, nome: arq.name, tamanho: arq.size, tipo: arq.type || 'application/pdf' } });
    if(e1 || !e || !e.caminho) return { ok: false, mensagem: 'Não conseguimos receber o currículo agora.' };
    const { error: e2 } = await db.storage.from('rh-arquivos').uploadToSignedUrl(e.caminho, e.token_envio, arq, { contentType: 'application/pdf' });
    if(e2) return { ok: false, mensagem: 'O envio do currículo falhou.' };
    const { data: r } = await db.rpc('fn_rh_curriculo_registrar', { p_token: token, p_path: e.caminho, p_nome: arq.name });
    return r || { ok: false, mensagem: 'O envio do currículo falhou.' };
  }catch(x){ return { ok: false, mensagem: 'O envio do currículo falhou.' }; }
}

  PV = data; clearInterval(RELOGIO);
  if(PV_MSG[data.situacao]) return tela(`<div class="card"><h2>Prova</h2><div class="msg msg-${data.situacao === 'finalizada' ? 'ok' : 'aviso'}">${esc(PV_MSG[data.situacao])}</div></div>`);
  if(data.situacao === 'convidada') return tela(`<div class="card"><h2>${esc(data.titulo)}</h2>
      <div class="msg msg-info">${data.n_questoes} questões · <b>${data.tempo_minutos} minutos</b> a partir do momento em que você clicar em Começar.
        O tempo corre mesmo que você feche a página; ao acabar, a prova é entregue com o que estiver respondido.</div>
      ${data.instrucoes ? `<p>${par(data.instrucoes)}</p>` : ''}
      <p class="mut">Faça sozinho(a), num lugar tranquilo e com a internet estável.</p>
      <button class="btn" onclick="comecarProva()">Começar</button></div>`);
  DESVIO = new Date(data.agora).getTime() - Date.now();   // relógio do servidor − relógio do aparelho
  tela(`<div class="card" style="position:sticky;top:0;z-index:5"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <b>${esc(data.titulo)}</b><span id="pv-tempo" class="badge" aria-live="polite"></span></div></div>
    ${data.questoes.map((q, i) => `<div class="card"><div class="mut">Questão ${i + 1} de ${data.questoes.length}</div><p style="white-space:pre-wrap">${esc(q.enunciado)}</p>
      ${q.tipo === 'multipla' ? (q.alternativas || []).map(a => `<label style="font-weight:400;color:var(--texto);display:block;margin:6px 0">
          <input type="radio" name="q${q.id}" value="${esc(a.letra)}" style="width:auto" ${q.resposta === a.letra ? 'checked' : ''} onchange="responder(${q.id}, this.value)"> ${esc(a.letra)}) ${esc(a.texto)}</label>`).join('')
        : `<textarea id="q${q.id}" onchange="responder(${q.id}, this.value)">${esc(q.resposta || '')}</textarea>`}
      <div id="st${q.id}" class="mut"></div></div>`).join('')}
    <div class="card"><div id="pv-msg"></div><button class="btn" onclick="entregarProva()">Entregar a prova</button></div>`);
  const tick = () => { const falta = new Date(PV.prazo_fim).getTime() - (Date.now() + DESVIO);
    if(falta <= 0){ clearInterval(RELOGIO); return entregarProva(true); }
    const m = Math.floor(falta / 60000), s2 = Math.floor(falta % 60000 / 1000);
    const b = $('pv-tempo'); if(b){ b.textContent = `falta ${m}:${String(s2).padStart(2, '0')}`; b.className = 'badge ' + (falta < 120000 ? 'b-erro' : 'b-info'); } };
  tick(); RELOGIO = setInterval(tick, 1000);
}
async function comecarProva(){
  const { data, error } = await db.rpc('fn_rh_prova_iniciar', { p_token: PROVA });
  if(error) return tela(`<div class="card"><div class="msg msg-erro">Não foi possível começar agora. Tente de novo.</div></div>`);
  telaProva(data);
}
async function responder(q, valor){
  const st = $('st' + q); if(st) st.textContent = 'salvando…';
  const { data, error } = await db.rpc('fn_rh_prova_responder', { p_token: PROVA, p_questao: q, p_resposta: valor });
  if(data && data.encerrada) return telaProva();
  if(st) st.textContent = error || !data.ok ? ((data && data.mensagem) || 'não foi possível salvar — tente de novo') : 'resposta salva';
}
async function entregarProva(porTempo){
  if(!porTempo && !window.__confirmaPv){ window.__confirmaPv = true; return msg('pv-msg', 'Depois de entregar não dá para mudar. Clique de novo para confirmar.', 'aviso'); }
  // antes de entregar, grava o que estiver digitado e ainda não saiu do campo
  for(const q of (PV.questoes || []).filter(x => x.tipo === 'dissertativa')){ const t = $('q' + q.id); if(t && t.value !== (q.resposta || '')) await responder(q.id, t.value); }
  await db.rpc('fn_rh_prova_entregar', { p_token: PROVA });
  telaProva();
}

// ============ INVENTÁRIO DE AUTOPERCEPÇÃO (?perfil=TOKEN) — Fase 2C ============
// IPIP-50 (domínio público). NÃO é teste psicológico nem elimina ninguém: é
// como a pessoa se descreve, e serve de conversa na entrevista (prompt §8.3).
const PERFIL = (QS.get('perfil') || '').trim();
const ESCALA = ['Discordo totalmente', 'Discordo', 'Nem concordo nem discordo', 'Concordo', 'Concordo totalmente'];
async function telaPerfil(){
  const { data, error } = await db.rpc('fn_rh_perfil_por_token', { p_token: PERFIL });
  if(error) return tela(`<div class="card"><div class="msg msg-erro">Não foi possível abrir agora.</div></div>`);
  if(data.situacao === 'respondida') return tela(`<div class="card"><div class="msg msg-ok">Respostas registradas. Obrigado!</div></div>`);
  if(data.situacao !== 'pendente') return tela(`<div class="card"><div class="msg msg-aviso">Este link não é válido ou venceu. Peça um novo ao RH.</div></div>`);
  tela(`<div class="card"><h2>Inventário de autopercepção</h2>
      <p>São 50 frases curtas. Para cada uma, diga o quanto ela descreve <b>como você é hoje</b> — não como gostaria de ser. Não há resposta certa ou errada, e não há tempo.</p>
      <p class="mut">Não é um teste psicológico e não elimina ninguém: é uma forma de você se apresentar, e o RH usa como assunto na entrevista.
        Baseado no International Personality Item Pool (IPIP, domínio público), em tradução livre.</p></div>
    ${data.itens.map((it, i) => `<div class="card" id="pf-${it.id}" style="padding:12px 16px"><div><b>${i + 1}.</b> ${esc(it.texto)}</div>
      <div role="radiogroup" aria-label="${esc(it.texto)}" style="display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px">${ESCALA.map((t, n) => `<label style="font-weight:400;color:var(--texto);margin:0">
        <input type="radio" name="p${it.id}" value="${n + 1}" style="width:auto"> ${esc(t)}</label>`).join('')}</div></div>`).join('')}
    <div class="card"><div id="pf-msg"></div><button class="btn" onclick="enviarPerfil()">Enviar respostas</button></div>`);
  window.__PF = data.itens;
  // respondeu a frase marcada: tira o vermelho na hora
  $('conteudo').addEventListener('change', ev => { const c = ev.target.closest && ev.target.closest('.pf-falta'); if(c) c.classList.remove('pf-falta'); });
}
async function enviarPerfil(){
  const r = {}; let faltam = 0;
  const falta = [];
  window.__PF.forEach((it, i) => { const m = document.querySelector(`input[name="p${it.id}"]:checked`); const card = document.getElementById('pf-' + it.id);
    if(m){ r[it.id] = Number(m.value); if(card) card.classList.remove('pf-falta'); } else { falta.push(i + 1); if(card) card.classList.add('pf-falta'); } });
  faltam = falta.length;
  if(faltam){
    msg('pf-msg', `Falta${faltam > 1 ? 'm' : ''} responder: frase${faltam > 1 ? 's' : ''} ${falta.join(', ')}. ${faltam > 1 ? 'Elas estão marcadas' : 'Ela está marcada'} em vermelho.`, 'erro');
    const primeira = document.getElementById('pf-' + window.__PF[falta[0] - 1].id); if(primeira && primeira.scrollIntoView) primeira.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  const { data, error } = await db.rpc('fn_rh_perfil_responder', { p_token: PERFIL, p_respostas: r });
  if(error || !data.ok) return msg('pf-msg', (data && data.mensagem) || 'Não foi possível enviar agora.', 'erro');
  tela(`<div class="card"><h2>Pronto</h2><div class="msg msg-ok">${esc(data.mensagem)}</div></div>`);
}

// ===================== PROPOSTA (?proposta=TOKEN) — Fase 2D =====================

// (com o código SHA-256), o nome confere com o cadastro, o CPF só é checado e

const PR_MSG = { invalido:'Este link não é válido. Confira se copiou o endereço inteiro.', aceita:'Proposta aceita. O RH vai entrar em contato para a admissão.',

const moeda = n => Number(n).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
async function telaProposta(){

  const c = data.conteudo;

async function responderProposta(acao){
  if(acao === 'aceitar' && !$('pr-ok').checked) return msg('pr-msg', 'Marque que leu e aceita as condições.', 'erro');
  const traco = acao === 'aceitar' && PAD && PAD.desenhou() ? PAD.dataURL() : null;
  const { data, error } = await db.rpc('fn_rh_proposta_responder', { p_token: PROPOSTA, p_acao: acao, p_nome: ($('pr-nome').value || '').trim(),
    p_cpf: acao === 'aceitar' ? $('pr-cpf').value : null, p_traco: traco, p_motivo: acao === 'recusar' ? ($('pr-mot').value || '').trim() : null,
    p_contraproposta: acao === 'recusar' ? ($('pr-contra').value || '').trim() || null : null });
  if(error) return msg('pr-msg', 'Não foi possível registrar agora. Tente de novo.', 'erro');
  if(data.ok) return tela(`<div class="card"><h2>Pronto</h2><div class="msg msg-ok">${esc(data.mensagem)}</div><p class="mut">Você pode fechar esta página.</p></div>`);
  if(data.situacao !== 'pendente') return tela(`<div class="card"><div class="msg msg-aviso">${esc(data.mensagem)}</div></div>`);
  msg('pr-msg', data.mensagem + (data.tentativas_restantes != null ? ` Tentativas restantes: ${data.tentativas_restantes}.` : ''), 'erro');
}

  tecnico:'Técnico', superior_incompleto:'Superior incompleto', superior:'Superior completo', pos:'Pós-graduação' };
const ESTADO_CIVIL = { solteiro:'Solteiro(a)', casado:'Casado(a)', uniao_estavel:'União estável', divorciado:'Divorciado(a)', viuvo:'Viúvo(a)' };
const DOC_ST = { pendente:['a enviar','b-aten'], enviado:['enviado — o RH vai conferir','b-info'], aprovado:['aprovado','b-ok'], recusado:['recusado — envie de novo','b-erro'], dispensado:['não precisa','b-info'] };
const sel = (id, mapa, atual, vazio) => `<select id="${id}" class="campo-sel">

function admSituacao(data){
  const obrig = data.docs.filter(x => x.obrigatorio), okDocs = obrig.filter(x => ['enviado','aprovado','dispensado'].includes(x.status)).length;
  const c = data.contrato;
  return { dados: !!data.dados, obrig, okDocs, docsOk: okDocs === obrig.length, recusados: data.docs.filter(x => x.status === 'recusado').length,
           contrato: c ? !!c.assinado_em : null, contratoExiste: !!c };
}
async function telaAdmissao(passo){

      <div class="barra" aria-label="Progresso"><span style="width:${Math.round(feitos * 100 / 4)}%"></span></div>

        ${passoBtn(3, 'Contrato', st.contrato === true, st.contratoExiste ? '' : 'o RH libera')}${passoBtn(4, 'Enviar', !!data.enviou_em)}</div>

      <p class="mut" style="margin:8px 0 0">A Ambimet não pede senha nem pagamento em nenhuma etapa.</p></div>

        ${campo('ad-cpf', 'CPF', '', `inputmode="numeric" autocomplete="off" placeholder="${data.cpf_final ? 'já informado (final ' + esc(data.cpf_final) + ') — deixe em branco para manter' : '000.000.000-00'}"`)}
        ${campo('ad-nasc', 'Data de nascimento', d.data_nascimento, 'type="date"')}

        <div class="fld"><label for="ad-esc">Escolaridade</label>${sel('ad-esc', ESCOLARIDADE, d.escolaridade, true)}</div>

      <h4>Vale-transporte</h4>

        <label>Assine no quadro, com o dedo ou o mouse</label><canvas id="pad" aria-label="Quadro de assinatura"></canvas>

        <li class="${st.docsOk && !st.recusados ? 'ok' : 'falta'}">${st.docsOk && !st.recusados ? '✓' : '⚠'} Documentos obrigatórios: ${st.okDocs} de ${st.obrig.length}${st.recusados ? `, ${st.recusados} recusado(s) para refazer` : ''}
          ${st.docsOk && !st.recusados ? '' : ` — <a href="#" onclick="event.preventDefault();irPassoAdm(2)">enviar</a>`}</li>
        <li class="${st.contrato === false ? 'falta' : 'ok'}">${st.contrato === false ? `⚠ Contrato para assinar — <a href="#" onclick="event.preventDefault();irPassoAdm(3)">assinar</a>`
          : st.contrato ? '✓ Contrato assinado' : 'ℹ O contrato vem depois, quando o RH liberar'}</li></ul>
      <div id="env-msg"></div>
      <button class="btn" style="margin-top:8px" onclick="enviarTudoAdm(false)">Enviar tudo e fechar</button></div>`);

function irPassoAdm(n){
  ADM_PASSO = n;
  document.querySelectorAll('.passo-sec').forEach((s, i) => s.classList.toggle('hide', i + 1 !== n));
  document.querySelectorAll('.passos .passo').forEach((b, i) => b.classList.toggle('on', i + 1 === n));
  if(n === 3 && $('pad') && !PAD) PAD = montarPad($('pad'));
  const topo = $('conteudo'); if(topo && topo.scrollIntoView) topo.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function addDependente(x){
  x = x || {};
  const box = $('ad-deps'), n = box.children.length;
  box.insertAdjacentHTML('beforeend', `<div class="dep grade">
    <div class="fld"><label for="dp-n-${n}">Nome</label><input id="dp-n-${n}" class="dp-n" value="${esc(x.nome || '')}"></div>
    <div class="fld"><label for="dp-p-${n}">Parentesco</label><input id="dp-p-${n}" class="dp-p" value="${esc(x.parentesco || '')}" placeholder="filho(a), cônjuge…"></div>
    <div class="fld"><label for="dp-d-${n}">Nascimento</label><input id="dp-d-${n}" class="dp-d" type="date" value="${esc(x.data_nascimento || '')}"></div>
    <div class="fld" style="align-self:end"><button class="btn-sec" onclick="this.closest('.dep').remove()" aria-label="Tirar dependente">✕ Tirar</button></div></div>`);

// CEP: preenche rua, bairro, cidade e UF pelo ViaCEP (serviço público). Se falhar, a pessoa digita.
async function buscarCep(){
  const cep = ($('ad-cep').value || '').replace(/\D/g, '');
  if(cep.length !== 8) return;
  try {
    const r = await (await fetch('https://viacep.com.br/ws/' + cep + '/json/')).json();
    if(r.erro) return;
    [['ad-rua', r.logradouro], ['ad-bairro', r.bairro], ['ad-cidade', r.localidade], ['ad-uf', r.uf]].forEach(([id, v]) => { if(v && !$(id).value) $(id).value = v; });
  } catch(e){}
}
async function salvarDadosAdmissao(){
  const val = id => ($(id) ? $(id).value : '').trim();
  const vt = document.querySelector('input[name=ad-vt]:checked');
  const p = { nome_completo: val('ad-nome'), nome_social: val('ad-social'), cpf: val('ad-cpf'), data_nascimento: val('ad-nasc'), telefone: val('ad-tel'),
    rg: val('ad-rg'), pis: val('ad-pis'), escolaridade: val('ad-esc'), estado_civil: val('ad-civil'),
    endereco: { cep: val('ad-cep'), logradouro: val('ad-rua'), numero: val('ad-num'), complemento: val('ad-comp'), bairro: val('ad-bairro'), cidade: val('ad-cidade'), uf: val('ad-uf') },
    banco: { banco: val('ad-banco'), agencia: val('ad-ag'), conta: val('ad-conta'), tipo: val('ad-tipo'), pix: val('ad-pix') },
    vale_transporte: vt ? vt.value === 'true' : null, vt_trajeto: val('ad-vtt'),
    emergencia: { nome: val('ad-em-nome'), telefone: val('ad-em-tel'), parentesco: val('ad-em-par') },
    dependentes: [...document.querySelectorAll('#ad-deps .dep')].map(dv => ({ nome: dv.querySelector('.dp-n').value.trim(), parentesco: dv.querySelector('.dp-p').value.trim(),
      data_nascimento: dv.querySelector('.dp-d').value || null })) };
  const { data, error } = await db.rpc('fn_rh_admissao_salvar_dados', { p_token: ADMISSAO, p });
  if(error) return msg('ad-msg', 'Não foi possível salvar agora. Tente de novo.', 'erro');
  if(!data.ok) return msg('ad-msg', data.mensagem, 'erro');
  await telaAdmissao(2);
  msg('ad-msg', data.mensagem, 'ok');
}
async function enviarDocAdmissao(modelo){
  const arq = $('f-' + modelo).files && $('f-' + modelo).files[0];
  if(!arq) return msg('fm-' + modelo, 'Escolha o arquivo ou tire a foto.', 'erro');
  const tipo = arq.type || (/\.pdf$/i.test(arq.name) ? 'application/pdf' : 'image/jpeg');
  if(arq.size > ADM.doc_max_mb * 1024 * 1024) return msg('fm-' + modelo, `O arquivo passa de ${ADM.doc_max_mb} MB.`, 'erro');
  msg('fm-' + modelo, 'Enviando…', 'info');
  try{
    const { data: e, error: e1 } = await db.functions.invoke('rh-token', { body: { token: ADMISSAO, modelo, nome: arq.name, tamanho: arq.size, tipo } });
    if(e1 || !e || !e.caminho){ let m = 'Não foi possível enviar agora.'; try { m = (await e1.context.json()).erro || m; } catch(x){} return msg('fm-' + modelo, m, 'erro'); }
    const { error: e2 } = await db.storage.from('rh-arquivos').uploadToSignedUrl(e.caminho, e.token_envio, arq, { contentType: tipo });
    if(e2) return msg('fm-' + modelo, 'O envio falhou. Tente de novo.', 'erro');
    const { data: r } = await db.rpc('fn_rh_admissao_doc_registrar', { p_token: ADMISSAO, p_modelo: modelo, p_path: e.caminho, p_nome: arq.name });
    if(!r || !r.ok) return msg('fm-' + modelo, (r && r.mensagem) || 'O envio falhou.', 'erro');
    await telaAdmissao(2);
    const alvo = $('doc-' + modelo); if(alvo && alvo.scrollIntoView) alvo.scrollIntoView({ block:'center' });
  }catch(x){ msg('fm-' + modelo, 'O envio falhou. Tente de novo.', 'erro'); }
}
async function assinarContrato(){
  if(!$('as-ok').checked) return msg('as-msg', 'Marque que leu e concorda com o contrato.', 'erro');
  const traco = PAD && PAD.desenhou() ? PAD.dataURL() : null;
  const { data, error } = await db.rpc('fn_rh_admissao_assinar', { p_token: ADMISSAO, p_nome: ($('as-nome').value || '').trim(), p_cpf: $('as-cpf').value, p_traco: traco });
  if(error) return msg('as-msg', 'Não foi possível registrar agora. Tente de novo.', 'erro');
  if(!data.ok) return msg('as-msg', data.mensagem + (data.tentativas_restantes != null ? ` Tentativas restantes: ${data.tentativas_restantes}.` : ''), 'erro');
  await telaAdmissao(3);
}
// "Enviar tudo e fechar": se falta algo, mostra o quê e deixa enviar assim mesmo
async function enviarTudoAdm(mesmoAssim){
  const { data, error } = await db.rpc('fn_rh_admissao_finalizar', { p_token: ADMISSAO, p_mesmo_assim: !!mesmoAssim });
  if(error) return msg('env-msg', 'Não foi possível enviar agora. Tente de novo.', 'erro');
  if(!data.ok){
    if(!data.faltam) return msg('env-msg', data.mensagem, 'erro');
    $('env-msg').innerHTML = `<div class="msg msg-aviso">${esc(data.mensagem)}</div>
      <button class="btn-sec" style="width:100%" onclick="enviarTudoAdm(true)">Enviar assim mesmo (completo depois pelo mesmo link)</button>`;
    return;
  }
  tela(`<div class="card" style="text-align:center"><div style="font-size:40px">✅</div><h2>Enviado!</h2>
    <div class="msg msg-ok">${esc(data.mensagem)}</div>
    <p class="mut">Guarde este link: é por ele que você volta se o RH pedir algum ajuste.</p>
    <button class="btn" onclick="window.close()">Fechar esta página</button>
    <p class="mut" id="fechar-dica" style="margin-top:10px">Se a página não fechar, pode fechar a aba do navegador.</p></div>`);
  try { window.close(); } catch(e){}
}

// ===================== AVALIAÇÃO DE DESEMPENHO PELO LINK (?avaliar=) — Fase 4A =====================
// Para quem não tem login (campo). O link abre SÓ esta avaliação; ao enviar, a

const AVALIAR = (QS.get('avaliar') || '').trim();
const RESULTADO = (QS.get('resultado') || '').trim();
const REL_TXT = { auto:'Sua autoavaliação', gestor:'Avaliação de quem você lidera', par:'Avaliação de um colega', liderado:'Avaliação do seu gestor' };
let AV = null;
async function telaAvaliar(){
  const { data, error } = await db.rpc('fn_rh_avaliacao_por_token', { p_token: AVALIAR });
  if(error) return tela(`<div class="card"><div class="msg msg-erro">Não foi possível abrir agora. Tente de novo em alguns minutos.</div></div>`);

    esc({ enviada:'Esta avaliação já foi enviada. Obrigado!', fechada:'O prazo desta avaliação terminou. Fale com o RH.', invalido:'Este link não é válido ou venceu. Peça um novo ao RH.' }[data.situacao] || 'Link indisponível.')}</div></div>`);
  AV = data.avaliacao;

        ${a.relacao === 'par' || a.relacao === 'liderado' ? ' <b>Sua resposta é anônima</b>: só aparece somada à de outras pessoas, e só se houver respostas suficientes.' : ''}</div></div>
    ${a.competencias.map(c => `<div class="card"><h3 style="margin-top:0">${esc(c.nome)}</h3>${c.descricao ? `<div class="mut">${esc(c.descricao)}</div>` : ''}
      ${c.niveis.length ? `<ul class="ancoras">${c.niveis.map(n => `<li><b>${n.nivel}</b> — ${esc(n.ancora)}</li>`).join('')}</ul>` : ''}
      <div class="escala" role="radiogroup" aria-label="${esc(c.nome)}">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="n-${c.id}" value="${n}" ${c.nota === n ? 'checked' : ''}> ${n}</label>`).join('')}

    <div class="card"><label for="av-com">Comentário geral (opcional)</label><textarea id="av-com" rows="3">${esc(a.comentario || '')}</textarea>
      <label for="av-doc">Seu CPF ou matrícula (para enviar)</label><input id="av-doc" inputmode="numeric" autocomplete="off">
      <div class="mut">Só para conferir que é você. O número não fica guardado na avaliação.</div>

function respostasAvaliar(){
  return AV.competencias.map(c => { const r = document.querySelector(`input[name="n-${c.id}"]:checked`);
    return r ? { competencia_id: c.id, nota: r.value === '' ? null : Number(r.value), comentario: ($('c-' + c.id).value || '').trim() || null } : null; }).filter(Boolean);
}
async function salvarAvaliar(enviar){
  const { data, error } = await db.rpc('fn_rh_avaliacao_salvar_token', { p_token: AVALIAR, p_respostas: respostasAvaliar(),
    p_comentario: ($('av-com').value || '').trim() || null, p_enviar: enviar, p_doc: enviar ? $('av-doc').value : null });
  if(error) return msg('av-msg', 'Não foi possível salvar agora. Tente de novo.', 'erro');

  if(data.status === 'enviada') return tela(`<div class="card" style="text-align:center"><div style="font-size:40px">✅</div><h2>Avaliação enviada</h2>
    <div class="msg msg-ok">${esc(data.mensagem)}</div><p class="mut">Pode fechar esta página.</p></div>`);
  msg('av-msg', data.mensagem, 'ok');
}

  tela(`<div class="card"><h2>Seu Plano de Desenvolvimento (PDI)</h2><div class="mut">${esc(c.titulo)} · com ${esc(c.gestor)} · ${fmtData(c.inicio)} a ${fmtData(c.fim)}</div>
      ${c.objetivo ? `<p><b>Objetivo:</b> ${esc(c.objetivo)}</p>` : ''}</div>
    <div class="card"><h3 style="margin-top:0">Ações combinadas</h3>${c.acoes.map(a => `<div class="campo"><b>${esc(a.titulo)}</b>${a.descricao ? `<div>${esc(a.descricao)}</div>` : ''}
        <div class="mut">${esc(TIPO_ACAO[a.tipo] || a.tipo)}${a.competencia ? ' · ' + esc(a.competencia) : ''} · ${a.responsavel === 'gestor' ? 'o gestor faz' : 'você faz'} · até ${fmtData(a.prazo)}</div></div>`).join('')}
      <p class="mut" style="word-break:break-all">Código deste conteúdo (SHA-256): ${esc(data.conteudo_hash)}</p></div>
    <div class="card"><h3>Assinar o acordo</h3>
      <div class="msg msg-info">Assinar confirma que você <b>combinou</b> este plano com o seu gestor. Se quiser, escreva um comentário: ele fica junto do registro.</div>
      <label for="pdi-nome">Seu nome completo</label><input id="pdi-nome" autocomplete="name">
      <label for="pdi-doc">CPF ou matrícula</label><input id="pdi-doc" inputmode="numeric" autocomplete="off">
      <label for="pdi-com">Comentário (opcional)</label><textarea id="pdi-com"></textarea>
      <label>Assine no quadro, com o dedo ou o mouse</label><canvas id="pad" aria-label="Quadro de assinatura"></canvas>
      <button class="btn-sec" style="margin-top:6px" onclick="PAD && PAD.limpar()">Limpar o quadro</button>
      <div id="pdi-msg"></div><button class="btn" style="margin-top:12px;width:100%" onclick="assinarPdi()">Assinar o acordo</button></div>`);
  PAD = montarPad($('pad'));
}
async function assinarPdi(){
  const { data, error } = await db.rpc('fn_rh_pdi_assinar_token', { p_token: PDI, p_nome: ($('pdi-nome').value || '').trim(), p_doc: $('pdi-doc').value,
    p_comentario: ($('pdi-com').value || '').trim() || null, p_traco: PAD && PAD.desenhou() ? PAD.dataURL() : null });
  if(error) return msg('pdi-msg', 'Não foi possível registrar agora. Tente de novo.', 'erro');
  if(!data.ok) return msg('pdi-msg', data.mensagem, 'erro');
  tela(`<div class="card" style="text-align:center"><div style="font-size:40px">✅</div><h2>Acordo assinado</h2><div class="msg msg-ok">${esc(data.mensagem)}</div></div>`);
}

// ===================== PESQUISA DE CLIMA (?pesquisa=) — Fase 4D =====================
// Anônima: o link só serve para saber que ESTA pessoa pode responder uma vez; a resposta
// é gravada sem nenhum dado dela (nem o link). Não pede nome, CPF nem matrícula.
const PESQUISA = (QS.get('pesquisa') || '').trim();
let PQ = null;
async function telaPesquisa(){
  const { data, error } = await db.rpc('fn_rh_pesquisa_por_token', { p_token: PESQUISA });
  if(error) return tela(`<div class="card"><div class="msg msg-erro">Não foi possível abrir agora. Tente de novo em alguns minutos.</div></div>`);
  if(data.situacao !== 'aberta') return tela(`<div class="card"><h2>Pesquisa</h2><div class="msg msg-${data.situacao === 'respondida' ? 'ok' : 'aviso'}">${
    esc({ respondida:'Você já respondeu esta pesquisa. Obrigado!', fechada:'Esta pesquisa já foi encerrada.', invalido:'Este link não é válido ou venceu.' }[data.situacao] || 'Link indisponível.')}</div></div>`);
  PQ = data.pesquisa; let dim = null;
  tela(`<div class="card"><h2>${esc(PQ.titulo)}</h2><div class="msg msg-info">${esc(PQ.instrucoes || '')} <b>Sua resposta é anônima</b>: é guardada sem o seu nome,
      e o resultado só aparece somado, com pelo menos ${PQ.min_respostas} respostas. Aberta até ${fmtData(PQ.fim)}.</div></div>
    ${PQ.perguntas.map(q => { const cab = q.dimensao !== dim ? `<div class="secao" style="margin:14px 0 6px">${esc(q.dimensao)}</div>` : ''; dim = q.dimensao;
      const op = n => `<label><input type="radio" name="q-${q.id}" value="${n}"> ${n}</label>`;
      return cab + `<div class="card"><div style="margin-bottom:6px">${esc(q.texto)}</div>${q.tipo === 'escala' ? `<div class="escala">${[1, 2, 3, 4, 5].map(op).join('')}</div><div class="mut">1 = discordo totalmente · 5 = concordo totalmente</div>`
        : q.tipo === 'enps' ? `<div class="escala">${Array.from({ length: 11 }, (_, n) => op(n)).join('')}</div><div class="mut">0 = de jeito nenhum · 10 = com certeza</div>`
        : `<textarea id="t-${q.id}" rows="3" maxlength="2000" placeholder="opcional — evite citar nomes"></textarea>`}</div>`; }).join('')}
    <div class="card"><div id="pq-msg"></div><button class="btn" style="width:100%" onclick="enviarPesquisaLink()">Enviar (anônimo)</button></div>`);
}
async function enviarPesquisaLink(){
  const r = {};
  PQ.perguntas.forEach(q => { if(q.tipo === 'texto'){ const t = ($('t-' + q.id).value || '').trim(); if(t) r[q.id] = t; }
    else { const x = document.querySelector(`input[name="q-${q.id}"]:checked`); if(x) r[q.id] = Number(x.value); } });
  const { data, error } = await db.rpc('fn_rh_pesquisa_responder_token', { p_token: PESQUISA, p_respostas: r });
  if(error) return msg('pq-msg', 'Não foi possível enviar agora. Tente de novo.', 'erro');
  if(!data.ok) return msg('pq-msg', data.mensagem, 'erro');
  tela(`<div class="card" style="text-align:center"><div style="font-size:40px">✅</div><h2>Obrigado!</h2><div class="msg msg-ok">${esc(data.mensagem)}</div></div>`);
}

// ===================== QUESTIONÁRIO DE ONBOARDING / DESLIGAMENTO (?questionario=) — Fase 6A =====================
// Identificado e confidencial ao RH (o gestor não lê) — a página diz isso antes das perguntas.
const QUESTIONARIO = (QS.get('questionario') || '').trim();
let QQ = null;
async function telaQuestionario(){
  const { data, error } = await db.rpc('fn_rh_questionario_por_token', { p_token: QUESTIONARIO });
  if(error) return tela(`<div class="card"><div class="msg msg-erro">Não foi possível abrir agora. Tente de novo em alguns minutos.</div></div>`);
  if(data.situacao !== 'aberto') return tela(`<div class="card"><div class="msg msg-${data.situacao === 'respondido' ? 'ok' : 'aviso'}">${
    esc(data.situacao === 'respondido' ? 'Você já respondeu. Obrigado!' : 'Este link não é válido ou venceu. Peça um novo ao RH.')}</div></div>`);
  QQ = data;
  const desl = data.tipo === 'desligamento';
  tela(`<div class="card"><h2>${desl ? 'Entrevista de desligamento' : 'Como estão os seus primeiros dias?'}</h2>
      <p>Olá, ${esc(data.nome)}! ${desl ? 'Queremos entender a sua saída para melhorar a Ambimet.' : 'Queremos saber como está sendo a sua chegada à Ambimet.'}</p>
      <div class="msg msg-info">Este questionário é <b>identificado</b> e <b>só o RH lê</b> — o seu gestor não vê as respostas.</div></div>
    ${data.perguntas.map(p => `<div class="card"><div style="margin-bottom:6px">${esc(p.texto)}${p.obrigatoria ? '' : ' <span class="mut">(opcional)</span>'}</div>
      ${p.resposta === 'escala' ? `<div class="escala">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="q-${p.ordem}" value="${n}"> ${n}</label>`).join('')}</div><div class="mut">1 = discordo totalmente · 5 = concordo totalmente</div>`
        : p.resposta === 'sim_nao' ? `<div class="escala"><label><input type="radio" name="q-${p.ordem}" value="sim"> Sim</label><label><input type="radio" name="q-${p.ordem}" value="nao"> Não</label></div>`
        : `<textarea id="q-${p.ordem}" rows="3" maxlength="2000"></textarea>`}</div>`).join('')}
    <div class="card"><div id="qq-msg"></div><button class="btn" style="width:100%" onclick="enviarQuestionarioLink()">Enviar</button></div>`);
}
async function enviarQuestionarioLink(){
  const r = {};
  QQ.perguntas.forEach(p => { if(p.resposta === 'texto'){ const t = ($('q-' + p.ordem).value || '').trim(); if(t) r[p.ordem] = t; }
    else { const x = document.querySelector(`input[name="q-${p.ordem}"]:checked`); if(x) r[p.ordem] = p.resposta === 'escala' ? Number(x.value) : x.value; } });
  const { data, error } = await db.rpc('fn_rh_questionario_responder_token', { p_token: QUESTIONARIO, p_respostas: r });
  if(error) return msg('qq-msg', 'Não foi possível enviar agora. Tente de novo.', 'erro');
  if(!data.ok) return msg('qq-msg', data.mensagem, 'erro');
  tela(`<div class="card" style="text-align:center"><div style="font-size:40px">✅</div><h2>Obrigado!</h2><div class="msg msg-ok">${esc(data.mensagem)}</div></div>`);
}

// ===================== INÍCIO =====================
(function(){
  $('versao').textContent = VERSAO;
  // página com token (assinar, acompanhar, prova, perfil, proposta) nunca vai para o buscador
  if(TOKEN || ACOMP || PROVA || PERFIL || PROPOSTA || ADMISSAO || AVALIAR || RESULTADO || PDI || PESQUISA || QUESTIONARIO){ const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex, nofollow'; document.head.appendChild(m); }
  if(TOKEN) return telaAssinar();
  if(ACOMP) return telaAcompanhar();
  if(PROVA) return telaProva();
  if(PERFIL) return telaPerfil();
  if(PROPOSTA) return telaProposta();
  if(ADMISSAO) return telaAdmissao();
  if(AVALIAR) return telaAvaliar();
  if(RESULTADO) return telaResultado();
  if(PDI) return telaPdi();
  if(PESQUISA) return telaPesquisa();
  if(QUESTIONARIO) return telaQuestionario();
  if(VAGA) return telaVaga();
  telaLista();
})();
</script><div style="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#B45309;color:#fff;font:600 12px/1.4 system-ui,sans-serif;text-align:center;padding:3px 8px">HOMOLOGAÇÃO — pessoas e dados fictícios. Nada aqui vale como registro oficial.</div>
